# ==============================================================================
# WanOS Master Configuration File
# ==============================================================================

# ==============================================================================
# 1. INTEGRATIONS & NETWORK LAYER
# ==============================================================================
wanos:
  mqtt:
    broker_host: "localhost"
    port: 1883
    username: "st"
    # password in .env

domoticz:
  mqtt:
    broker_host: "10.32.251.181"
    port: 1883
    username: "st0001"
    # password in .env
  http:
    host: "10.32.251.181"
    port: 8080
    username: "updatesensors"
    # password in .env

epson:
  ip_address: "10.32.251.75"

weather:
  location: "Borsbeek,BE"
  poll_interval_mins: 30

rfxcom:
  # To find the exact USB port run: dmesg | grep tty OR lsusb
  serial_port: "/dev/rfxcom"

# --- Declarative translation mapping for physical 433MHz signals ---
native_rfx:
  - name: "cinema schemer"
    virtual_idx: 40001  # RFX1
    protocol: "Lighting4"
    on_id: "541555"
    off_id: "541554"
  - name: "buro Wannes schemer"
    virtual_idx: 40002  # RFX2
    protocol: "Lighting4"
    on_id: "544555"
    off_id: "544554"
  - name: "living schemer"
    virtual_idx: 40003  # RFX3
    protocol: "Lighting4"
    on_id: "545155"
    off_id: "545154"
  - name: "kerstboom"
    virtual_idx: 40004  # RFX4
    protocol: "Lighting4"
    on_id: "545455"
    off_id: "545454"


# ==============================================================================
# 2. PRESENTATION LAYER (UI MAPPINGS)
# ==============================================================================
# Maps raw numeric IDXs to semantic names exclusively for the frontend UI.
dashboard:
  # --- Core System & Hardware ---
  8: "pc"
  9: "pc_power"
  9618: "pc_aux"
  9622: "pc_aux_power"
  8567: "safety_ssr"

  # --- Environment ---
  30001: "outside"

  # --- Wellness & Sauna ---
  7550: "sauna"
  7551: "ir"
  1500: "sauna_zoutlamp"
  8577: "sauna_extrvent"
  10001: "door_sauna"
  20001: "sauna_high"
  20002: "sauna_low"

  # --- Bathroom 1 ---
  141: "bathroom1_main"
  7555: "bathroom1_wastafel"
  7558: "bathroom1_ventilator"
  10002: "door_bathroom1"
  20004: "bathroom1"

  # --- Ground Floor ---
  60: "gang_beneden"

  # --- First Floor ---
  169: "gang_boven"
  282: "buro"
  283: "cinema_main"
  20003: "cinema"

# ⚡ Devices explicitly hidden from the Device Explorer UI
deviceexplorer_exclude:
  - 8     # PC itself
  - 8567  # Wisc safety SSR
  - 7550  # Sauna
  - 7551  # IR
  - 1612  # toilet ventilatie motor (= sync'd met knop binnen)
  - 1625  # badk 2e binnen (= unused & sync'd met knop buiten)
  - 6070  # slpk Wannes hue switch aan deur
  - 80001 # Epson projector


# ==============================================================================
# 3. DOMAIN RUNTIME PARAMETERS
# ==============================================================================
sauna:
  default_sauna_setpoint: 80     # Default sauna temperature setpoint
  max_temp: 95                   # Maximum setpoint that can be set in the UI
  kp: 3.0                        # PID Proportional
  ki: 0.01                       # PID Integral
  kd: 0.0                        # PID Derivative
  default_timer: 70              # Default sauna duration in minutes
  vent_delay_mins: 1             # Cooldown wait time before starting the extraction fan
  vent_run_mins: 160             # Duration the extraction fan runs
  timer_offset_temp: 7.0         # Frozen countdown: triggers when temp >= (Setpoint - Offset)

ir:
  default_ir_modulation: 75      # Default IR power modulation (75%)
  min_time_mins: 5
  max_time_mins: 20

bathroom1:
  vent_on_humidity: 80           # Auto-engage fan above this %
  vent_off_humidity: 74          # Auto-disengage fan below this %
  vent_min_runtime_mins: 5       # Minimum time the fan must run before auto-disengaging

# 🌍 The Daily Time-Series Engine (Environmental Bounds)
environmental_schedule:
  blinds:
    morning_open_earliest: "07:30"
    morning_open_latest: "09:00"
    evening_close_earliest: "16:30"
    evening_close_latest: "22:00"
  twilight:
    evening_off_time: "23:00"
    morning_on_time: "06:00"


lighting:
  # The engine will ONLY apply auto-off rules to IDXs explicitly listed here
  managed_lights: [52, 53, 60, 100, 141, 169, 282, 283, 348, 411, 1524, 1622, 40001, 40002, 40003, 40004, 6051, 6060, 6067, 51006, 51003, 51005, 51008, 51004, 9645, 9648]
  default_auto_off_minutes: 300
  # Specific delay overrides in minutes
  auto_off_delays:
    100: 10
    141: 120
    169: 10
    348: 5
    411: 1
    1524: 30
    1622: 30
    6051: 1
    6060: 30
    6067: 30
    51006: 90
    51008: 30
    9645: 15
    9648: 5


# ==============================================================================
# 4. AUTOMATION RULES & SCENES
# ==============================================================================
automations:

  # --------------------------------------------------------------------------
  # 🌍 ENVIRONMENTAL SCHEDULER: BLINDS & TWILIGHT
  # --------------------------------------------------------------------------
  - name: "Morning Blinds Open"
    trigger:
      event: "BLINDS_OPEN_TRIGGER"
    actions:
      - idx: 55    # gv L
        state: "0"
      - idx: 71    # gv R
        state: "0"
      - idx: 548   # 1eV sauna
        state: "0"
      - idx: 583   # 1eV schuifraam
        state: "0"

  - name: "Evening Blinds Close"
    trigger:
      event: "BLINDS_CLOSE_TRIGGER"
    actions:
      - idx: 55    # gv L
        state: "100"
      - idx: 71    # gv R
        state: "100"
      - idx: 548   # 1eV sauna
        state: "100"
      - idx: 583   # 1eV schuifraam
        state: "100"

  - name: "Tuinlichten & kerststuff aan 's avonds"
    trigger:
      - event: "TWILIGHT_EVENING_ON_TRIGGER"
    actions:
      - idx: 7396 # Licht tuin
        state: "ON"
      - idx: 40004 # Kerstboom
        state: "ON"
      - idx: 9627 # kerstverl tuin achter
        state: "ON"
      - idx: 40004 # kerstverl voortuin (Assuming duplicate IDX is intentional RFX bridging)
        state: "ON"

  - name: "Tuinlichten & kerststuff uit 's avonds"
    trigger:
      - event: "TWILIGHT_EVENING_OFF_TRIGGER"
    actions:
      - idx: 7396 # Licht tuin
        state: "OFF"
      - idx: 40004 # Kerstboom
        state: "OFF"
      - idx: 9627 # kerstverl tuin achter
        state: "OFF"
      - idx: 40004 # kerstverl voortuin
        state: "OFF"

  - name: "Kerstverlichting voor & achter aan 's morgens"
    trigger:
      - event: "TWILIGHT_MORNING_ON_TRIGGER"
    actions:
      - idx: 9627 # kerstverl tuin achter
        state: "ON"
      - idx: 40004 # kerstverl voortuin
        state: "ON"

  - name: "Kerstverlichting voor & achter uit 's morgens"
    trigger:
      - event: "TWILIGHT_MORNING_OFF_TRIGGER"
    actions:
      - idx: 9627 # kerstverl tuin achter
        state: "OFF"
      - idx: 40004 # kerstverl voortuin
        state: "OFF"

  - name: "Tuinlichten Evening ON"
    trigger:
      event: "TWILIGHT_EVENING_ON_TRIGGER"
    actions:
      - idx: 7396 # Licht tuin
        state: "ON"

  - name: "Tuinlichten Evening OFF"
    trigger:
      event: "TWILIGHT_EVENING_OFF_TRIGGER" # Fires exactly at 23:00 (or config setting)
    actions:
      - idx: 7396
        state: "OFF"

  # --------------------------------------------------------------------------
  # 🎛️ MANUALLY TRIGGERED SCENES (UI Visible)
  # --------------------------------------------------------------------------
  - name: "ALL OFF gv"
    scene: true
    trigger:
      event: "SCENE_GV_OFF"
    actions:
      - idx: 60       # gang beneden
        state: "OFF"
      - idx: 52       # licht living
        state: "OFF"
      - idx: 53       # licht keuken
        state: "OFF"
      - idx: 411      # licht voorraad
        state: "OFF"
      - idx: 6060     # licht eetkamer
        state: "OFF"
      - idx: 40003    # licht living schemer groot (via RFX3)
        state: "OFF"
      - idx: 40004    # licht kerstboom (via RFX4)
        state: "OFF"
      - idx: 9645     # licht toilet
        state: "OFF"
      - idx: 100      # licht garage
        state: "OFF"
      - idx: 7396     # licht tuin
        state: "OFF"
      - idx: 51012 # Hue gv ALL OFF
        state: "OFF"

  - name: "ALL OFF 1eV"
    scene: true
    trigger:
      event: "SCENE_VERDIEP1_OFF"
    actions:
      - idx: 283  # cinema_main
        state: "OFF"
      - idx: 40001 # cinema_schemer
        state: "OFF"
      - idx: 282  # buro
        state: "OFF"
      - idx: 40002 # buro_schemer
        state: "OFF"
      - idx: 9618  # pc_aux
        state: "OFF"
      - idx: 141  # bathroom1_main
        state: "OFF"
      - idx: 169  # gang_boven
        state: "OFF"
      - idx: 51010 # Hue 1e V ALL OFF
        state: "OFF"

  - name: "ALL OFF 2eV"
    scene: true
    trigger:
      event: "SCENE_VERDIEP2_OFF"
    actions:
      - idx: 169  # gang_boven
        state: "OFF"
      - idx: 170  # badkamer groot
        state: "OFF"
      - idx: 1524 # slpk Dries
        state: "OFF"
      - idx: 6048 # slpk Liene
        state: "OFF"
      - idx: 6051 # berging
        state: "OFF"
      - idx: 6067 # slpk Wannes
        state: "OFF"
      - idx: 51009 # Hue 2e V ALL OFF
        state: "OFF"

  - name: "ALL OFF overal"
    scene: true
    trigger:
      event: "SCENE_ALL_OFF"
    actions:
      - event: "SCENE_GV_OFF"
      - event: "SCENE_VERDIEP1_OFF"
      - event: "SCENE_VERDIEP2_OFF"

  - name: "GoCosy gv"
    scene: true
    trigger:
      event: "SCENE_GOCOSY"
    actions:
      - idx: 52
        state: "OFF"
      - idx: 51005    # Hue living
        state: "ON"
        bri: 254
        xy: [0.6915, 0.3083] # Relaxing deep red
      - idx: 40003    # licht living schemer groot (via RFX3)
        state: "ON"
      - idx: 40004    # licht kerstboom (via RFX4)
        state: "ON"

  # --------------------------------------------------------------------------
  # 💡 ROOM MACROS & LIGHTING CHAINS
  # --------------------------------------------------------------------------
  - name: "Slpk_Dries"
    trigger:
      idx: 1524
      state: "SYNC"
    actions:
      - idx: 51008 # Hue
        state: "SYNC"

  - name: "KeukenLivingEetk_EetkHue"
    trigger:
      - idx: 52   # Living
        state: "ON"
      - idx: 53   # Keuken
        state: "ON"
      - idx: 6060 # Eetkamer
        state: "ON"
    actions:
      - idx: 51003 # Eetkamer Hue
        state: "ON"

  - name: "BuroCinemaPC_cosy"
    trigger:
      - idx: 282  # Buro
        state: "ON"
    actions:
      - idx: 40001 # Cinema schemer klein
        state: "ON"
      - idx: 40002 # Buro schemer
        state: "ON"

  - name: "garage_motion"
    trigger:
      idx: 106  # garage motion
      state: "ON"
    conditions:
      - type: "time_of_day"
        is: "dark"
    actions:
      - idx: 100 # licht garage
        state: "ON"

  - name: "achterdeur_waskot"
    trigger:
      idx: 94  # achterdeur
      state: "ON"
    actions:
      - idx: 348 # licht waskot
        state: "ON"

  - name: "garage_waskot_OFF"
    trigger:
      idx: 100  # licht garage
      state: "OFF"
    actions:
      - idx: 348  # licht waskot
        state: "OFF"

  - name: "gang_boven_berging_OFF"
    trigger:
      idx: 169  # gang boven
      state: "OFF"
    actions:
      - idx: 6051  # berging
        state: "OFF"

  # --------------------------------------------------------------------------
  # 🛋️ LIVING ROOM: "SPARE" SMART BUTTON (IDX 6689)
  # --------------------------------------------------------------------------

  # --- Scenario 1: Room is already active -> Shut down the house ---
  - name: "Spare Button: Hue is ON -> Trigger ALL OFF"
    trigger:
      - idx: 6689
        state: "ON"
      - idx: 6689
        state: "OFF"
    conditions:
      - type: "device_state"
        idx: 51005       # living hue room
        is: "ON"         # 🛡️ Only fires if the living room is already lit
    actions:
      - event: "SCENE_ALL_OFF"   # Note: Change to SCENE_GV_OFF if you only want the ground floor to turn off!

  # --- Scenario 2: Room is Dark AND it's nighttime -> Go Cosy ---
  - name: "Spare Button: Hue OFF + Night -> Go Cosy"
    trigger:
      - idx: 6689
        state: "ON"
      - idx: 6689
        state: "OFF"
    conditions:
      - type: "device_state"
        idx: 51005
        is: "OFF"        # Condition A: Room is currently off
      - type: "time_of_day"
        is: "dark"       # Condition B: Sun has set
    actions:
      - event: "SCENE_GOCOSY"

  # --- Scenario 3: Room is Dark AND it's daytime -> Red Accent ---
  - name: "Spare Button: Hue OFF + Day -> Red Accent"
    trigger:
      - idx: 6689
        state: "ON"
      - idx: 6689
        state: "OFF"
    conditions:
      - type: "device_state"
        idx: 51005
        is: "OFF"        # Condition A: Room is currently off
      - type: "time_of_day"
        is: "light"      # Condition B: Sun is still up
    actions:
      - idx: 51005       # living hue room
        state: "ON"
        bri: 254
        xy: [ 0.6915, 0.3083 ] # Deep red
      - idx: 52          # living main
        state: "OFF"     # Turn off the traditional lights (Ensure this doesn't cut power to the Hue!)

  # --------------------------------------------------------------------------
  # ⚙️ HARDWARE SYNC & SYSTEM MACROS
  # --------------------------------------------------------------------------
  - name: "PC ON/OFF -> PC Aux ON/OFF"
    trigger:
      idx: 8
      state: "SYNC"
    actions:
      - idx: 9618
        state: "SYNC"

  - name: "PC Aux ON -> Buro Schemer ON (#Only if Dark)"
    trigger:
      idx: 9618
      state: "ON"
    actions:
      - idx: 40002
        state: "ON"

  - name: "PC Aux OFF -> Buro Schemer OFF"
    trigger:
      idx: 9618
      state: "OFF"
    actions:
      - idx: 40002
        state: "OFF"

  - name: "toilet_gv_ventilatie_on"
    trigger:
      idx: 9648  # toilet ventilatie knop
      state: "SYNC"
    actions:
      - idx: 1612 # ventilatie motor
        state: "SYNC"

  - name: "badkamer_2e_SyncBinnenBuiten"
    trigger:
      idx: 170  # badkamer groot buiten
      state: "SYNC"
    actions:
      - idx: 1625  # badkamer groot binnen
        state: "SYNC"

  - name: "badkamer_2e_off"
    trigger:
      idx: 170  # badkamer groot buiten
      state: "OFF"
    actions:
      - idx: 171  # badkamer wastafel
        state: "OFF"

  - name: "gocosy-savonds"
    trigger:
      event: TWILIGHT_EVENING_ON_TRIGGER
    conditions:
      - type: "device_state"
        idx: 52  # licht living
        is: "ON"
    actions:
      - event: SCENE_GOCOSY

# --------------------------------------------------------------------------
  # 🛁 BATHROOM 1 (1e) LIGHTING & HUE SYNC
  # --------------------------------------------------------------------------

  # --- Wastafel (Sink) Logic: Split into Day/Night context ---
  - name: "Badk 1e: Wastafel ON -> Hue White (If already in room)"
    trigger:
      idx: 7555          # badkamer 1e wastafel
      state: "ON"
    conditions:
      - type: "device_state"
        idx: 51001       # badkamer 1e hue room
        is: "ON"         # Only fires if the room is already lit
    actions:
      - idx: 51001
        state: "ON"
        bri: 100
        xy: [0.3127, 0.3290] # Pure crisp white for mirror use

  - name: "Badk 1e: Wastafel ON -> Hue Red (If room was dark)"
    trigger:
      idx: 7555
      state: "ON"
    conditions:
      - type: "device_state"
        idx: 51001
        is: "OFF"        # Fires if this is the first light turned on
    actions:
      - idx: 51001
        state: "ON"
        bri: 254
        xy: [0.6915, 0.3083] # Relaxing deep red

  # --- Main Bathroom Switch (141) Master Control ---
  - name: "Badk 1e: Main Switch ON -> Hue Red"
    trigger:
      idx: 141           # badkamer 1e groot switch
      state: "ON"
    actions:
      - idx: 51001       # badkamer 1e hue room
        state: "ON"
        bri: 254
        xy: [0.6915, 0.3083] # Relaxing deep red

  - name: "Badk 1e: Main Switch OFF -> Hue & wastafel OFF"
    trigger:
      idx: 141
      state: "OFF"
    actions:
      - idx: 51001
        state: "OFF"
      - idx: 7555  # badkamer wastafel
        state: "OFF"

  # --- Hue App Override Sync (Bidirectional support) ---
  - name: "Badk 1e: Hue App Syncs to Main Switch"
    trigger:
      idx: 51001         # If someone uses the Hue app/remote...
      state: "SYNC"
    actions:
      - idx: 141         # ...the Domoticz relay physically follows suit.
        state: "SYNC"

  # --------------------------------------------------------------------------
  # 🛏️ SLPK WANNES LIGHTING & HUE SYNC
  # --------------------------------------------------------------------------

  # --- Physical Switch Master Control ---
  - name: "Slpk Wannes: Switch ON -> Hue Red (If Room was Dark)"
    trigger:
      idx: 6070          # slpk Wannes nachtlichtjes (2e switch)
      state: "ON"
    conditions:
      - type: "device_state"
        idx: 51006       # room: slpk Wannes-rm
        is: "OFF"        # 🛡️ Anti-Overwrite Guard: Only applies Red if the room was off
    actions:
      - idx: 51006
        state: "ON"
        bri: 254
        xy: [ 0.6915, 0.3083 ] # Deep red

  - name: "Slpk Wannes: Switch OFF -> Hue OFF"
    trigger:
      idx: 6070
      state: "OFF"
    actions:
      - idx: 51006
        state: "OFF"

  # --- Hue App Override Sync (Bidirectional support) ---
  - name: "Slpk Wannes: Hue App Syncs to Switch"
    trigger:
      idx: 51006         # If Wannes uses the Hue app/remote...
      state: "SYNC"
    actions:
      - idx: 6070        # ...the physical Domoticz relay UI follows suit.
        state: "SYNC"

  # --------------------------------------------------------------------------
  # 🧖‍♂️ SAUNA AUTOMATIONS
  # --------------------------------------------------------------------------
  - name: "Sauna Lights ON"
    trigger:
      event: "SAUNA_ON"
    actions:
      - target: "hue_scene"
        scene: "hue_sauna_rm_savanne_zonsondergang"
      - idx: 1500
        state: "ON"  # Sauna zoutlamp

  - name: "Sauna OFF -> Hue Off"
    trigger:
      event: "SAUNA_OFF"
    actions:
      - idx: 51002  # Sauna Hue alles
        state: "OFF"
      - idx: 1500
        state: "OFF"  # Sauna zoutlamp

  # --------------------------------------------------------------------------
  # 🍿 CINEMA MODE SCENES
  # --------------------------------------------------------------------------

  - name: "CINEMA ON"
    scene: true
    trigger:
      event: "SCENE_CINEMA_ON"
    actions:
      - idx: 80001    # Epson Projector
        state: "FORCE_ON"
      - idx: 583      # 1eV schuifraam (blinds)
        state: "100"  # 100 = Closed
      # Turn off surrounding lights and PC aux
      - idx: 282      # buro
        state: "OFF"
      - idx: 283      # cinema_main
        state: "OFF"
      - idx: 60       # gang beneden
        state: "OFF"
      - idx: 169      # gang boven
        state: "OFF"
      - idx: 9618     # pc_aux
        state: "OFF"
      # --- SONOS PLACEHOLDER ---
      # - idx: XXXXX  # Replace with Domoticz Sonos virtual IDX when available
      #   state: "OFF"
      - idx: 51004    # Hue cinema group
        state: "ON"
        bri: 254
        xy: [0.6744, 0.3212]

  # --- CINEMA OFF: SPLIT INTO TWO RULES FOR IF/ELSE LOGIC ---
  - name: "CINEMA OFF"
    # This one makes it to the dashboard.trigger:
    # It fires the event "SCENE_CINEMA_OFF", both this and "CINEMA OFF (Day)" are then evaluated.
    scene: true
    trigger:
      event: "SCENE_CINEMA_OFF"
    conditions:
      - type: "time_of_day"
        is: "dark"
    actions:
      - idx: 80001    # Epson Projector
        state: "FORCE_OFF"
      - idx: 51004    # Hue cinema group
        state: "OFF"
      - idx: 283      # cinema_main light
        state: "ON"   # Turn on lights because it is dark outside!
  - name: "CINEMA OFF (Day)"
    trigger:
      event: "SCENE_CINEMA_OFF"
    conditions:
      - type: "time_of_day"
        is: "light"
    actions:
      - idx: 80001    # Epson Projector
        state: "FORCE_OFF"
      - idx: 51004    # Hue cinema group
        state: "OFF"
      - idx: 583      # 1eV schuifraam (blinds)
        state: "0"    # Open the blinds to let the daylight back in!

  # --------------------------------------------------------------------------
  # 🧪 TEST & DEBUG MACROS
  # --------------------------------------------------------------------------
  - name: "test Hue1"
    trigger:
      - idx: 7396 # tuinlicht
        state: "ON"
      - idx: 10001 # deur sauna
        state: "ON"  # ON = Open, OFF = Closed
    actions:
      - target: "hue_scene"
        scene: "hue_cinema_rm_tropische_schemering"

  - name: "test Hue2"
    trigger:
      - idx: 7396 # tuinlicht
        state: "OFF"
      - idx: 10001 # deur sauna
        state: "OFF"  # ON = Open, OFF = Closed
    actions:
      - target: "hue_scene"
        scene: "hue_cinema_rm_helder"