# ==============================================================================
# WanOS Master Configuration File
# ==============================================================================
version: "6"

auth:
  cookie_expiry_days: 30
  ban_timeout_mins: 30
  # Magic link tokens for bypassing the PIN pad (e.g. http://10.x.x.x/login.html?token=wall_tablet_123)
  user_token: "user"
  kiosk_token: "kiosk"

# ==============================================================================
# IDX mapping
# ==============================================================================
# 100xx : GPIO inputs (doors / water / power pulses)
# 200xx : SHT11 sensors
# 20101 : sauna temp — virtual composite (0.7×20001 + 0.3×20002); hum from 20001
# 2100x : Sauna & IR virtual
# 220xx : Pi internal sensors (host CPU/mem/disk/load; 22009 = WanOS DB size)
# 30001 : OWM outside temp & hum
# 400xx : RFX
# 500xx : Hue (config_hue.taml)
# 600xx : Sonos
# 610xx : Onkyo
# 700xx : Z-Wave (config_zwave.auto.yaml)
# 71046 : Mains voltage (Z-Wave Node 50)
# 900xxx : scene history synthetic keys (crc32 of event name)

# ==============================================================================
# 1. INTEGRATIONS & NETWORK LAYER
# ==============================================================================
wanos:
  mqtt:
    broker_host: "localhost"
    port: 1883
    username: "st"
    # password in .env

epson:
  ip_address: "10.32.251.75"

sonos:
  max_volume: 70
  device_map:
    60001:
      ip: "10.32.251.121"
      name: "badk boven"
    60002:
      ip: "10.32.251.122"
      name: "living"
    60003:
      ip: "10.32.251.123"
      name: "badk 1e"
    60004:
      ip: "10.32.251.124"
      name: "slpk Wannes"
    60005:
      ip: "10.32.251.125"
      name: "slpk Dries"
    60006:
      ip: "10.32.251.126"
      name: "buro"
  stations:
    qmaxhits: "x-sonosapi-stream:tunein%3a208746?sid=303&flags=8232&sn=1"

onkyo:
  max_volume: 60
  device_map:
    61001:
      ip: "10.32.251.35"
      name: "cinema" #  (Onkyo TX-NR575E)"
      legacy: false
    61002:
      ip: "10.32.251.78"
      name: "living" #  (Onkyo TX-NR616)"
      legacy: true  # Instructs the engine to use the malformed header and 2.0s TCP pacing

rfxcom:
  # To find the exact USB port run: ls -l /dev/serial/by-id/
  serial_port: "/dev/rfxcom"

# --- Declarative translation mapping for physical RFXCom 433MHz signals ---
native_rfx:
# RFXCOM is ID 0403:6001 (Vendor ID: 0403, Product ID: 6001).
# Type & Subtype: Lighting 4, PT2262
  - name: "cinema schemer"
    virtual_idx: 40001  # RFX1
    protocol: "Lighting4"
    on_id: "541555"
    off_id: "541554"
  - name: "buro Wannes schemer"
    virtual_idx: 40002  # RFX2
    protocol: "Lighting4"
    on_id: "544555"
    off_id: "544554"
  - name: "living schemer"
    virtual_idx: 40003  # RFX3
    protocol: "Lighting4"
    on_id: "545155"
    off_id: "545154"
  - name: "kerstboom"
    virtual_idx: 40004  # RFX4
    protocol: "Lighting4"
    on_id: "545455"
    off_id: "545454"
  - name: "kerst lichten voor"
    virtual_idx: 40005  # RFX5
    protocol: "Lighting4"
    on_id: "545511"
    off_id: "545514"


# ==============================================================================
#
# ==============================================================================

weather:
  idx: 30001
  name: "Outside temp & hum"
  location: "Borsbeek,BE"
  poll_interval_mins: 30
  sun_refresh_hour: 3  # once-daily sunrise/sunset + env schedule (≥ this local hour)

hardware_links:
  # Maps switch entity_ids to linked power meter entity_ids.
  # When the switch turns OFF, the backend will auto-flush the power meter to 0.0W.
  power_meters:
    switch.pc: sensor.power.pc_power
    switch.pc_monitors: sensor.power.pc_monitors_power

# Sensor / utility history (power, water, charts) — see docs/sensor_history.md
history:
  timezone: "Europe/Brussels"
  retention:
    hires_days: 7
    hourly_days: 31
    daily_days: 365
  sample:
    kwh_step_wh: 100        # hi-res W sample every 0.1 kWh
    water_step_l: 1.0       # consumption step every liter
    zwave_min_interval_secs: 60
    climate_temp_deadband: 0.5
    climate_hum_deadband: 2.0
    climate_max_interval_secs: 300
  tracked_entities:
    - sensor.energy.kwh_meter
    - sensor.fluid.koud_water
    - sensor.fluid.warm_water
    - sensor.power.pc_power
    - sensor.power.pc_monitors_power

# ==============================================================================
# Automatic sections (deviceexplorer_hide, lighting, automations) live in:
#   automations.auto.yaml
# ==============================================================================
sauna:
  default_sauna_setpoint: 80     # Default sauna temperature setpoint
  min_temp: 50                   # Minimum setpoint that can be set in the UI
  max_temp: 95                   # Maximum setpoint that can be set in the UI
  kp: 3.0                        # PID Proportional
  ki: 0.01                       # PID Integral
  kd: 0.0                        # PID Derivative
  default_timer: 70              # Default sauna duration in minutes
  vent_delay_mins: 1             # Cooldown wait time before starting the extraction fan
  vent_run_mins: 160             # Duration the extraction fan runs
  timer_offset_temp: 7.0         # Frozen countdown: triggers when temp >= (Setpoint - Offset)

ir:
  default_ir_modulation: 75      # Default IR power modulation (75%)
  min_time_mins: 5
  max_time_mins: 20

bathroom1:
  vent_on_humidity: 80           # Auto-engage fan above this %
  vent_off_humidity: 74          # Auto-disengage fan below this %
  vent_min_runtime_mins: 5       # Minimum time the fan must run before auto-disengaging

blinds:
  default_travel_time_secs: 35
  travel_times:
    blinds.cinema: 30
    blinds.sauna: 20
    blinds.gv_links: 35
    blinds.gv_rechts: 34

# 🌍 The Daily Time-Series Engine (Environmental Bounds)
environmental_schedule:
  blinds:
    morning_open_earliest: "07:00"
    morning_open_latest: "09:00"
    evening_close_earliest: "16:30"
    evening_close_latest: "22:00"
  twilight:
    evening_off_time: "23:00"
    morning_on_time: "06:00"

