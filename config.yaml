# ==============================================================================
# WanOS Master Configuration File
# ==============================================================================
version: "6"

auth:
  cookie_expiry_days: 30
  ban_timeout_mins: 30
  # Magic link tokens for bypassing the PIN pad (e.g. http://10.x.x.x/login.html?token=wall_tablet_123)
  user_token: "user"
  kiosk_token: "kiosk"

# ==============================================================================
# IDX mapping
# ==============================================================================
# 100xx : GPIO inputs (doors / water / power pulses)
# 200xx : SHT11 sensors
# 20101 : sauna temp — virtual composite (0.7×20001 + 0.3×20002); hum from 20001
# 2100x : Sauna & IR virtual
# 220xx : Pi internal sensors (host CPU/mem/disk/load; 22009 = WanOS DB size)
# 30001 : OWM outside temp & hum
# 400xx : RFX
# 500xx : Hue (config_hue.taml)
# 600xx : Sonos
# 610xx : Onkyo
# 620xx : LG
# 7xxxx : Z-Wave - detail in config_zwave.auto.yaml
# 810xx : HomeWizard
# 900xx : scene history synthetic keys (crc32 of event name)

# ==============================================================================
# 1. INTEGRATIONS & NETWORK LAYER
# ==============================================================================
