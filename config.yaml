# --- Declarative translation mapping for physical RFXCom 433MHz signals ---
native_rfx:
# RFXCOM is ID 0403:6001 (Vendor ID: 0403, Product ID: 6001).
# Type & Subtype: Lighting 4, PT2262
  - name: "cinema schemer"
    virtual_idx: 40001  # RFX1
    protocol: "Lighting4"
    on_id: "541555"
    off_id: "541554"
  - name: "buro Wannes schemer"
    virtual_idx: 40002  # RFX2
    protocol: "Lighting4"
    on_id: "544555"
    off_id: "544554"
  - name: "living schemer"
    virtual_idx: 40003  # RFX3
    protocol: "Lighting4"
    on_id: "545155"
    off_id: "545154"
  - name: "kerstboom"
