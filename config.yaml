# ==============================================================================
# WanOS Master Configuration File
# ==============================================================================
version: "6"

auth:
  cookie_expiry_days: 30
  ban_timeout_mins: 30
  # Magic link tokens for bypassing the PIN pad (e.g. http://10.x.x.x/login.html?token=wall_tablet_123)
  user_token: "user"
  kiosk_token: "kiosk"

# ==============================================================================
# IDX mapping
# ==============================================================================
# 100xx : GPIO inputs (doors / water / power pulses)
# 200xx : SHT11 sensors
# 20101 : sauna temp — virtual composite (0.7×20001 + 0.3×20002); hum from 20001
# 2100x : Sauna & IR virtual
# 220xx : Pi internal sensors (host CPU/mem/disk/load; 22009 = WanOS DB size)
# 30001 : OWM outside temp & hum
# 400xx : RFX
# 500xx : Hue (config_hue.taml)
# 600xx : Sonos
# 610xx : Onkyo
# 700xx : Z-Wave (config_zwave.yaml)
# 71046 : Mains voltage (Z-Wave Node 50)
# 900xxx : scene history synthetic keys (crc32 of event name)

# ==============================================================================
# 1. INTEGRATIONS & NETWORK LAYER
# ==============================================================================
wanos:
  mqtt:
    broker_host: "localhost"
    port: 1883
    username: "st"
    # password in .env

epson:
  ip_address: "10.32.251.75"

weather:
  location: "Borsbeek,BE"
  poll_interval_mins: 30

sonos:
  device_map:
    60001:
      ip: "10.32.251.121"
      name: "badk boven"
    60002:
      ip: "10.32.251.122"
      name: "living"
    60003:
      ip: "10.32.251.123"
      name: "badk 1e"
    60004:
      ip: "10.32.251.124"
      name: "slpk Wannes"
    60005:
      ip: "10.32.251.125"
      name: "slpk Dries"
    60006:
      ip: "10.32.251.126"
      name: "buro"
  stations:
    qmaxhits: "x-sonosapi-stream:tunein%3a208746?sid=303&flags=8232&sn=1"

onkyo:
  max_volume: 60
  device_map:
    61001:
      ip: "10.32.251.35"
      name: "cinema" #  (Onkyo TX-NR575E)"
      legacy: false
    61002:
      ip: "10.32.251.78"
      name: "living" #  (Onkyo TX-NR616)"
      legacy: true  # Instructs the engine to use the malformed header and 2.0s TCP pacing

rfxcom:
  # To find the exact USB port run: ls -l /dev/serial/by-id/
  serial_port: "/dev/rfxcom"

# --- Declarative translation mapping for physical RFXCom 433MHz signals ---
native_rfx:
# RFXCOM is ID 0403:6001 (Vendor ID: 0403, Product ID: 6001).
# Type & Subtype: Lighting 4, PT2262
  - name: "cinema schemer"
    virtual_idx: 40001  # RFX1
    protocol: "Lighting4"
    on_id: "541555"
    off_id: "541554"
  - name: "buro Wannes schemer"
    virtual_idx: 40002  # RFX2
    protocol: "Lighting4"
    on_id: "544555"
    off_id: "544554"
  - name: "living schemer"
    virtual_idx: 40003  # RFX3
    protocol: "Lighting4"
    on_id: "545155"
    off_id: "545154"
  - name: "kerstboom"
    virtual_idx: 40004  # RFX4
    protocol: "Lighting4"
    on_id: "545455"
    off_id: "545454"
  - name: "kerst lichten voor"
    virtual_idx: 40005  # RFX5
    protocol: "Lighting4"
    on_id: "545511"
    off_id: "545514"


# ==============================================================================
#
# ==============================================================================

weather:
  idx: 30001
  name: "Outside temp & hum"
  location: "Borsbeek,BE"
  poll_interval_mins: 30

hardware_links:
  # Maps switch entity_ids to linked power meter entity_ids.
  # When the switch turns OFF, the backend will auto-flush the power meter to 0.0W.
  power_meters:
    switch.pc: sensor.power.pc_power
    switch.pc_monitors: sensor.power.pc_monitors_power

# Sensor / utility history (power, water, charts) — see docs/sensor_history.md
history:
  timezone: "Europe/Brussels"
  retention:
    hires_days: 7
    hourly_days: 31
    daily_days: 365
  sample:
    kwh_step_wh: 100        # hi-res W sample every 0.1 kWh
    water_step_l: 1.0       # consumption step every liter
    zwave_min_interval_secs: 60
    climate_temp_deadband: 0.5
    climate_hum_deadband: 2.0
    climate_max_interval_secs: 300
  tracked_entities:
    - sensor.energy.kwh_meter
    - sensor.fluid.koud_water
    - sensor.fluid.warm_water
    - sensor.power.pc_power
    - sensor.power.pc_monitors_power

# Devices hidden from Device Explorer (and Sensor History list unless "Hidden" is on).
# entity_ids for WanOS-owned devices. Z-Wave mesh uses config_zwave.yaml → hidden_nodes
# (merged into the same runtime list at bridge start).
deviceexplorer_exclude:
  - switch.cinema_projector
  - switch.kerstboom
  - switch.kerst_lichten_voor
  - switch.kerst_lichten_tuin
  - hue.group.verd_0_hue
  - hue.group.verd_1_hue
  - hue.group.verd_2_hue
  - sensor.energy.kwh_meter
  - sensor.fluid.koud_water
  - sensor.fluid.warm_water
  - sensor.door.sauna_deur
  - sensor.door.badkamer_deur
  - sensor.temp_hum.host_cpu_temperature
  - sensor.generic.host_cpu_usage
  - sensor.generic.host_memory_free
  - sensor.generic.host_disk_free_root
  - sensor.generic.host_log2ram_free
  - sensor.generic.host_load_average_1m
  - sensor.generic.host_load_average_5m
  - sensor.generic.host_load_average_15m
  - sensor.generic.wanos_db_size

# ==============================================================================
# 3. DOMAIN RUNTIME PARAMETERS
# ==============================================================================
sauna:
  default_sauna_setpoint: 80     # Default sauna temperature setpoint
  max_temp: 95                   # Maximum setpoint that can be set in the UI
  kp: 3.0                        # PID Proportional
  ki: 0.01                       # PID Integral
  kd: 0.0                        # PID Derivative
  default_timer: 70              # Default sauna duration in minutes
  vent_delay_mins: 1             # Cooldown wait time before starting the extraction fan
  vent_run_mins: 160             # Duration the extraction fan runs
  timer_offset_temp: 7.0         # Frozen countdown: triggers when temp >= (Setpoint - Offset)

ir:
  default_ir_modulation: 75      # Default IR power modulation (75%)
  min_time_mins: 5
  max_time_mins: 20

bathroom1:
  vent_on_humidity: 80           # Auto-engage fan above this %
  vent_off_humidity: 74          # Auto-disengage fan below this %
  vent_min_runtime_mins: 5       # Minimum time the fan must run before auto-disengaging

blinds:
  default_travel_time_secs: 35
  travel_times:
    blinds.cinema: 30
    blinds.sauna: 20
    blinds.gv_links: 35
    blinds.gv_rechts: 34

# 🌍 The Daily Time-Series Engine (Environmental Bounds)
environmental_schedule:
  blinds:
    morning_open_earliest: "07:00"
    morning_open_latest: "09:00"
    evening_close_earliest: "16:30"
    evening_close_latest: "22:00"
  twilight:
    evening_off_time: "23:00"
    morning_on_time: "06:00"


lighting:
  # The engine will ONLY apply auto-off rules to entity_ids explicitly listed here
  managed_lights: [switch.licht_living, switch.licht_keuken, switch.gang_beneden, switch.licht_garage, switch.badk_1e_hue_physical, switch.gang_boven, switch.buro_licht, switch.cinema_licht, switch.waskot, switch.voorraad_gv, switch.slpk_dries, switch.vent.badk_2e_ventilatie, switch.cinema_schemer, switch.buro_wannes_schemer, switch.living_schemer, switch.slpk_liene, switch.berging_2e, switch.eetkamer, switch.slpk_wannes, hue.group.slpk_wannes_hue, hue.group.eetkamer_hue, hue.group.living_hue, hue.group.slpk_dries_hue, hue.group.cinema_hue, switch.toilet, switch.vent.toilet_ventilatie]
  default_auto_off_minutes: 300
  # Specific delay overrides in minutes
  auto_off_delays:
    hue.group.slpk_wannes_hue: 90
    hue.group.slpk_dries_hue: 30
    switch.licht_garage: 10
    switch.badk_1e_hue_physical: 120
    switch.gang_boven: 10
    switch.waskot: 5
    switch.voorraad_gv: 1
    switch.slpk_dries: 30
    switch.vent.badk_2e_ventilatie: 30
    switch.berging_2e: 1
    switch.eetkamer: 30
    switch.slpk_wannes: 30
    switch.toilet: 10
    switch.vent.toilet_ventilatie: 5


# ==============================================================================
# 4. AUTOMATION RULES & SCENES
# ==============================================================================
automations:

  # --------------------------------------------------------------------------
  # 🌍 ENVIRONMENTAL SCHEDULER: BLINDS & TWILIGHT
  # --------------------------------------------------------------------------
  - name: "Morning Blinds Open"
    trigger:
      event: "BLINDS_OPEN_TRIGGER"
    actions:
      - entity_id: blinds.gv_links
        state: "0"
      - entity_id: blinds.gv_rechts
        state: "0"
      - entity_id: blinds.sauna
        state: "0"
      - entity_id: blinds.cinema
        state: "0"

  - name: "Evening Blinds Close"
    trigger:
      event: "BLINDS_CLOSE_TRIGGER"
    actions:
      - entity_id: blinds.gv_links
        state: "100"
      - entity_id: blinds.gv_rechts
        state: "100"
      - entity_id: blinds.sauna
        state: "100"
      - entity_id: blinds.cinema
        state: "100"

  - name: "Tuinlichten & kerststuff aan 's avonds"
    trigger:
      - event: "TWILIGHT_EVENING_ON_TRIGGER"
    actions:
      - entity_id: switch.tuin
        state: "ON"
      - entity_id: switch.kerstboom
        state: "ON"
      - entity_id: switch.kerst_lichten_tuin
        state: "ON"
      - entity_id: switch.kerst_lichten_voor
        state: "ON"

  - name: "Tuinlichten & kerststuff uit 's avonds"
    trigger:
      - event: "TWILIGHT_EVENING_OFF_TRIGGER"
    actions:
      - entity_id: switch.tuin
        state: "OFF"
      - entity_id: switch.kerstboom
        state: "OFF"
      - entity_id: switch.kerst_lichten_tuin
        state: "OFF"
      - entity_id: switch.kerst_lichten_voor
        state: "OFF"

  - name: "Kerstverlichting voor & achter aan 's morgens"
    trigger:
      - event: "TWILIGHT_MORNING_ON_TRIGGER"
    actions:
      - entity_id: switch.kerst_lichten_tuin
        state: "ON"
      - entity_id: switch.kerst_lichten_voor
        state: "ON"

  - name: "Kerstverlichting voor & achter uit 's morgens"
    trigger:
      - event: "TWILIGHT_MORNING_OFF_TRIGGER"
    actions:
      - entity_id: switch.kerst_lichten_tuin
        state: "OFF"
      - entity_id: switch.kerst_lichten_voor
        state: "OFF"

  - name: "Tuinlichten Evening ON"
    trigger:
      event: "TWILIGHT_EVENING_ON_TRIGGER"
    actions:
      - entity_id: switch.tuin
        state: "ON"

  - name: "Tuinlichten Evening OFF"
    trigger:
      event: "TWILIGHT_EVENING_OFF_TRIGGER" # Fires exactly at 23:00 (or config setting)
    actions:
      - entity_id: switch.tuin
        state: "OFF"

  # --------------------------------------------------------------------------
  # 🎛️ MANUALLY TRIGGERED SCENES (UI Visible)
  # --------------------------------------------------------------------------
  - name: "ALL OFF gv"
    scene: true
    trigger:
      event: "SCENE_GV_OFF"
    actions:
      - entity_id: switch.gang_beneden
        state: "OFF"
      - entity_id: switch.licht_living
        state: "OFF"
      - entity_id: switch.licht_keuken
        state: "OFF"
      - entity_id: switch.voorraad_gv
        state: "OFF"
      - entity_id: switch.eetkamer
        state: "OFF"
      - entity_id: switch.living_schemer
        state: "OFF"
      - entity_id: switch.kerstboom
        state: "OFF"
      - entity_id: switch.toilet
        state: "OFF"
      - entity_id: switch.licht_garage
        state: "OFF"
      - entity_id: switch.tuin
        state: "OFF"
      - entity_id: hue.group.verd_0_hue
        state: "OFF"
      - entity_id: media_player.living
        state: "OFF"

  - name: "ALL OFF 1eV"
    scene: true
    trigger:
      event: "SCENE_VERDIEP1_OFF"
    actions:
      - entity_id: switch.cinema_licht
        state: "OFF"
      - entity_id: switch.cinema_schemer
        state: "OFF"
      - entity_id: switch.buro_licht
        state: "OFF"
      - entity_id: switch.buro_wannes_schemer
        state: "OFF"
      - entity_id: switch.pc_monitors
        state: "OFF"
      - entity_id: switch.badk_1e_hue_physical
        state: "OFF"
      - entity_id: switch.gang_boven
        state: "OFF"
      - entity_id: hue.group.verd_1_hue
        state: "OFF"
      - entity_id: media_player.badk_1e
        state: "OFF"
      - entity_id: media_player.buro
        state: "OFF"

  - name: "ALL OFF 2eV"
    scene: true
    trigger:
      event: "SCENE_VERDIEP2_OFF"
    actions:
      - entity_id: switch.gang_boven
        state: "OFF"
      - entity_id: switch.badk_2e_hue_physical
        state: "OFF"
      - entity_id: switch.slpk_dries
        state: "OFF"
      - entity_id: switch.slpk_liene
        state: "OFF"
      - entity_id: switch.berging_2e
        state: "OFF"
      - entity_id: switch.slpk_wannes
        state: "OFF"
      - entity_id: hue.group.verd_2_hue
        state: "OFF"
      - entity_id: media_player.badk_boven
        state: "OFF"
      - entity_id: media_player.slpk_wannes
        state: "OFF"
      - entity_id: media_player.slpk_dries
        state: "OFF"

  - name: "ALL OFF overal"
    scene: true
    require_confirmation: true
    trigger:
      event: "SCENE_ALL_OFF"
    actions:
      - event: "SCENE_GV_OFF"
      - event: "SCENE_VERDIEP1_OFF"
      - event: "SCENE_VERDIEP2_OFF"

  - name: "GoCosy gv"
    scene: true
    trigger:
      event: "SCENE_GOCOSY"
    actions:
      - entity_id: switch.licht_living
        state: "OFF"
      - entity_id: hue.group.living_hue
        state: "ON"
        preset: "relax_red"
      - entity_id: switch.living_schemer
        state: "ON"
      - entity_id: switch.kerstboom
        state: "ON"

  # --------------------------------------------------------------------------
  # 💡 ROOM MACROS & LIGHTING CHAINS
  # --------------------------------------------------------------------------
  - name: "Slpk_Dries"
    trigger:
      entity_id: switch.slpk_dries
      state: "SYNC"
    actions:
      - entity_id: hue.group.slpk_dries_hue
        state: "SYNC"

  - name: "KeukenLivingEetk_EetkHue"
    trigger:
      - entity_id: switch.licht_living
        state: "ON"
      - entity_id: switch.licht_keuken
        state: "ON"
      - entity_id: switch.eetkamer
        state: "ON"
    actions:
      - entity_id: hue.group.eetkamer_hue
        state: "ON"

  - name: "BuroCinemaPC_cosy"
    scene: true
    trigger:
      - entity_id: switch.buro_licht
        state: "ON"
    actions:
      - entity_id: switch.cinema_schemer
        state: "ON"
      - entity_id: switch.buro_wannes_schemer
        state: "ON"

  - name: "garage_motion"
    trigger:
      entity_id: sensor.generic.garage_motion
      state: "ON"
    conditions:
      - type: "time_of_day"
        is: "dark"
    actions:
      - entity_id: switch.licht_garage
        state: "ON"

  - name: "toilet_motion"
    trigger:
      entity_id: sensor.generic.toilet_motion
      state: "ON"
    actions:
      - entity_id: switch.toilet
        state: "ON"

  # DISABLED — Domoticz IDX 94 retired; re-enable when Z-Wave achterdeur sensor is installed
  # - name: "achterdeur_waskot"
  #   trigger:
  #     idx: 94  # achterdeur (legacy Domoticz — replace with Z-Wave IDX)
  #     state: "ON"
  #   actions:
  #     - idx: 71014 # licht waskot
  #       state: "ON"

  - name: "garage_waskot_OFF"
    trigger:
      entity_id: switch.licht_garage
      state: "OFF"
    actions:
      - entity_id: switch.waskot
        state: "OFF"

  - name: "gang_boven_berging_OFF"
    trigger:
      entity_id: switch.gang_boven
      state: "OFF"
    actions:
      - entity_id: switch.slpk_liene
        state: "OFF"

  # --------------------------------------------------------------------------
  # 🛋️ LIVING ROOM: "SPARE" SMART BUTTON (IDX 71029)
  # --------------------------------------------------------------------------

  # --- Scenario 1: Room is already active -> Shut down the house ---
  - name: "Spare Button: Hue is ON -> Trigger ALL OFF"
    trigger:
      - entity_id: switch.living_special
        state: "ON"
      - entity_id: switch.living_special
        state: "OFF"
    conditions:
      - type: "device_state"
        entity_id: hue.group.living_hue
        is: "ON"         # 🛡️ Only fires if the living room is already lit
    actions:
      - event: "SCENE_ALL_OFF"   # Note: Change to SCENE_GV_OFF if you only want the ground floor to turn off!

  # --- Scenario 2: Room is Dark AND it's nighttime -> Go Cosy ---
  - name: "Spare Button: Hue OFF + Night -> Go Cosy"
    trigger:
      - entity_id: switch.living_special
        state: "ON"
      - entity_id: switch.living_special
        state: "OFF"
    conditions:
      - type: "device_state"
        entity_id: hue.group.living_hue
        is: "OFF"        # Condition A: Room is currently off
      - type: "time_of_day"
        is: "dark"       # Condition B: Sun has set
    actions:
      - event: "SCENE_GOCOSY"

  # --- Scenario 3: Room is Dark AND it's daytime -> Red Accent ---
  - name: "Spare Button: Hue OFF + Day -> Red Accent"
    trigger:
      - entity_id: switch.living_special
        state: "ON"
      - entity_id: switch.living_special
        state: "OFF"
    conditions:
      - type: "device_state"
        entity_id: hue.group.living_hue
        is: "OFF"        # Condition A: Room is currently off
      - type: "time_of_day"
        is: "light"      # Condition B: Sun is still up
    actions:
      - entity_id: hue.group.living_hue
        state: "ON"
        preset: "relax_red"
      - entity_id: switch.licht_living
        state: "OFF"     # Turn off the traditional lights (Ensure this doesn't cut power to the Hue!)

  # --------------------------------------------------------------------------
  # ⚙️ HARDWARE SYNC & SYSTEM MACROS
  # --------------------------------------------------------------------------
  - name: "PC ON/OFF -> PC Aux ON/OFF"
    trigger:
      entity_id: switch.pc
      state: "SYNC"
    actions:
      - entity_id: switch.pc_monitors
        state: "SYNC"

  - name: "PC Aux ON -> Buro Schemer + Sonos ON"
    trigger:
      entity_id: switch.pc_monitors
      state: "ON"
    actions:
      - entity_id: switch.buro_wannes_schemer
        state: "ON"
      - entity_id: media_player.buro
        state: "ON"
        volume: 6
        station: "qmaxhits"

  - name: "PC Aux OFF -> Buro Schemer + Sonos OFF"
    trigger:
      entity_id: switch.pc_monitors
      state: "OFF"
    actions:
      - entity_id: switch.buro_wannes_schemer
        state: "OFF"
      - entity_id: media_player.buro
        state: "OFF"

  - name: "toilet_gv_ventilatie_on"
    trigger:
      entity_id: switch.vent.toilet_ventilatie
      state: "SYNC"
    actions:
      - entity_id: switch.vent.toilet_ventilatie_motor
        state: "SYNC"

  - name: "gocosy-savonds"
    trigger:
      event: TWILIGHT_EVENING_ON_TRIGGER
    conditions:
      - type: "device_state"
        entity_id: switch.licht_living
        is: "ON"
    actions:
      - event: SCENE_GOCOSY

# --------------------------------------------------------------------------
# 🛁 BATHROOM 1 (1e) LIGHTING & HUE SYNC
# --------------------------------------------------------------------------

  # --- Main Bathroom Switch (141) Master Control ---
  - name: "Badk 1e: Main Switch ON -> Hue Red"
    trigger:
      entity_id: switch.badk_1e_hue_physical
      state: "ON"
    conditions:
      - type: "device_state"
        entity_id: hue.group.badk_1e_hue
        is: "OFF"        # Only applies Red if the room was off
    actions:
      - entity_id: hue.group.badk_1e_hue
        state: "ON"
        preset: "relax_red"
      - entity_id: media_player.badk_1e
        state: "ON"
        volume: 10
        station: "qmaxhits"

  # --- Wastafel (Sink) Logic: Split into Day/Night context ---
  - name: "Badk 1e: Wastafel ON -> Hue White (If already in room)"
    trigger:
      entity_id: switch.badk_1e_wastafel
      state: "ON"
    conditions:
      - type: "device_state"
        entity_id: hue.group.badk_1e_hue
        is: "ON"         # Only fires if the room is already lit
    actions:
      - entity_id: hue.group.badk_1e_hue
        state: "ON"
        preset: "my_white"

  - name: "Badk 1e: Wastafel OFF -> Hue Red (If already in room)"
    trigger:
      entity_id: switch.badk_1e_wastafel
      state: "OFF"
    conditions:
      - type: "device_state"
        entity_id: hue.group.badk_1e_hue
        is: "ON"         # Only fires if the room is already lit
    actions:
      - entity_id: hue.group.badk_1e_hue
        state: "ON"
        preset: "relax_red"

  - name: "Badk 1e: Main Switch OFF -> Hue & wastafel OFF"
    trigger:
      entity_id: switch.badk_1e_hue_physical
      state: "OFF"
    actions:
      - entity_id: hue.group.badk_1e_hue
        state: "OFF"
      - entity_id: switch.badk_1e_wastafel
        state: "OFF"
      - entity_id: media_player.badk_1e
        state: "OFF"

  # --- Hue App Override Sync (Bidirectional support) ---
  - name: "Badk 1e: Hue App Syncs to Main Switch-ON"
    trigger:
      entity_id: hue.group.badk_1e_hue
      state: "ON"
    actions:
      - entity_id: switch.badk_1e_hue_physical
        state: "ON"
      - entity_id: media_player.badk_1e
        state: "ON"
        volume: 10
        station: "qmaxhits"

  - name: "Badk 1e: Hue App Syncs to Main Switch-OFF"
    trigger:
      entity_id: hue.group.badk_1e_hue
      state: "OFF"
    actions:
      - entity_id: switch.badk_1e_hue_physical
        state: "OFF"
      - entity_id: media_player.badk_1e
        state: "OFF"

# --------------------------------------------------------------------------
# 🛁 BATHROOM 2 (2e) LIGHTING & HUE SYNC
# --------------------------------------------------------------------------

  # --- Main Bathroom Switch Master Control ---
  - name: "Badk 2e: Main Switch ON -> Hue Red"
    trigger:
      entity_id: switch.badk_2e_hue_physical
      state: "ON"
    conditions:
      - type: "device_state"
        entity_id: hue.group.badk_2e_hue
        is: "OFF"        # Only applies Red if the room was off
    actions:
      - entity_id: hue.group.badk_2e_hue
        state: "ON"
        preset: "relax_red"
      - entity_id: media_player.badk_boven
        state: "ON"
        volume: 10
        station: "qmaxhits"

  # --- Wastafel (Sink) Logic: Split into Day/Night context ---
  - name: "Badk 2e: Wastafel ON -> Hue White (If already in room)"
    trigger:
      entity_id: switch.badk_2e_wastafel
      state: "ON"
    conditions:
      - type: "device_state"
        entity_id: hue.group.badk_2e_hue
        is: "ON"         # Only fires if the room is already lit
    actions:
      - entity_id: hue.group.badk_2e_hue
        state: "ON"
        preset: "my_white"

  - name: "Badk 2e: Wastafel OFF -> Hue Red (If already in room)"
    trigger:
      entity_id: switch.badk_2e_wastafel
      state: "OFF"
    conditions:
      - type: "device_state"
        entity_id: hue.group.badk_2e_hue
        is: "ON"         # Only fires if the room is already lit
    actions:
      - entity_id: hue.group.badk_2e_hue
        state: "ON"
        preset: "relax_red"

  - name: "Badk 2e: Main Switch OFF -> Hue & wastafel OFF"
    trigger:
      entity_id: switch.badk_2e_hue_physical
      state: "OFF"
    actions:
      - entity_id: hue.group.badk_2e_hue
        state: "OFF"
      - entity_id: switch.badk_2e_wastafel
        state: "OFF"
      - entity_id: media_player.badk_boven
        state: "OFF"

  # --- Hue App Override Sync (Bidirectional support) ---
  - name: "Badk 2e: Hue App Syncs to Main Switch-ON"
    trigger:
      entity_id: hue.group.badk_2e_hue
      state: "ON"
    actions:
      - entity_id: switch.badk_2e_hue_physical
        state: "ON"
      - entity_id: media_player.badk_boven
        state: "ON"
        volume: 10
        station: "qmaxhits"

  - name: "Badk 2e: Hue App Syncs to Main Switch-OFF"
    trigger:
      entity_id: hue.group.badk_2e_hue
      state: "OFF"
    actions:
      - entity_id: switch.badk_2e_hue_physical
        state: "OFF"
      - entity_id: media_player.badk_boven
        state: "OFF"

  # --------------------------------------------------------------------------
  # 🛏️ SLPK WANNES LIGHTING & HUE SYNC
  # --------------------------------------------------------------------------

  # --- Physical Switch Master Control ---
  - name: "Slpk Wannes: Switch ON -> Hue Red (If Room was Dark)"
    trigger:
      entity_id: switch.slpk_wannes_hue_physical
      state: "ON"
    conditions:
      - type: "device_state"
        entity_id: hue.group.slpk_wannes_hue
        is: "OFF"        # 🛡️ Anti-Overwrite Guard: Only applies Red if the room was off
    actions:
      - entity_id: hue.group.slpk_wannes_hue
        state: "ON"
        preset: "relax_red"

  - name: "Slpk Wannes: Switch OFF -> Hue OFF"
    trigger:
      entity_id: switch.slpk_wannes_hue_physical
      state: "OFF"
    actions:
      - entity_id: hue.group.slpk_wannes_hue
        state: "OFF"

  # --- Hue App Override Sync (Bidirectional support) ---
  - name: "Slpk Wannes: Hue App Syncs to Switch"
    trigger:
      entity_id: hue.group.slpk_wannes_hue
      state: "SYNC"
    actions:
      - entity_id: switch.slpk_wannes_hue_physical
        state: "SYNC"

  # --------------------------------------------------------------------------
  # 🧖‍♂️ SAUNA AUTOMATIONS
  # --------------------------------------------------------------------------
  - name: "Sauna Lights ON"
    trigger:
      event: "SAUNA_ON"
    actions:
      - entity_id: hue.group.verd_1_hue
        state: "ON"
      - entity_id: hue.group.living_hue
        state: "ON"
      - entity_id: switch.sauna_zoutlamp
        state: "ON"  # Sauna zoutlamp

  - name: "Sauna OFF -> Hue Off"
    trigger:
      event: "SAUNA_OFF"
    actions:
      - entity_id: hue.group.verd_1_hue
        state: "ON"
        preset: "my_white"
      - entity_id: hue.group.living_hue
        state: "ON"
        preset: "my_white"
      - entity_id: switch.sauna_zoutlamp
        state: "OFF"  # Sauna zoutlamp

  # --------------------------------------------------------------------------
  # 🍿 CINEMA MODE SCENES
  # --------------------------------------------------------------------------

  - name: "--- CINEMA ON"
    scene: true
    require_confirmation: true
    trigger:
      event: "SCENE_CINEMA_ON"
    actions:
      - entity_id: switch.cinema_projector
        state: "FORCE_ON"
      - entity_id: blinds.cinema
        state: "100"  # 100 = Closed
      # Turn off surrounding lights and PC aux
      - entity_id: switch.buro_licht
        state: "OFF"
      - entity_id: switch.cinema_licht
        state: "OFF"
      - entity_id: switch.gang_beneden
        state: "OFF"
      - entity_id: switch.gang_boven
        state: "OFF"
      - entity_id: switch.pc_monitors
        state: "OFF"
      - entity_id: media_player.buro
        state: "OFF"
      - entity_id: hue.group.cinema_hue
        state: "ON"
        preset: "relax_red"

  # --- CINEMA OFF: SPLIT INTO TWO RULES FOR IF/ELSE LOGIC ---
  - name: "--- CINEMA OFF"
    # This one makes it to the dashboard.trigger:
    # It fires the event "SCENE_CINEMA_OFF", both this and "CINEMA OFF (Day)" are then evaluated.
    scene: true
    require_confirmation: true  # ⚡ High impact macro: pop up confirmation modal
    trigger:
      event: "SCENE_CINEMA_OFF"
    conditions:
      - type: "time_of_day"
        is: "dark"
    actions:
      - entity_id: switch.cinema_projector
        state: "FORCE_OFF"
      - entity_id: hue.group.cinema_hue
        state: "OFF"
      - entity_id: switch.cinema_licht
        state: "ON"
  - name: "CINEMA OFF (Day)"
    trigger:
      event: "SCENE_CINEMA_OFF"
    conditions:
      - type: "time_of_day"
        is: "light"
    actions:
      - entity_id: switch.cinema_projector
        state: "FORCE_OFF"
      - entity_id: hue.group.cinema_hue
        state: "OFF"
      - entity_id: blinds.cinema
        state: "0"