### RFX
  # RFX-ON  ON         -> virtual switch ON
  # virtual switch ON  -> RFX-ON  ON             # is this needed?
  # RFX-OFF ON         -> virtual switch OFF

  # RFX1 controls cinema_schemer  idx 139 (virtual switch)
  # RFX1 ON    idx 627
  # RFX1 OFF   idx 628
  - name: "RFX1_1"
    trigger:
      idx: 627
      state: "SYNC"
    actions:
      - idx: 139
        state: "SYNC"
  - name: "RFX1_2"
    trigger:
      idx: 139
      state: "SYNC"
    actions:
      - idx: 627
        state: "SYNC"
  - name: "RFX1_3"
    trigger:
      idx: 628
      state: "ON"
    actions:
      - idx: 139
        state: "OFF"

  # RFX2 controls buro schemer    idx 140 (virtual switch)
  # RFX2 ON    idx 270
  # RFX2 OFF   idx 114
  - name: "RFX2: ON-to-virtual"
    trigger:
      idx: 270
      state: "ON"
    actions:
      - idx: 140
        state: "ON"
  - name: "RFX2: OFF-to-virtual"
    trigger:
      - idx: 114
        state: "ON"
    actions:
      - idx: 140
        state: "OFF"
  - name: "RFX2: virtual-to-ON"
    trigger:
      idx: 140
      state: "ON"
    actions:
      - idx: 270
        state: "FORCE_ON"
  - name: "RFX2: virtual-to-OFF"
    trigger:
      idx: 140
      state: "OFF"
    actions:
      - idx: 114
        state: "FORCE_ON"

  # RFX3 controls living schemer  idx 157 (virtual switch)
  # RFX3 ON    idx 630
  # RFX3 OFF   idx 115
  - name: "RFX3_1"
    trigger:
      idx: 630
      state: "SYNC"
    actions:
      - idx: 157
        state: "SYNC"
  - name: "RFX3_2"
    trigger:
      - idx: 157
        state: "SYNC"
    actions:
      - idx: 630
        state: "SYNC"
  - name: "RFX3_3"
    trigger:
      - idx: 115
        state: "ON"
    actions:
      - idx: 157
        state: "OFF"

  # RFX4 controls kerstboom       idx 158 (virtual switch)
  # RFX4 ON    idx 631
  # RFX4 OFF   idx 146
  - name: "RFX4_1"
    trigger:
      idx: 631
      state: "SYNC"
    actions:
      - idx: 158
        state: "SYNC"
  - name: "RFX4_2"
    trigger:
      - idx: 158
        state: "SYNC"
    actions:
      - idx: 631
        state: "SYNC"
  - name: "RFX4_3"
    trigger:
      - idx: 146
        state: "ON"
    actions:
      - idx: 158
        state: "OFF"

  # RFX5 controls -unused-        idx 636 (virtual switch)
  # RFX5 ON    idx 631
  # RFX5 OFF   idx 147