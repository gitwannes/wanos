# ==============================================================================
# WanOS Master Configuration File
# ==============================================================================
version: "6"

auth:
  cookie_expiry_days: 30
  ban_timeout_mins: 30
  # Magic link tokens for bypassing the PIN pad (e.g. http://10.x.x.x/login.html?token=wall_tablet_123)
  user_token: "user"
  kiosk_token: "kiosk"

# ==============================================================================
# IDX mapping
# ==============================================================================
# 100xx : GPIO inputs (doors / water / power pulses)
# 200xx : SHT11 sensors
# 2100x : Sauna & IR virtual
# 220xx : Pi internal sensors
# 30001 : OWM outside temp & hum
# 400xx : RFX
# 500xx : Hue (config_hue.taml)
# 600xx : Sonos
# 610xx : Onkyo
# 700xx : Z-Wave (config_zwave.yaml)

# ==============================================================================
# 1. INTEGRATIONS & NETWORK LAYER
# ==============================================================================
wanos:
  mqtt:
    broker_host: "localhost"
    port: 1883
    username: "st"
    # password in .env

epson:
  ip_address: "10.32.251.75"

weather:
  location: "Borsbeek,BE"
  poll_interval_mins: 30

sonos:
  device_map:
    60001:
      ip: "10.32.251.121"
      name: "badk boven"
    60002:
      ip: "10.32.251.122"
      name: "living"
    60003:
      ip: "10.32.251.123"
      name: "badk 1e"
    60004:
      ip: "10.32.251.124"
      name: "slpk Wannes"
    60005:
      ip: "10.32.251.125"
      name: "slpk Dries"
    60006:
      ip: "10.32.251.126"
      name: "buro"
  stations:
    qmaxhits: "x-sonosapi-stream:tunein%3a208746?sid=303&flags=8232&sn=1"

onkyo:
  max_volume: 60
  device_map:
    61001:
      ip: "10.32.251.35"
      name: "cinema" #  (Onkyo TX-NR575E)"
      legacy: false
    61002:
      ip: "10.32.251.78"
      name: "living" #  (Onkyo TX-NR616)"
      legacy: true  # Instructs the engine to use the malformed header and 2.0s TCP pacing

rfxcom:
  # To find the exact USB port run: ls -l /dev/serial/by-id/
  serial_port: "/dev/rfxcom"

# --- Declarative translation mapping for physical RFXCom 433MHz signals ---
native_rfx:
# RFXCOM is ID 0403:6001 (Vendor ID: 0403, Product ID: 6001).
# Type & Subtype: Lighting 4, PT2262
  - name: "cinema schemer"
    virtual_idx: 40001  # RFX1
    protocol: "Lighting4"
    on_id: "541555"
    off_id: "541554"
  - name: "buro Wannes schemer"
    virtual_idx: 40002  # RFX2
    protocol: "Lighting4"
    on_id: "544555"
    off_id: "544554"
  - name: "living schemer"
    virtual_idx: 40003  # RFX3
    protocol: "Lighting4"
    on_id: "545155"
    off_id: "545154"
  - name: "kerstboom"
    virtual_idx: 40004  # RFX4
    protocol: "Lighting4"
    on_id: "545455"
    off_id: "545454"
  - name: "kerst lichten voor"
    virtual_idx: 40005  # RFX5
    protocol: "Lighting4"
    on_id: "545511"
    off_id: "545514"


# ==============================================================================
#
# ==============================================================================

weather:
  idx: 30001
  name: "Outside temp & hum"
  location: "Borsbeek,BE"
  poll_interval_mins: 30

hardware_links:
  # Maps Switch IDXs to their associated Power Meter IDXs.
  # When the switch turns OFF, the backend will auto-flush the power meter to 0.0W.
  power_meters:
    72001: 74001  # PC Switch -> PC Power
    72002: 74003  # PC Aux Switch -> PC Aux Power

# Devices explicitly hidden from the Device Explorer UI
# Z-Wave devices exlusions via zwave_config.yaml
deviceexplorer_exclude:
  - 80001 # Epson projector
  - 40004 # kerstboom
  - 40005 # kerst lichten voor
  - 72006 # kerst lichten tuin
  - 51100  # Hue verd 0
  - 51101  # Hue verd 1
  - 51102  # Hue verd 2
  - 11001  # kWh
  - 11002  # cold water
  - 11003  # warm water
  - 10001  # sauna deur
  - 10002  # badk deur


# ==============================================================================
# 3. DOMAIN RUNTIME PARAMETERS
# ==============================================================================
sauna:
  default_sauna_setpoint: 80     # Default sauna temperature setpoint
  max_temp: 95                   # Maximum setpoint that can be set in the UI
  kp: 3.0                        # PID Proportional
  ki: 0.01                       # PID Integral
  kd: 0.0                        # PID Derivative
  default_timer: 70              # Default sauna duration in minutes
  vent_delay_mins: 1             # Cooldown wait time before starting the extraction fan
  vent_run_mins: 160             # Duration the extraction fan runs
  timer_offset_temp: 7.0         # Frozen countdown: triggers when temp >= (Setpoint - Offset)

ir:
  default_ir_modulation: 75      # Default IR power modulation (75%)
  min_time_mins: 5
  max_time_mins: 20

bathroom1:
  vent_on_humidity: 80           # Auto-engage fan above this %
  vent_off_humidity: 74          # Auto-disengage fan below this %
  vent_min_runtime_mins: 5       # Minimum time the fan must run before auto-disengaging

blinds:
  default_travel_time_secs: 35
  travel_times:
    73001: 30  # cinema
    73002: 20  # sauna
    73003: 35  # gv links
    73004: 34  # gv rechts

# 🌍 The Daily Time-Series Engine (Environmental Bounds)
environmental_schedule:
  blinds:
    morning_open_earliest: "07:00"
    morning_open_latest: "09:00"
    evening_close_earliest: "16:30"
    evening_close_latest: "22:00"
  twilight:
    evening_off_time: "23:00"
    morning_on_time: "06:00"


lighting:
  # The engine will ONLY apply auto-off rules to IDXs explicitly listed here
  managed_lights: [71003, 71004, 71005, 71006, 71007, 71008, 71001, 71002, 71014, 71012, 71017, 71021, 40001, 40002, 40003, 71023, 71024, 71025, 71027, 51006, 51003, 51005, 51008, 51004, 71043, 71044]
  default_auto_off_minutes: 300
  # Specific delay overrides in minutes
  auto_off_delays:
    51006: 90
    51008: 30
    71006: 10
    71007: 120
    71008: 10
    71014: 5
    71012: 1
    71017: 30
    71021: 30
    71024: 1
    71025: 30
    71027: 30
    71043: 10
    71044: 5


# ==============================================================================
# 4. AUTOMATION RULES & SCENES
# ==============================================================================
automations:

  # --------------------------------------------------------------------------
  # 🌍 ENVIRONMENTAL SCHEDULER: BLINDS & TWILIGHT
  # --------------------------------------------------------------------------
  - name: "Morning Blinds Open"
    trigger:
      event: "BLINDS_OPEN_TRIGGER"
    actions:
      - idx: 73003 # gv L
        state: "0"
      - idx: 73004 # gv R
        state: "0"
      - idx: 73002 # 1eV sauna
        state: "0"
      - idx: 73001 # 1eV schuifraam
        state: "0"

  - name: "Evening Blinds Close"
    trigger:
      event: "BLINDS_CLOSE_TRIGGER"
    actions:
      - idx: 73003 # gv L
        state: "100"
      - idx: 73004 # gv R
        state: "100"
      - idx: 73002 # 1eV sauna
        state: "100"
      - idx: 73001 # 1eV schuifraam
        state: "100"

  - name: "Tuinlichten & kerststuff aan 's avonds"
    trigger:
      - event: "TWILIGHT_EVENING_ON_TRIGGER"
    actions:
      - idx: 72005 # Licht tuin
        state: "ON"
      - idx: 40004 # Kerstboom
        state: "ON"
      - idx: 72006 # kerstverl tuin achter
        state: "ON"
      - idx: 40005 # kerstverl voortuin
        state: "ON"

  - name: "Tuinlichten & kerststuff uit 's avonds"
    trigger:
      - event: "TWILIGHT_EVENING_OFF_TRIGGER"
    actions:
      - idx: 72005 # Licht tuin
        state: "OFF"
      - idx: 40004 # Kerstboom
        state: "OFF"
      - idx: 72006 # kerstverl tuin achter
        state: "OFF"
      - idx: 40005 # kerstverl voortuin
        state: "OFF"

  - name: "Kerstverlichting voor & achter aan 's morgens"
    trigger:
      - event: "TWILIGHT_MORNING_ON_TRIGGER"
    actions:
      - idx: 72006 # kerstverl tuin achter
        state: "ON"
      - idx: 40005 # kerstverl voortuin
        state: "ON"

  - name: "Kerstverlichting voor & achter uit 's morgens"
    trigger:
      - event: "TWILIGHT_MORNING_OFF_TRIGGER"
    actions:
      - idx: 72006 # kerstverl tuin achter
        state: "OFF"
      - idx: 40005 # kerstverl voortuin
        state: "OFF"

  - name: "Tuinlichten Evening ON"
    trigger:
      event: "TWILIGHT_EVENING_ON_TRIGGER"
    actions:
      - idx: 72005 # Licht tuin
        state: "ON"

  - name: "Tuinlichten Evening OFF"
    trigger:
      event: "TWILIGHT_EVENING_OFF_TRIGGER" # Fires exactly at 23:00 (or config setting)
    actions:
      - idx: 72005
        state: "OFF"

  # --------------------------------------------------------------------------
  # 🎛️ MANUALLY TRIGGERED SCENES (UI Visible)
  # --------------------------------------------------------------------------
  - name: "ALL OFF gv"
    scene: true
    trigger:
      event: "SCENE_GV_OFF"
    actions:
      - idx: 71005    # gang beneden
        state: "OFF"
      - idx: 71003    # licht living
        state: "OFF"
      - idx: 71004    # licht keuken
        state: "OFF"
      - idx: 71012    # licht voorraad
        state: "OFF"
      - idx: 71025    # licht eetkamer
        state: "OFF"
      - idx: 40003    # licht living schemer groot (via RFX3)
        state: "OFF"
      - idx: 40004    # licht kerstboom (via RFX4)
        state: "OFF"
      - idx: 71043    # licht toilet
        state: "OFF"
      - idx: 71006    # licht garage
        state: "OFF"
      - idx: 72005    # licht tuin
        state: "OFF"
      - idx: 51100    # Hue gv ALL OFF
        state: "OFF"
      - idx: 60002    # Sonos living
        state: "OFF"

  - name: "ALL OFF 1eV"
    scene: true
    trigger:
      event: "SCENE_VERDIEP1_OFF"
    actions:
      - idx: 71002 # cinema_main
        state: "OFF"
      - idx: 40001 # cinema_schemer
        state: "OFF"
      - idx: 71001 # buro
        state: "OFF"
      - idx: 40002 # buro_schemer
        state: "OFF"
      - idx: 72002  # pc_aux monitors
        state: "OFF"
      - idx: 71007 # bathroom1_main
        state: "OFF"
      - idx: 71008 # gang_boven
        state: "OFF"
      - idx: 51101 # Hue 1e V ALL OFF
        state: "OFF"
      - idx: 60003    # Sonos badk 1e
        state: "OFF"
      - idx: 60006    # Sonos buro
        state: "OFF"

  - name: "ALL OFF 2eV"
    scene: true
    trigger:
      event: "SCENE_VERDIEP2_OFF"
    actions:
      - idx: 71008 # gang_boven
        state: "OFF"
      - idx: 71009 # badkamer groot
        state: "OFF"
      - idx: 71017 # slpk Dries
        state: "OFF"
      - idx: 71023 # slpk Liene
        state: "OFF"
      - idx: 71024 # berging
        state: "OFF"
      - idx: 71027 # slpk Wannes
        state: "OFF"
      - idx: 51102 # Hue 2e V ALL OFF
        state: "OFF"
      - idx: 60001    # Sonos badk 2e
        state: "OFF"
      - idx: 60004    # Sonos slpk Wannes
        state: "OFF"
      - idx: 60005    # Sonos slpk Dries
        state: "OFF"

  - name: "ALL OFF overal"
    scene: true
    require_confirmation: true
    trigger:
      event: "SCENE_ALL_OFF"
    actions:
      - event: "SCENE_GV_OFF"
      - event: "SCENE_VERDIEP1_OFF"
      - event: "SCENE_VERDIEP2_OFF"

  - name: "GoCosy gv"
    scene: true
    trigger:
      event: "SCENE_GOCOSY"
    actions:
      - idx: 71003
        state: "OFF"
      - idx: 51005    # Hue living
        state: "ON"
        preset: "relax_red"
      - idx: 40003    # licht living schemer groot (via RFX3)
        state: "ON"
      - idx: 40004    # licht kerstboom (via RFX4)
        state: "ON"

  # --------------------------------------------------------------------------
  # 💡 ROOM MACROS & LIGHTING CHAINS
  # --------------------------------------------------------------------------
  - name: "Slpk_Dries"
    trigger:
      idx: 71017
      state: "SYNC"
    actions:
      - idx: 51008 # Hue
        state: "SYNC"

  - name: "KeukenLivingEetk_EetkHue"
    trigger:
      - idx: 71003 # Living
        state: "ON"
      - idx: 71004 # Keuken
        state: "ON"
      - idx: 71025 # Eetkamer
        state: "ON"
    actions:
      - idx: 51003 # Eetkamer Hue
        state: "ON"

  - name: "BuroCinemaPC_cosy"
    scene: true
    trigger:
      - idx: 71001 # Buro
        state: "ON"
    actions:
      - idx: 40001 # Cinema schemer klein
        state: "ON"
      - idx: 40002 # Buro schemer
        state: "ON"

  - name: "garage_motion"
    trigger:
      idx: 75001 # garage motion
      state: "ON"
    conditions:
      - type: "time_of_day"
        is: "dark"
    actions:
      - idx: 71006 # licht garage
        state: "ON"

  - name: "toilet_motion"
    trigger:
      idx: 75002
      state: "ON"
    actions:
      - idx: 71043 # licht toilet
        state: "ON"

  # DISABLED — Domoticz IDX 94 retired; re-enable when Z-Wave achterdeur sensor is installed
  # - name: "achterdeur_waskot"
  #   trigger:
  #     idx: 94  # achterdeur (legacy Domoticz — replace with Z-Wave IDX)
  #     state: "ON"
  #   actions:
  #     - idx: 71014 # licht waskot
  #       state: "ON"

  - name: "garage_waskot_OFF"
    trigger:
      idx: 71006 # licht garage
      state: "OFF"
    actions:
      - idx: 71014 # licht waskot
        state: "OFF"

  - name: "gang_boven_berging_OFF"
    trigger:
      idx: 71008 # gang boven
      state: "OFF"
    actions:
      - idx: 71023 # berging
        state: "OFF"

  # --------------------------------------------------------------------------
  # 🛋️ LIVING ROOM: "SPARE" SMART BUTTON (IDX 6689)
  # --------------------------------------------------------------------------

  # --- Scenario 1: Room is already active -> Shut down the house ---
  - name: "Spare Button: Hue is ON -> Trigger ALL OFF"
    trigger:
      - idx: 71029
        state: "ON"
      - idx: 71029
        state: "OFF"
    conditions:
      - type: "device_state"
        idx: 51005       # living hue room
        is: "ON"         # 🛡️ Only fires if the living room is already lit
    actions:
      - event: "SCENE_ALL_OFF"   # Note: Change to SCENE_GV_OFF if you only want the ground floor to turn off!

  # --- Scenario 2: Room is Dark AND it's nighttime -> Go Cosy ---
  - name: "Spare Button: Hue OFF + Night -> Go Cosy"
    trigger:
      - idx: 71029
        state: "ON"
      - idx: 71029
        state: "OFF"
    conditions:
      - type: "device_state"
        idx: 51005
        is: "OFF"        # Condition A: Room is currently off
      - type: "time_of_day"
        is: "dark"       # Condition B: Sun has set
    actions:
      - event: "SCENE_GOCOSY"

  # --- Scenario 3: Room is Dark AND it's daytime -> Red Accent ---
  - name: "Spare Button: Hue OFF + Day -> Red Accent"
    trigger:
      - idx: 71029
        state: "ON"
      - idx: 71029
        state: "OFF"
    conditions:
      - type: "device_state"
        idx: 51005
        is: "OFF"        # Condition A: Room is currently off
      - type: "time_of_day"
        is: "light"      # Condition B: Sun is still up
    actions:
      - idx: 51005       # living hue room
        state: "ON"
        preset: "relax_red"
      - idx: 71003       # living main
        state: "OFF"     # Turn off the traditional lights (Ensure this doesn't cut power to the Hue!)

  # --------------------------------------------------------------------------
  # ⚙️ HARDWARE SYNC & SYSTEM MACROS
  # --------------------------------------------------------------------------
  - name: "PC ON/OFF -> PC Aux ON/OFF"
    trigger:
      idx: 72001
      state: "SYNC"
    actions:
      - idx: 72002
        state: "SYNC"

  - name: "PC Aux ON -> Buro Schemer + Sonos ON"
    trigger:
      idx: 72002
      state: "ON"
    actions:
      - idx: 40002
        state: "ON"
      - idx: 60006  # Sonos buro
        state: "ON"
        volume: 6
        station: "qmaxhits"

  - name: "PC Aux OFF -> Buro Schemer + Sonos OFF"
    trigger:
      idx: 72002
      state: "OFF"
    actions:
      - idx: 40002
        state: "OFF"
      - idx: 60006  # Sonos buro
        state: "OFF"

  - name: "toilet_gv_ventilatie_on"
    trigger:
      idx: 71044  # toilet ventilatie knop
      state: "SYNC"
    actions:
      - idx: 71019 # ventilatie motor
        state: "SYNC"

  - name: "gocosy-savonds"
    trigger:
      event: TWILIGHT_EVENING_ON_TRIGGER
    conditions:
      - type: "device_state"
        idx: 71003 # licht living
        is: "ON"
    actions:
      - event: SCENE_GOCOSY

# --------------------------------------------------------------------------
# 🛁 BATHROOM 1 (1e) LIGHTING & HUE SYNC
# --------------------------------------------------------------------------

  # --- Main Bathroom Switch (141) Master Control ---
  - name: "Badk 1e: Main Switch ON -> Hue Red"
    trigger:
      idx: 71007         # badkamer 1e groot switch
      state: "ON"
    conditions:
      - type: "device_state"
        idx: 51001       # badkamer 1e hue room
        is: "OFF"        # Only applies Red if the room was off
    actions:
      - idx: 51001       # badkamer 1e hue room
        state: "ON"
        preset: "relax_red"
      - idx: 60003       # Sonos badk 1e
        state: "ON"
        volume: 10
        station: "qmaxhits"

  # --- Wastafel (Sink) Logic: Split into Day/Night context ---
  - name: "Badk 1e: Wastafel ON -> Hue White (If already in room)"
    trigger:
      idx: 71032         # badkamer 1e wastafel
      state: "ON"
    conditions:
      - type: "device_state"
        idx: 51001       # badkamer 1e hue room
        is: "ON"         # Only fires if the room is already lit
    actions:
      - idx: 51001
        state: "ON"
        preset: "my_white"

  - name: "Badk 1e: Wastafel OFF -> Hue Red (If already in room)"
    trigger:
      idx: 71032         # badkamer 1e wastafel
      state: "OFF"
    conditions:
      - type: "device_state"
        idx: 51001       # badkamer 1e hue room
        is: "ON"         # Only fires if the room is already lit
    actions:
      - idx: 51001
        state: "ON"
        preset: "relax_red"

  - name: "Badk 1e: Main Switch OFF -> Hue & wastafel OFF"
    trigger:
      idx: 71007
      state: "OFF"
    actions:
      - idx: 51001
        state: "OFF"
      - idx: 71032       # badkamer wastafel
        state: "OFF"
      - idx: 60003       # Sonos badk 1e
        state: "OFF"

  # --- Hue App Override Sync (Bidirectional support) ---
  - name: "Badk 1e: Hue App Syncs to Main Switch-ON"
    trigger:
      idx: 51001         # If someone uses the Hue app/remote...
      state: "ON"
    actions:
      - idx: 71007       # ...the relay physically follows suit.
        state: "ON"
      - idx: 60003       # Sonos badk 1e
        state: "ON"
        volume: 10
        station: "qmaxhits"

  - name: "Badk 1e: Hue App Syncs to Main Switch-OFF"
    trigger:
      idx: 51001         # If someone uses the Hue app/remote...
      state: "OFF"
    actions:
      - idx: 71007       # ...the relay physically follows suit.
        state: "OFF"
      - idx: 60003       # Sonos badk 1e
        state: "OFF"

# --------------------------------------------------------------------------
# 🛁 BATHROOM 2 (2e) LIGHTING & HUE SYNC
# --------------------------------------------------------------------------

  # --- Main Bathroom Switch Master Control ---
  - name: "Badk 2e: Main Switch ON -> Hue Red"
    trigger:
      idx: 71009         # badkamer 2e groot switch
      state: "ON"
    conditions:
      - type: "device_state"
        idx: 51007       # badkamer 2e hue room
        is: "OFF"        # Only applies Red if the room was off
    actions:
      - idx: 51007       # badkamer 2e hue room
        state: "ON"
        preset: "relax_red"
      - idx: 60001       # Sonos badk 2e
        state: "ON"
        volume: 10
        station: "qmaxhits"

  # --- Wastafel (Sink) Logic: Split into Day/Night context ---
  - name: "Badk 2e: Wastafel ON -> Hue White (If already in room)"
    trigger:
      idx: 71010         # badkamer 2e wastafel
      state: "ON"
    conditions:
      - type: "device_state"
        idx: 51007       # badkamer 2e hue room
        is: "ON"         # Only fires if the room is already lit
    actions:
      - idx: 51007
        state: "ON"
        preset: "my_white"

  - name: "Badk 2e: Wastafel OFF -> Hue Red (If already in room)"
    trigger:
      idx: 71010         # badkamer 2e wastafel
      state: "OFF"
    conditions:
      - type: "device_state"
        idx: 51007       # badkamer 2e hue room
        is: "ON"         # Only fires if the room is already lit
    actions:
      - idx: 51007
        state: "ON"
        preset: "relax_red"

  - name: "Badk 2e: Main Switch OFF -> Hue & wastafel OFF"
    trigger:
      idx: 71009
      state: "OFF"
    actions:
      - idx: 51007
        state: "OFF"
      - idx: 71010
        state: "OFF"
      - idx: 60001       # Sonos badk 2e
        state: "OFF"

  # --- Hue App Override Sync (Bidirectional support) ---
  - name: "Badk 2e: Hue App Syncs to Main Switch-ON"
    trigger:
      idx: 51007         # If someone uses the Hue app/remote...
      state: "ON"
    actions:
      - idx: 71009
        state: "ON"
      - idx: 60001       # Sonos badk 2e
        state: "ON"
        volume: 10
        station: "qmaxhits"

  - name: "Badk 2e: Hue App Syncs to Main Switch-OFF"
    trigger:
      idx: 51007         # If someone uses the Hue app/remote...
      state: "OFF"
    actions:
      - idx: 71009       # ...the relay physically follows suit.
        state: "OFF"
      - idx: 60001       # Sonos badk 2e
        state: "OFF"

  # --------------------------------------------------------------------------
  # 🛏️ SLPK WANNES LIGHTING & HUE SYNC
  # --------------------------------------------------------------------------

  # --- Physical Switch Master Control ---
  - name: "Slpk Wannes: Switch ON -> Hue Red (If Room was Dark)"
    trigger:
      idx: 71028         # slpk Wannes nachtlichtjes (2e switch)
      state: "ON"
    conditions:
      - type: "device_state"
        idx: 51006       # room: slpk Wannes-rm
        is: "OFF"        # 🛡️ Anti-Overwrite Guard: Only applies Red if the room was off
    actions:
      - idx: 51006
        state: "ON"
        preset: "relax_red"

  - name: "Slpk Wannes: Switch OFF -> Hue OFF"
    trigger:
      idx: 71028
      state: "OFF"
    actions:
      - idx: 51006
        state: "OFF"

  # --- Hue App Override Sync (Bidirectional support) ---
