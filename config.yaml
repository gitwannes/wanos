    off_id: "545514"


# ==============================================================================
#
# ==============================================================================

weather:
  # OWM
  idx: 30001
  name: "Outside temp & hum"
  location: "Borsbeek,BE"
  poll_interval_mins: 10
  # Once-daily sunrise/sunset + env schedule: first OWM tick at/after this local time
  # (not at midnight — OWM 2.5 can still return yesterday's sun just after date rollover).
  sun_refresh_hour: 3
  sun_refresh_minute: 30

hardware_links:
  # Maps actuator entity_ids to linked power meter entity_ids.
  # When the actuator turns OFF, the backend will auto-flush the power meter to 0.0W.
  power_meters:
    zwave.pc: sensor.power.pc_power
    zwave.pc_monitors: sensor.power.pc_monitors_power

# Sensor / utility history (power, water, charts) — see docs/sensor_history.md
history:
  timezone: "Europe/Brussels"
  retention:
    hires_days: 7
    hourly_days: 31
    daily_days: 365
  sample:
    kwh_step_wh: 100        # hi-res W sample every 0.1 kWh
    water_step_l: 1.0       # consumption step every liter
    zwave_min_interval_secs: 60
    climate_temp_deadband: 0.5
    climate_hum_deadband: 2.0
    climate_max_interval_secs: 300
  tracked_entities:
    - sensor.energy.kwh_meter
    - sensor.fluid.koud_water
    - sensor.fluid.warm_water
    - sensor.power.pc_power
    - sensor.power.pc_monitors_power
    # HomeWizard G10 (entity_ids born from device_map names)
    - sensor.power.homewizard.p1_power
    - sensor.power.homewizard.p1_power_l1
    - sensor.power.homewizard.p1_power_l2
    - sensor.power.homewizard.p1_power_l3
    - sensor.energy.homewizard.p1_import_kwh
    - sensor.energy.homewizard.p1_export_kwh
    - sensor.energy.homewizard.p1_import_t1_kwh
    - sensor.energy.homewizard.p1_import_t2_kwh
    - sensor.energy.homewizard.p1_export_t1_kwh
    - sensor.energy.homewizard.p1_export_t2_kwh
    - sensor.power.homewizard.p1_avg_15m_w
    - sensor.power.homewizard.p1_monthly_peak_w
    - sensor.fluid.homewizard.p1_gas_m3
    - sensor.power.homewizard.pv_power
    - sensor.energy.homewizard.pv_export_kwh
    - sensor.energy.homewizard.pv_import_kwh

# ==============================================================================
# Automatic sections (deviceexplorer_hide, auto_off_devices, automations) live in:
#   automations.auto.yaml
# ==============================================================================
sauna:
  default_sauna_setpoint: 80     # Default sauna temperature setpoint
  min_temp: 50                   # Minimum setpoint that can be set in the UI
  max_temp: 95                   # Maximum setpoint that can be set in the UI
  kp: 12.0                       # PID Proportional (band = 100/kp C)
  ki: 0.0                        # PID Integral (v1 heat-up: off)
  kd: 0.0                        # PID Derivative (v1: off)
  setpoint_bias: -1.0            # C added to PID setpoint during autohold; -1 coasts last degree
  default_timer: 70              # Default sauna duration in minutes
  # Post-OFF extraction fan: Library (Sauna OFF Set after) + Timers & types auto-off — not hub timers.
  # Start gate: door must have been CLOSED within this many minutes (null closed_since blocks).
  door_closed_max_mins: 5
  timer_offset_temp: 7.0         # Frozen countdown: triggers when temp >= (Setpoint - Offset)
  # Software PWM for U/V/W SSRs (ZC type). 0.5 Hz = 2 s period => 1% MOD = 20 ms = 1 full sinus.
  pwm_freq: 0.5

ir:
  default_ir_modulation: 75      # Default IR power modulation (75%)
  default_time_mins: 7             # Initial IR session duration at IR_ON
  min_time_mins: 3
  max_time_mins: 20

bathroom1:
  vent_min_runtime_mins: 5       # Shower vent lock duration (hub 90001); humidity band → Library rule Badk 1e ventilatie

blinds:
  default_travel_time_secs: 35
  travel_times:
    blinds.cinema: 30
    blinds.sauna: 20
    blinds.gv_links: 35
    blinds.gv_rechts: 34

# 🌍 The Daily Time-Series Engine (Environmental Bounds)
environmental_schedule:
  blinds:
    morning_open_earliest: "07:00"
    morning_open_latest: "09:00"
    evening_close_earliest: "16:30"
    evening_close_latest: "22:00"
  twilight:
    evening_off_time: "23:00"
    morning_on_time: "06:00"

