          - entity_id: zwave.berging_2e
            state: 'OFF'
        label: 'False'
    id: 513ef949-cd33-4a7d-8417-4959c4c829d2
  - name: 'Spare Button: Hue is ON -> Trigger ALL OFF'
    enabled: true
    branches:
      - when: if
        conditions:
          - type: device_state
            entity_id: zwave.living_special
            is: ANY
          - type: device_state
            entity_id: hue.group.living_hue
            is: 'ON'
        actions:
          - event: 9bb384f0-1787-44a8-aaa2-5fee007552d3
    id: 839d64aa-6216-4405-9fee-b75287adb039
  - name: 'Spare Button: Hue OFF + Night -> Go Cosy'
    enabled: true
    branches:
      - when: if
        conditions:
          - type: device_state
            entity_id: zwave.living_special
            is: ANY
          - type: device_state
            entity_id: hue.group.living_hue
            is: 'OFF'
          - type: time_of_day
            is: dark
        actions:
          - event: 7c5f2d72-4774-445c-8874-6f5e6fbe13f2
      - when: else_if
        conditions:
          - type: device_state
            entity_id: zwave.living_special
            is: ANY
          - type: device_state
            entity_id: hue.group.living_hue
            is: 'ON'
        actions:
          - event: 9bb384f0-1787-44a8-aaa2-5fee007552d3
    id: 364ac941-35c6-467d-9232-37b2b2b29568
  - name: 'Spare Button: Hue OFF + Day -> Red Accent'
    enabled: true
    branches:
      - when: if
        conditions:
          - type: device_state
            entity_id: zwave.living_special
            is: ANY
          - type: device_state
            entity_id: hue.group.living_hue
            is: 'OFF'
          - type: time_of_day
            is: light
        actions:
          - entity_id: hue.group.living_hue
            state: 'ON'
            preset: relax_red
          - entity_id: zwave.licht_living
            state: 'OFF'
    id: 48e294b0-8784-40b6-a9eb-cf6e5a991407
  - name: PC ON/OFF -> PC Aux ON/OFF
    enabled: true
    branches:
      - when: if
        conditions:
          - type: device_state
            entity_id: zwave.pc
            is: 'ON'
        actions:
          - entity_id: zwave.pc_monitors
            state: 'ON'
        label: 'True'
      - when: else_if
        conditions:
          - type: device_state
            entity_id: zwave.pc
            is: 'OFF'
        actions:
          - entity_id: zwave.pc_monitors
            state: 'OFF'
        label: 'False'
    id: 06b759d4-5636-4063-8657-ed72b5b5deb7
  - name: PC OFF -> Buro Schemer FORCE OFF
    enabled: true
    branches:
      - when: if
        conditions:
          - type: device_state
            entity_id: zwave.pc_monitors
            is: 'OFF'
        actions:
          - entity_id: rfx.buro_wannes_schemer
            state: 'OFF'
        label: 'False'
    id: 1a1bdfaa-1b8e-40aa-b20a-3002411ec7ac
  - name: PC Aux ON -> Buro Schemer + Sonos ON
    enabled: true
    branches:
      - when: if
        conditions:
          - type: device_state
            entity_id: zwave.pc_monitors
            is: 'ON'
        actions:
          - entity_id: rfx.buro_wannes_schemer
