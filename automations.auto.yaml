          - entity_id: zwave.tuin
            state: "ON"
          - entity_id: zwave.kerst_lichten_tuin
            state: "ON"
          - entity_id: rfx.kerst_lichten_voor
            state: "ON"
          - entity_id: rfx.kerstboom
            state: "ON"
      - when: else_if
        conditions:
          - type: event
            event: bd0413be-926a-45ef-bdb8-1adfe3b7e8ab
          - type: device_state
            entity_id: zwave.licht_living
            is: "OFF"
        actions:
          - entity_id: zwave.tuin
            state: "ON"
          - entity_id: zwave.kerst_lichten_tuin
            state: "ON"
          - entity_id: rfx.kerst_lichten_voor
            state: "ON"
          - entity_id: rfx.kerstboom
