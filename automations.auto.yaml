  # --- CINEMA OFF: SPLIT INTO TWO RULES FOR IF/ELSE LOGIC ---
    id: e5a56e29-3ad8-46bf-9f1b-3bdeca33ee35
  - name: "--- CINEMA OFF"
    # This one makes it to the dashboard.trigger:
    # It fires the event "SCENE_CINEMA_OFF", both this and "CINEMA OFF (Day)" are then evaluated.
    scene: true
    require_confirmation: true  # ⚡ High impact macro: pop up confirmation modal
    trigger:
      event: "SCENE_CINEMA_OFF"
    conditions:
      - type: "time_of_day"
        is: "dark"
    actions:
      - entity_id: switch.cinema_projector
        state: "FORCE_OFF"
      - entity_id: hue.group.cinema_hue
        state: "OFF"
      - entity_id: switch.cinema_licht
        state: "ON"
    id: e0970780-d016-4964-9330-f403e3e0da6e
  - name: "CINEMA OFF (Day)"
    trigger:
      event: "SCENE_CINEMA_OFF"
    conditions:
      - type: "time_of_day"
        is: "light"
    actions:
      - entity_id: switch.cinema_projector
        state: "FORCE_OFF"
      - entity_id: hue.group.cinema_hue
        state: "OFF"
      - entity_id: blinds.cinema
        state: "0"
    id: f56fb02b-d1b6-4508-bf85-a5808f9c0c39
