  - name: '--- CINEMA OFF'
    enabled: true
    branches:
      - when: if
        conditions:
          - type: event
            event: 44667b31-c281-4487-9d05-9093ba111a86
          - type: time_of_day
            is: dark
        actions:
          - entity_id: zwave.cinema_licht
            state: "ON"
          - entity_id: switch.epson
            state: "OFF"
