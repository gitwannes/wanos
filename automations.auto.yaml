  - id: b3f9c1f0-700d-40e5-b98e-e818445b26c9
    name: "Morning Blinds Open"
    scene: false
    require_confirmation: false
    trigger:
      event: blinds
    on:
      actions:
        - entity_id: blinds.gv_links
          state: "0"
        - entity_id: blinds.gv_rechts
          state: "0"
        - entity_id: blinds.sauna
          state: "0"
        - entity_id: blinds.cinema
          state: "0"

    off:
      actions:
        - entity_id: blinds.gv_links
          state: "100"
        - entity_id: blinds.gv_rechts
          state: "100"
        - entity_id: blinds.sauna
          state: "100"
        - entity_id: blinds.cinema
          state: "100"

  - name: "Tuinlichten & kerststuff aan 's avonds"
    trigger:
      - event: "TWILIGHT_EVENING_ON_TRIGGER"
    actions:
      - entity_id: switch.tuin
        state: "ON"
      - entity_id: switch.kerstboom
        state: "ON"
      - entity_id: switch.kerst_lichten_tuin
        state: "ON"
      - entity_id: switch.kerst_lichten_voor
        state: "ON"

    id: ea2ab903-fe8c-4375-a771-3bb47a7c9417
  - name: "Tuinlichten & kerststuff uit 's avonds"
    trigger:
      - event: "TWILIGHT_EVENING_OFF_TRIGGER"
    actions:
      - entity_id: switch.tuin
        state: "OFF"
      - entity_id: switch.kerstboom
        state: "OFF"
      - entity_id: switch.kerst_lichten_tuin
        state: "OFF"
      - entity_id: switch.kerst_lichten_voor
        state: "OFF"

    id: da035d08-aa2b-4cf2-8e98-8a79402819fb
  - id: b53fb293-fe1f-481d-97ac-9f5acedd0a00
    name: "Kerstverlichting voor & achter aan 's morgens"
    scene: false
    require_confirmation: false
    trigger:
      event: twilight_morning
    on:
      actions:
        - entity_id: switch.kerst_lichten_tuin
          state: "ON"
        - entity_id: switch.kerst_lichten_voor
          state: "ON"

    off:
      actions:
        - entity_id: switch.kerst_lichten_tuin
          state: "OFF"
        - entity_id: switch.kerst_lichten_voor
          state: "OFF"

  - name: "Tuinlichten Evening ON"
    trigger:
      event: "TWILIGHT_EVENING_ON_TRIGGER"
    actions:
      - entity_id: switch.tuin
        state: "ON"

    id: 806a7710-cee6-437b-bd2e-c0e7dc96f0c2
  - name: "Tuinlichten Evening OFF"
    trigger:
      event: "TWILIGHT_EVENING_OFF_TRIGGER" # Fires exactly at 23:00 (or config setting)
    actions:
      - entity_id: switch.tuin
        state: "OFF"

