            is: 'OFF'
        actions:
          - entity_id: zwave.badk_1e_hue_physical
            state: 'OFF'
          - entity_id: media_player.badk_1e
            state: 'OFF'
        label: 'False'
    id: caa74273-e140-4354-8021-741bf7c311ca
  - name: 'Badk 2e: Main Switch ON -> Hue Red'
    enabled: true
    branches:
      - when: if
