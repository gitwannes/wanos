        conditions:
          - type: event
            event: 44667b31-c281-4487-9d05-9093ba111a86
          - type: time_of_day
            is: light
        actions:
          - entity_id: blinds.cinema
            state: '0'
          - entity_id: switch.epson
            state: "OFF"
          - entity_id: hue.group.cinema_hue
            state: "OFF"
    id: 1cc80d94-969f-404c-8e0e-7195d86223cd
