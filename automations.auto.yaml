        actions:
          - entity_id: zwave.vent.toilet_motor
            state: "OFF"
    id: 7ffde6cb-61e2-4754-a392-47d136a0b0b4
  - name: 'Badk 1e: Main Switch ON -> Hue Red'
    enabled: true
    branches:
      - when: if
        conditions:
          - type: device_state
            entity_id: zwave.badk_1e_hue_physical
            is: 'ON'
