    on:
      actions:
        - entity_id: switch.buro_wannes_schemer
          state: "ON"
        - entity_id: media_player.buro
          state: "ON"
          volume: 6
          station: "qmaxhits"

    off:
      actions:
        - entity_id: switch.buro_wannes_schemer
          state: "FORCE_OFF"
        - entity_id: media_player.buro
          state: "OFF"

  - name: "toilet_gv_ventilatie_on"
    trigger:
      entity_id: switch.vent.toilet_ventilatie
      state: "SYNC"
    actions:
      - entity_id: switch.vent.toilet_ventilatie_motor
        state: "SYNC"

    id: 7ffde6cb-61e2-4754-a392-47d136a0b0b4
  - name: "gocosy-savonds"
    trigger:
      event: TWILIGHT_EVENING_ON_TRIGGER
    conditions:
      - type: "device_state"
        entity_id: switch.licht_living
        is: "ON"
    actions:
      - event: SCENE_GOCOSY

# --------------------------------------------------------------------------
# 🛁 BATHROOM 1 (1e) LIGHTING & HUE SYNC
# --------------------------------------------------------------------------

  # --- Main Bathroom Switch (141) Master Control ---
    id: db6338f5-dc44-4482-994b-cdc620a381c8
  - id: 9133d4f5-453d-464e-86df-e5f2bc61be8b
    name: "Badk 1e: Main Switch ON -> Hue Red"
    scene: false
    require_confirmation: false
    trigger:
      entity_id: switch.badk_1e_hue_physical
    on:
      actions:
        - entity_id: hue.group.badk_1e_hue
          state: "ON"
          preset: "relax_red"
        - entity_id: media_player.badk_1e
          state: "ON"
          volume: 10
          station: "qmaxhits"

  # --- Wastafel (Sink) Logic: Split into Day/Night context ---
      conditions:
        - type: "device_state"
          entity_id: hue.group.badk_1e_hue
          is: "OFF"      # Only applies Red if the room was off
    off:
      actions:
        - entity_id: hue.group.badk_1e_hue
          state: "OFF"
        - entity_id: switch.badk_1e_wastafel
          state: "OFF"
        - entity_id: media_player.badk_1e
          state: "OFF"

  # --- Hue App Override Sync (Bidirectional support) ---
  - id: 751cdc57-c079-488b-91ca-708246f15e3a
    name: "Badk 1e: Wastafel ON -> Hue White (If already in room)"
    scene: false
    require_confirmation: false
    trigger:
      entity_id: switch.badk_1e_wastafel
    on:
      actions:
        - entity_id: hue.group.badk_1e_hue
          state: "ON"
          preset: "my_white"

      conditions:
        - type: "device_state"
          entity_id: hue.group.badk_1e_hue
          is: "ON"       # Only fires if the room is already lit
    off:
      actions:
        - entity_id: hue.group.badk_1e_hue
          state: "ON"
          preset: "relax_red"

      conditions:
        - type: "device_state"
          entity_id: hue.group.badk_1e_hue
          is: "ON"       # Only fires if the room is already lit
  - id: caa74273-e140-4354-8021-741bf7c311ca
    name: "Badk 1e: Hue App Syncs to Main Switch-ON"
    scene: false
    require_confirmation: false
    trigger:
      entity_id: hue.group.badk_1e_hue
    on:
      actions:
        - entity_id: switch.badk_1e_hue_physical
          state: "ON"
        - entity_id: media_player.badk_1e
          state: "ON"
          volume: 10
          station: "qmaxhits"

    off:
      actions:
        - entity_id: switch.badk_1e_hue_physical
          state: "OFF"
        - entity_id: media_player.badk_1e
          state: "OFF"

