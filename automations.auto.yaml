    id: 1a1bdfaa-1b8e-40aa-b20a-3002411ec7ac
  - id: 1b8371ae-8846-42e0-9e40-7ce11b2669da
    name: "PC Aux ON -> Buro Schemer + Sonos ON"
    scene: false
    require_confirmation: false
    trigger:
