            state: 'OFF'
          - entity_id: media_player.buro
            state: 'OFF'
        label: 'False'
    id: 1b8371ae-8846-42e0-9e40-7ce11b2669da
  - name: Toilet gv ventilatie
    enabled: true
    branches:
      - when: if
        conditions:
          - type: device_state
            entity_id: switch.vent.toilet_ventilatie
            is: "ON"
        actions:
          - entity_id: zwave.vent.toilet_motor
            state: "ON"
      - when: else_if
        conditions:
          - type: device_state
            entity_id: switch.vent.toilet_ventilatie
