    id: 06b759d4-5636-4063-8657-ed72b5b5deb7
  - name: "PC OFF -> Buro Schemer FORCE OFF"
    trigger:
      entity_id: switch.pc
      state: "OFF"
    actions:
      - entity_id: switch.buro_wannes_schemer
