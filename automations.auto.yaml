# ==============================================================================
# WanOS automatic / UI-owned configuration (automations.auto.yaml)
# ==============================================================================
# Owned by WanOS / future UI (Device Explorer exclude, lighting auto-off, automations).
# Manual runtime settings remain in config.yaml.
# Z-Wave mesh hidden_nodes live in config_zwave.auto.yaml (merged at runtime).
# ==============================================================================


# Devices hidden from Device Explorer (and Sensor History list unless "Hidden" is on).
# entity_ids for WanOS-owned devices. Z-Wave mesh uses config_zwave.auto.yaml → hidden_nodes
# (merged into the same runtime list at bridge start).
deviceexplorer_exclude:
  - switch.cinema_projector
  - switch.kerstboom
  - switch.kerst_lichten_voor
  - switch.kerst_lichten_tuin
  - hue.group.verd_0_hue
  - hue.group.verd_1_hue
  - hue.group.verd_2_hue
  - sensor.energy.kwh_meter
  - sensor.fluid.koud_water
  - sensor.fluid.warm_water
  - sensor.door.sauna_deur
  - sensor.door.badkamer_deur
  - sensor.temp_hum.host_cpu_temperature
  - sensor.generic.host_cpu_usage
  - sensor.generic.host_memory_free
  - sensor.generic.host_disk_free_root
  - sensor.generic.host_log2ram_free
  - sensor.generic.host_load_average_1m
  - sensor.generic.host_load_average_5m
  - sensor.generic.host_load_average_15m
  - sensor.generic.wanos_db_size
  - sensor.temp_hum.sauna_high
  - sensor.temp_hum.sauna_low

# ==============================================================================
# LIGHTING (managed lights / auto-off delays)
# ==============================================================================

lighting:
  # The engine will ONLY apply auto-off rules to entity_ids explicitly listed here
  managed_lights: [switch.licht_living, switch.licht_keuken, switch.gang_beneden,
    switch.licht_garage, switch.badk_1e_hue_physical, switch.gang_boven, 
        switch.buro_licht, switch.cinema_licht, switch.waskot, 
        switch.voorraad_gv, switch.slpk_dries, switch.vent.badk_2e_ventilatie, 
        switch.cinema_schemer, switch.buro_wannes_schemer, switch.living_schemer,
    switch.slpk_liene, switch.berging_2e, switch.eetkamer, switch.slpk_wannes, 
        hue.group.slpk_wannes_hue, hue.group.eetkamer_hue, hue.group.living_hue, 
        hue.group.slpk_dries_hue, hue.group.cinema_hue, switch.toilet, 
        switch.vent.toilet_ventilatie]
  default_auto_off_minutes: 300
  # Specific delay overrides in minutes
  auto_off_delays:
    hue.group.slpk_wannes_hue: 90
    hue.group.slpk_dries_hue: 30
    switch.licht_garage: 10
    switch.badk_1e_hue_physical: 120
    switch.gang_boven: 10
    switch.waskot: 5
    switch.voorraad_gv: 1
    switch.slpk_dries: 30
    switch.vent.badk_2e_ventilatie: 30
    switch.berging_2e: 1
    switch.eetkamer: 30
    switch.slpk_wannes: 30
    switch.toilet: 10
    switch.vent.toilet_ventilatie: 5


