      - when: else_if
        conditions:
          - type: device_state
            entity_id: zwave.badk_1e_hue_physical
            is: 'OFF'
        actions:
          - entity_id: hue.group.badk_1e_hue
            state: 'OFF'
          - entity_id: zwave.badk_1e_wastafel
