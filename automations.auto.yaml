automations:
  - name: Shutters open
    enabled: true
    branches:
      - when: if
        conditions:
          - type: event
            event: a130c1d4-1bc9-4491-b126-81f716c045c9
        actions:
          - entity_id: blinds.gv_links
            state: '0'
          - entity_id: blinds.gv_rechts
            state: '0'
          - entity_id: blinds.sauna
            state: '0'
          - entity_id: blinds.cinema
            state: '0'
    id: 9d518d73-fbf2-4e11-8aeb-0f2ab7ba7320
  - name: Shutters close
    enabled: true
    branches:
      - when: if
        conditions:
          - type: event
            event: 70716703-5fc0-438b-8af5-db6a1cb1bd07
        actions:
          - entity_id: blinds.gv_links
            state: '100'
          - entity_id: blinds.gv_rechts
            state: '100'
          - entity_id: blinds.sauna
            state: '100'
          - entity_id: blinds.cinema
            state: '100'
    id: 2460e48d-6dfc-42fc-92ac-7595f71be7c1
  - name: Evening lights on
    enabled: true
    branches:
      - when: if
        conditions:
          - type: event
            event: bd0413be-926a-45ef-bdb8-1adfe3b7e8ab
