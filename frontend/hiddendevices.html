<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="WanOS" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <title>WanOS // Admin - Explorer Hidden Devices</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="/wanos.css?v=1" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="bg-base-300 min-h-screen text-base-content" x-data="hiddenDevicesApp()" x-init="init()">

<div data-wanos-offline data-tone="warning" data-message="Loading…"></div>
<div data-wanos-nav="hiddendevices"></div>

<main class="max-w-3xl mx-auto px-3 md:px-6 pb-10">
    <section class="card bg-base-100 border border-base-200 shadow-xl">
        <div class="card-body p-4 gap-4">
            <p class="text-xs text-base-content/60">
                Checked devices are soft-hidden from Device Explorer and Blocky pickers (unless “Show Explorer-hidden” is on).
                Pi power relay is never listed (hard-deny).
            </p>

            <div x-show="errorMessage" class="alert alert-error text-sm" x-cloak>
                <span x-text="errorMessage"></span>
            </div>
            <div x-show="infoMessage" class="alert alert-success text-sm" x-cloak>
                <span x-text="infoMessage"></span>
            </div>

            <div class="flex flex-wrap gap-2 items-center">
                <div class="join">
                    <button type="button" class="btn btn-xs join-item"
                            :class="viewMode === 'all' ? 'btn-secondary' : 'btn-ghost'"
                            @click="viewMode = 'all'">All</button>
                    <button type="button" class="btn btn-xs join-item"
                            :class="viewMode === 'hidden' ? 'btn-secondary' : 'btn-ghost'"
                            @click="viewMode = 'hidden'">Hidden only</button>
                    <button type="button" class="btn btn-xs join-item"
                            :class="viewMode === 'visible' ? 'btn-secondary' : 'btn-ghost'"
                            @click="viewMode = 'visible'">Non-hidden only</button>
                </div>
                <input type="text" class="input input-bordered input-sm flex-1 min-w-[12rem] font-mono"
                       placeholder="Search name or type (terms, -exclude)"
                       x-model="searchQuery">
            </div>

            <div class="flex flex-wrap gap-2 items-center">
                <button type="button" class="btn btn-outline btn-xs" @click="selectAllVisible()" :disabled="busy">Select all visible</button>
                <button type="button" class="btn btn-outline btn-xs" @click="deselectAllVisible()" :disabled="busy">Deselect all visible</button>
                <button type="button" class="btn btn-primary btn-sm ml-auto" @click="save()" :disabled="busy || !dirty">
                    <span x-show="!busy">Save &amp; reload config</span>
                    <span x-show="busy" class="loading loading-spinner loading-xs"></span>
                </button>
            </div>

            <div class="text-[10px] font-mono text-base-content/50"
                 x-text="visibleRows.length + ' listed · ' + selectedCount + ' hidden selected · ' + (dirty ? 'unsaved' : 'saved')"></div>

            <div class="max-h-[65vh] overflow-y-auto border border-base-300 rounded-box">
                <table class="table table-sm">
                    <thead class="sticky top-0 bg-base-200 z-10">
                        <tr class="text-base-400 font-mono text-[10px] uppercase tracking-wider">
                            <th class="w-12">Hide</th>
                            <th class="w-28 cursor-pointer select-none hover:text-base-content"
                                @click="toggleSort('type')">
                                <span x-text="'Type' + sortIndicator('type')"></span>
                            </th>
                            <th class="cursor-pointer select-none hover:text-base-content"
                                @click="toggleSort('name')">
                                <span x-text="'Name' + sortIndicator('name')"></span>
                            </th>
                        </tr>
                    </thead>
                    <tbody class="text-sm">
                        <template x-for="row in visibleRows" :key="row.eid">
                            <tr class="hover:bg-base-200/40"
                                :class="row.unsaved ? 'bg-amber-500/25 ring-1 ring-inset ring-amber-400' : ''"
                                :title="row.unsaved ? 'Unsaved hide change' : ''">
                                <td>
                                    <input type="checkbox" class="checkbox checkbox-sm"
                                           :class="row.unsaved ? 'checkbox-warning' : 'checkbox-secondary'"
                                           :checked="row.hidden"
                                           @change="toggle(row, $event.target.checked)">
                                </td>
                                <td class="font-mono text-xs uppercase tracking-wide"
                                    :class="row.unsaved ? 'text-warning font-bold' : 'text-base-content/60'"
                                    x-text="row.typeLabel"></td>
                                <td class="font-medium"
                                    :class="row.unsaved ? 'text-warning' : ''"
                                    x-text="row.name"></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <div x-show="visibleRows.length === 0" class="p-6 text-center text-xs text-base-content/50 italic">
                    No devices match this filter.
                </div>
            </div>
        </div>
    </section>
</main>

<dialog id="unsaved_changes_modal" class="modal modal-bottom sm:modal-middle backdrop-blur-sm z-[9999]">
    <div class="modal-box border border-warning/40 bg-base-300 shadow-2xl">
        <h3 class="font-bold text-lg text-warning tracking-wide">Unsaved changes</h3>
        <p class="py-3 text-sm text-base-content/80">
            Soft-hide edits are not saved. Leave and discard them, or save first?
        </p>
        <div class="modal-action flex-wrap gap-2">
            <button type="button" class="btn btn-ghost btn-sm" @click="cancelUnsavedLeave()">Cancel</button>
            <button type="button" class="btn btn-outline btn-error btn-sm" @click="discardUnsavedLeave()">Discard</button>
            <button type="button" class="btn btn-warning btn-sm" @click="saveUnsavedLeave()" :disabled="busy">
                <span x-show="!busy">Save</span>
                <span x-show="busy" class="loading loading-spinner loading-xs"></span>
            </button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button type="button" @click="cancelUnsavedLeave()">close</button></form>
</dialog>

<script src="/wanos-shell.js?v=14"></script>
<script src="/hiddendevices.js?v=10"></script>
</body>
</html>
