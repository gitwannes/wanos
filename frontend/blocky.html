<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="WanOS" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <title>WanOS - Blocky</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/blockly@13.2.1/blockly.min.js"></script>

    <style>
        /* Same constraints as helpers/blockly_minimal_test.html.
           Do NOT force .blocklySvg width/height — Blockly owns those pixels.
           Do NOT put Blockly on Alpine reactive state (Proxy breaks drag/snap). */
        #blocklyWorkspace {
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 520px;
        }
        #blocklyWorkspace.blockly-fs {
            height: calc(100vh - 5.5rem);
        }
        #blocklyWorkspace .injectionDiv {
            width: 100%;
            height: 100%;
        }
        #blocklyWorkspace svg,
        .blocklySvg,
        .blocklyWidgetDiv svg,
        .blocklyDropDownDiv svg {
            max-width: none !important;
            max-height: none !important;
        }
        .blocklyWidgetDiv, .blocklyDropDownDiv, .blocklyTooltipDiv { z-index: 100000 !important; }
        .blocklyToolboxDiv { z-index: 20; }
        /* Park off-screen instead of display:none — keeps metrics valid like the test page. */
        #blocklyPanel.is-parked {
            position: fixed !important;
            left: -10000px !important;
            top: 0 !important;
            width: 900px !important;
            opacity: 0 !important;
            pointer-events: none !important;
            z-index: -1 !important;
        }
    </style>
</head>
<body class="bg-base-300 min-h-screen text-base-content p-6" x-data="blockyApp()" x-init="init()">

<div x-show="!connected" x-cloak
     class="fixed inset-0 z-[9999] bg-base-300/95 backdrop-blur-md flex flex-col items-center justify-center text-center px-6 transition-opacity duration-300">
    <span class="loading loading-infinity w-16 text-warning mb-4"></span>
    <h2 class="text-2xl font-black tracking-widest text-base-content">NOT CONNECTED</h2>
    <p class="text-warning mt-2 font-mono text-sm">Loading Blocky editor state...</p>
</div>

<header class="mb-8 flex justify-between items-center max-w-7xl mx-auto">
    <div class="flex items-center gap-4">
        <a href="/admin.html" class="btn btn-ghost btn-circle text-base-content/50 hover:text-primary transition-colors" title="Return to Admin">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
        </a>
        <div>
            <h1 class="text-2xl font-black text-warning uppercase tracking-widest">⚡ Blocky Automation Editor</h1>
            <p class="text-xs text-base-content/50 font-mono mt-1">Blockly primary · form/JSON fallback</p>
        </div>
    </div>

    <div class="flex gap-3 items-center">
        <span class="badge font-bold hidden md:inline-flex" :class="connected ? 'badge-success' : 'badge-error'" x-text="connected ? 'CONNECTED' : 'OFFLINE'"></span>
        <button class="btn btn-outline btn-sm" @click="refreshAll()" :disabled="busy">
            <span x-show="!busy">Refresh</span>
            <span x-show="busy" class="loading loading-spinner loading-xs"></span>
        </button>
    </div>
</header>

<main class="max-w-7xl mx-auto grid grid-cols-1 xl:grid-cols-3 gap-6">
    <section class="xl:col-span-1 card bg-base-100 border border-base-200 shadow-xl">
        <div class="card-body p-4">
            <div class="flex justify-between items-center mb-3">
                <h2 class="card-title text-sm uppercase tracking-wider">Automations</h2>
                <button class="btn btn-xs btn-warning" @click="newRule()">New</button>
            </div>
            <input type="text" class="input input-bordered input-sm mb-3 font-mono" placeholder="Filter by name" x-model="filterText">
            <div class="max-h-[70vh] overflow-y-auto pr-1 flex flex-col gap-1 items-stretch w-full">
                <template x-for="rule in filteredRules" :key="rule.id || rule.name">
                    <button class="w-full btn btn-sm justify-start text-left normal-case gap-2 px-2"
                            :class="(selectedRule && !selectedRule.isDraft && selectedRule.id === rule.id) ? 'btn-warning' : (selectedRule && selectedRule.isDraft ? '' : 'btn-ghost')"
                            @click="selectRule(rule)">
                        <span class="badge badge-xs shrink-0" :class="ruleListBadgeClass(rule)" x-text="ruleListKind(rule)"></span>
                        <span class="truncate flex-1 text-left" x-text="rule.name || '(unnamed)'"></span>
                    </button>
                </template>
            </div>
        </div>
    </section>

    <section class="xl:col-span-2 card bg-base-100 border border-base-200 shadow-xl">
        <div class="card-body p-4">
            <div x-show="errorMessage" class="alert alert-error text-sm mb-3">
                <span x-text="errorMessage"></span>
            </div>
            <div x-show="infoMessage" class="alert alert-success text-sm mb-3">
                <span x-text="infoMessage"></span>
            </div>

            <template x-if="!selectedRule">
                <div class="text-base-content/60 text-sm">Select a rule from the list, or click <b>New</b> to create one.</div>
            </template>

            <template x-if="selectedRule">
                <div class="space-y-4">
                    <div x-show="selectedRule.isDraft" class="text-xs text-warning font-semibold">New rule — pick trigger in Blockly, name it, then Save.</div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <label class="form-control">
                            <span class="label-text text-xs">Name</span>
                            <input class="input input-bordered input-sm" x-model="editor.name">
                        </label>
                        <label class="form-control">
                            <span class="label-text text-xs">Mode</span>
                            <select class="select select-bordered select-sm" x-model="editor.mode">
                                <option value="branched">Branched (Y1 on/off)</option>
                                <option value="flat">Flat (SYNC / advanced)</option>
                            </select>
                        </label>
                    </div>

                    <div class="flex flex-col gap-1">
                        <div class="flex gap-4 items-center">
                            <label class="label cursor-pointer gap-2">
                                <span class="label-text text-xs">Show on dashboard</span>
                                <input type="checkbox" class="checkbox checkbox-sm" x-model="editor.scene">
                            </label>
                            <label class="label cursor-pointer gap-2">
                                <span class="label-text text-xs">Require confirmation</span>
                                <input type="checkbox" class="checkbox checkbox-sm" x-model="editor.require_confirmation">
                            </label>
                        </div>
                        <p class="text-[11px] text-base-content/50 max-w-xl">
                            Dashboard = kiosk scene button. Trigger = what fires the rule (device or event in Blockly).
                            Companion rules share an event but stay off the dashboard (e.g. Cinema OFF daytime).
                        </p>
                    </div>

                    <template x-if="editor.mode === 'branched'">
                        <div class="flex flex-wrap items-center gap-3 p-2 rounded border border-base-300 bg-base-200">
                            <span class="text-xs font-semibold">Editor:</span>
                            <select class="select select-bordered select-xs" x-model="branchedEditorMode" @change="onBranchedEditorModeChanged()">
                                <option value="blockly">Blockly (primary)</option>
                                <option value="form">Form fallback</option>
                            </select>
                            <template x-if="branchedEditorMode === 'blockly'">
                                <div class="flex items-center gap-2">
                                    <button class="btn btn-xs btn-outline" @click="loadEditorIntoBlockly()">Reload canvas</button>
                                    <button class="btn btn-xs btn-outline" @click="toggleBlocklyFullscreen()" x-text="blocklyFullscreen ? 'Exit full screen' : 'Full screen'"></button>
                                </div>
                            </template>
                        </div>
                    </template>

                    <template x-if="editor.mode === 'flat'">
                        <div class="flex flex-wrap items-center gap-3 p-2 rounded border border-base-300 bg-base-200">
                            <span class="text-xs font-semibold">Editor:</span>
                            <select class="select select-bordered select-xs" x-model="flatEditorMode" @change="onFlatEditorModeChanged()" :disabled="!isFlatBlocklyCompatible(selectedRule)">
                                <option value="blockly">Blockly (primary)</option>
                                <option value="json">JSON fallback</option>
                            </select>
                            <template x-if="flatEditorMode === 'blockly'">
                                <div class="flex items-center gap-2">
                                    <button class="btn btn-xs btn-outline" @click="loadEditorIntoBlockly()">Reload canvas</button>
                                    <button class="btn btn-xs btn-outline" @click="toggleBlocklyFullscreen()" x-text="blocklyFullscreen ? 'Exit full screen' : 'Full screen'"></button>
                                </div>
                            </template>
                            <span class="text-[11px] text-base-content/50" x-show="!isFlatBlocklyCompatible(selectedRule)" x-text="flatBlocklyBlockedReason(selectedRule)"></span>
                        </div>
                    </template>

                    <div id="blocklyPanel"
                         class="space-y-2"
                         x-effect="showBlocklyWorkspace; blocklyFullscreen; queueMicrotask(() => resizeBlockly())"
                         :class="{
                             'is-parked': !showBlocklyWorkspace,
                             'fixed inset-0 z-[200] bg-base-300 p-4 flex flex-col': blocklyFullscreen && showBlocklyWorkspace
                         }">
                        <div x-show="blocklyFullscreen && showBlocklyWorkspace" class="flex flex-wrap items-center justify-between gap-2 mb-2">
                            <div>
                                <div class="font-bold text-warning uppercase tracking-wider text-sm">Blocky · full screen</div>
                                <div class="text-sm font-semibold mt-1" x-text="editor.name || '(unnamed rule)'"></div>
                            </div>
                            <div class="flex gap-2">
                                <button class="btn btn-sm btn-outline" @click="toggleBlocklyFullscreen()">Exit full screen</button>
                                <button class="btn btn-sm btn-warning" @click="saveRule()" :disabled="busy">Save</button>
                            </div>
                        </div>
                        <div id="blocklyWorkspace"
                             class="w-full rounded border border-base-300 bg-base-100"
                             :class="blocklyFullscreen && showBlocklyWorkspace ? 'blockly-fs' : ''"></div>
                        <div class="text-[11px] text-base-content/60" x-show="showBlocklyWorkspace && !blocklyFullscreen">
                            Grab a block by its coloured body to drag · drag away to disconnect · drop on the trash (bottom-right) to delete.
                            Toolbox hides trigger/branch types once used; duplicate conditions/actions are removed automatically.
                        </div>
                    </div>

                    <template x-if="editor.mode === 'branched'">
                        <div class="space-y-4" x-show="branchedEditorMode === 'form'">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <label class="form-control">
                                    <span class="label-text text-xs">Trigger kind</span>
                                    <select class="select select-bordered select-sm" x-model="editor.triggerKind">
                                    <option value="device">Device</option>
                                    <option value="event">Event</option>
                                    </select>
                                </label>
                                <label class="form-control" x-show="editor.triggerKind === 'device'">
                                    <span class="label-text text-xs">Trigger device</span>
                                    <select class="select select-bordered select-sm" x-model="editor.triggerEntityId">
                                        <template x-for="opt in visibleEntityOptions" :key="opt.eid">
                                            <option :value="opt.eid" x-text="entityDisplayLabel(opt)"></option>
                                        </template>
                                    </select>
                                </label>
                                <label class="form-control" x-show="editor.triggerKind === 'event'">
                                    <span class="label-text text-xs">Event</span>
                                    <select class="select select-bordered select-sm" x-model="editor.triggerEventFamily">
                                        <template x-for="fam in eventFamilies" :key="fam">
                                            <option :value="fam" x-text="eventFamilyLabel(fam)"></option>
                                        </template>
                                    </select>
                                </label>
                            </div>

                            <div x-show="editor.triggerKind === 'device'" class="flex items-center gap-2 text-xs text-base-content/70">
                                <input id="showHiddenEntities" type="checkbox" class="checkbox checkbox-xs" x-model="showHiddenEntities" @change="ensureTriggerEntitySelection()">
                                <label for="showHiddenEntities">Show hidden entities</label>
                                <span class="badge badge-outline badge-xs">D1 policy active</span>
                            </div>

                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
                                <div class="card bg-base-200">
                                    <div class="card-body p-3">
                                        <label class="label cursor-pointer justify-start gap-2">
                                            <input type="checkbox" class="checkbox checkbox-sm" x-model="editor.onEnabled">
                                            <span class="label-text font-bold">ON branch</span>
                                        </label>

                                        <div x-show="editor.onEnabled" class="space-y-3">
                                            <div class="flex justify-between items-center">
                                                <span class="text-xs font-semibold">Conditions</span>
                                                <button class="btn btn-xs btn-outline" @click="addCondition('on')">Add condition</button>
                                            </div>
                                            <template x-for="(c, idx) in editor.onConditions" :key="'on-c-'+idx">
                                                <div class="p-2 rounded border border-base-300 bg-base-100 space-y-2">
                                                    <div class="flex justify-between items-center">
                                                        <span class="text-[11px] opacity-70" x-text="'Condition #' + (idx + 1)"></span>
                                                        <button class="btn btn-xs btn-ghost text-error" @click="removeCondition('on', idx)">Remove</button>
                                                    </div>
                                                    <div class="grid grid-cols-1 gap-2">
                                                        <select class="select select-bordered select-xs" x-model="c.type">
                                                            <option value="device_state">Device state</option>
                                                            <option value="time_of_day">Time of day</option>
                                                        </select>
                                                        <template x-if="c.type === 'device_state'">
                                                            <div class="grid grid-cols-1 gap-2">
                                                                <select class="select select-bordered select-xs" x-model="c.entity_id">
                                                                    <template x-for="opt in visibleEntityOptions" :key="'on-c-opt-'+opt.eid">
                                                                        <option :value="opt.eid" x-text="entityDisplayLabel(opt)"></option>
                                                                    </template>
                                                                </select>
                                                                <select class="select select-bordered select-xs" x-model="c.is">
                                                                    <option value="ON">is ON</option>
                                                                    <option value="OFF">is OFF</option>
                                                                </select>
                                                            </div>
                                                        </template>
                                                        <template x-if="c.type === 'time_of_day'">
                                                            <select class="select select-bordered select-xs" x-model="c.is">
                                                                <option value="dark">is dark</option>
                                                                <option value="light">is light</option>
                                                            </select>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>

                                            <div class="flex justify-between items-center pt-1">
                                                <span class="text-xs font-semibold">Actions</span>
                                                <button class="btn btn-xs btn-outline" @click="addAction('on', 'ON')">Add action</button>
                                            </div>
                                            <template x-for="(a, idx) in editor.onActions" :key="'on-a-'+idx">
                                                <div class="p-2 rounded border border-base-300 bg-base-100 space-y-2">
                                                    <div class="flex justify-between items-center">
                                                        <span class="text-[11px] opacity-70" x-text="'Action #' + (idx + 1)"></span>
                                                        <button class="btn btn-xs btn-ghost text-error" @click="removeAction('on', idx)">Remove</button>
                                                    </div>
                                                    <div class="grid grid-cols-1 gap-2">
                                                        <select class="select select-bordered select-xs" x-model="a.kind" @change="actionKindChanged(a)">
                                                            <option value="device">Device action</option>
                                                            <option value="event">Event action</option>
                                                        </select>
                                                        <template x-if="a.kind === 'device'">
                                                            <div class="grid grid-cols-1 gap-2">
                                                                <select class="select select-bordered select-xs" x-model="a.entity_id">
                                                                    <template x-for="opt in visibleEntityOptions" :key="'on-a-opt-'+opt.eid">
                                                                        <option :value="opt.eid" x-text="entityDisplayLabel(opt)"></option>
                                                                    </template>
                                                                </select>
                                                                <select class="select select-bordered select-xs font-mono" x-model="a.state">
                                                                    <option value="ON">ON</option>
                                                                    <option value="OFF">OFF</option>
                                                                    <option value="SYNC">SYNC</option>
                                                                    <option value="SYNCOPPOSITE">SYNCOPPOSITE</option>
                                                                    <option value="FORCE_ON">FORCE_ON</option>
                                                                    <option value="FORCE_OFF">FORCE_OFF</option>
                                                                    <option value="0">0 (blinds open)</option>
                                                                    <option value="100">100 (blinds close)</option>
                                                                </select>
                                                                <div class="grid grid-cols-2 gap-2">
                                                                    <input class="input input-bordered input-xs" placeholder="preset (optional)" x-model="a.preset">
                                                                    <input class="input input-bordered input-xs" placeholder="station (optional)" x-model="a.station">
                                                                    <input class="input input-bordered input-xs" placeholder="bri (optional)" x-model="a.bri">
                                                                    <input class="input input-bordered input-xs" placeholder="volume (optional)" x-model="a.volume">
                                                                </div>
                                                                <input class="input input-bordered input-xs font-mono" placeholder='xy JSON array (optional), e.g. [0.5,0.5]' x-model="a.xy">
                                                            </div>
                                                        </template>
                                                        <template x-if="a.kind === 'event'">
                                                            <select class="select select-bordered select-xs font-mono" x-model="a.event">
                                                                <template x-for="ev in curatedEvents" :key="'on-ev-'+ev">
                                                                    <option :value="ev" x-text="ev"></option>
                                                                </template>
                                                            </select>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                                <div class="card bg-base-200">
                                    <div class="card-body p-3">
                                        <label class="label cursor-pointer justify-start gap-2">
                                            <input type="checkbox" class="checkbox checkbox-sm" x-model="editor.offEnabled">
                                            <span class="label-text font-bold">OFF branch</span>
                                        </label>

                                        <div x-show="editor.offEnabled" class="space-y-3">
                                            <div class="flex justify-between items-center">
                                                <span class="text-xs font-semibold">Conditions</span>
                                                <button class="btn btn-xs btn-outline" @click="addCondition('off')">Add condition</button>
                                            </div>
                                            <template x-for="(c, idx) in editor.offConditions" :key="'off-c-'+idx">
                                                <div class="p-2 rounded border border-base-300 bg-base-100 space-y-2">
                                                    <div class="flex justify-between items-center">
                                                        <span class="text-[11px] opacity-70" x-text="'Condition #' + (idx + 1)"></span>
                                                        <button class="btn btn-xs btn-ghost text-error" @click="removeCondition('off', idx)">Remove</button>
                                                    </div>
                                                    <div class="grid grid-cols-1 gap-2">
                                                        <select class="select select-bordered select-xs" x-model="c.type">
                                                            <option value="device_state">Device state</option>
                                                            <option value="time_of_day">Time of day</option>
                                                        </select>
                                                        <template x-if="c.type === 'device_state'">
                                                            <div class="grid grid-cols-1 gap-2">
                                                                <select class="select select-bordered select-xs" x-model="c.entity_id">
                                                                    <template x-for="opt in visibleEntityOptions" :key="'off-c-opt-'+opt.eid">
                                                                        <option :value="opt.eid" x-text="entityDisplayLabel(opt)"></option>
                                                                    </template>
                                                                </select>
                                                                <select class="select select-bordered select-xs" x-model="c.is">
                                                                    <option value="ON">is ON</option>
                                                                    <option value="OFF">is OFF</option>
                                                                </select>
                                                            </div>
                                                        </template>
                                                        <template x-if="c.type === 'time_of_day'">
                                                            <select class="select select-bordered select-xs" x-model="c.is">
                                                                <option value="dark">is dark</option>
                                                                <option value="light">is light</option>
                                                            </select>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>

                                            <div class="flex justify-between items-center pt-1">
                                                <span class="text-xs font-semibold">Actions</span>
                                                <button class="btn btn-xs btn-outline" @click="addAction('off', 'OFF')">Add action</button>
                                            </div>
                                            <template x-for="(a, idx) in editor.offActions" :key="'off-a-'+idx">
                                                <div class="p-2 rounded border border-base-300 bg-base-100 space-y-2">
                                                    <div class="flex justify-between items-center">
                                                        <span class="text-[11px] opacity-70" x-text="'Action #' + (idx + 1)"></span>
                                                        <button class="btn btn-xs btn-ghost text-error" @click="removeAction('off', idx)">Remove</button>
                                                    </div>
                                                    <div class="grid grid-cols-1 gap-2">
                                                        <select class="select select-bordered select-xs" x-model="a.kind" @change="actionKindChanged(a)">
                                                            <option value="device">Device action</option>
                                                            <option value="event">Event action</option>
                                                        </select>
                                                        <template x-if="a.kind === 'device'">
                                                            <div class="grid grid-cols-1 gap-2">
                                                                <select class="select select-bordered select-xs" x-model="a.entity_id">
                                                                    <template x-for="opt in visibleEntityOptions" :key="'off-a-opt-'+opt.eid">
                                                                        <option :value="opt.eid" x-text="entityDisplayLabel(opt)"></option>
                                                                    </template>
                                                                </select>
                                                                <select class="select select-bordered select-xs font-mono" x-model="a.state">
                                                                    <option value="ON">ON</option>
                                                                    <option value="OFF">OFF</option>
                                                                    <option value="SYNC">SYNC</option>
                                                                    <option value="SYNCOPPOSITE">SYNCOPPOSITE</option>
                                                                    <option value="FORCE_ON">FORCE_ON</option>
                                                                    <option value="FORCE_OFF">FORCE_OFF</option>
                                                                    <option value="0">0 (blinds open)</option>
                                                                    <option value="100">100 (blinds close)</option>
                                                                </select>
                                                                <div class="grid grid-cols-2 gap-2">
                                                                    <input class="input input-bordered input-xs" placeholder="preset (optional)" x-model="a.preset">
                                                                    <input class="input input-bordered input-xs" placeholder="station (optional)" x-model="a.station">
                                                                    <input class="input input-bordered input-xs" placeholder="bri (optional)" x-model="a.bri">
                                                                    <input class="input input-bordered input-xs" placeholder="volume (optional)" x-model="a.volume">
                                                                </div>
                                                                <input class="input input-bordered input-xs font-mono" placeholder='xy JSON array (optional), e.g. [0.5,0.5]' x-model="a.xy">
                                                            </div>
                                                        </template>
                                                        <template x-if="a.kind === 'event'">
                                                            <select class="select select-bordered select-xs font-mono" x-model="a.event">
                                                                <template x-for="ev in curatedEvents" :key="'off-ev-'+ev">
                                                                    <option :value="ev" x-text="ev"></option>
                                                                </template>
                                                            </select>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            </div>
                        </div>
                    </template>

                    <template x-if="editor.mode === 'flat'">
                        <div x-show="flatEditorMode === 'json'">
                            <label class="form-control">
                                <span class="label-text text-xs">Flat rule JSON</span>
                                <textarea class="textarea textarea-bordered textarea-sm font-mono h-80" x-model="editor.flatRuleJson"></textarea>
                            </label>
                        </div>
                    </template>

                    <div class="flex gap-2 pt-2">
                        <button class="btn btn-warning btn-sm" @click="saveRule()" :disabled="busy">
                            <span x-show="!busy">Save</span>
                            <span x-show="busy" class="loading loading-spinner loading-xs"></span>
                        </button>
                        <button class="btn btn-outline btn-error btn-sm" @click="deleteRule()" :disabled="busy || !editor.id">Delete</button>
                    </div>
                </div>
            </template>
        </div>
    </section>
</main>

<script src="blocky.js?v=3.0"></script>
</body>
</html>
