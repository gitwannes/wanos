<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="WanOS" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <title>WanOS - Automation</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/blockly@13.2.1/blockly.min.js"></script>

    <style>
        /* Top-row join: tablets+ (≥768). Below: hamburger (Explorer + WISC only). */
        #pc-nav-menu { display: none; }
        #mobile-nav-menu { display: inline-flex; }
        @media (min-width: 768px) {
            #pc-nav-menu { display: flex; }
            #mobile-nav-menu { display: none !important; }
        }
        #pc-nav-menu .join > .join-item.nav-mid {
            border-left-color: var(--fallback-b3, oklch(var(--b3))) !important;
            border-right-color: var(--fallback-b3, oklch(var(--b3))) !important;
        }
        #pc-nav-menu .join > .join-item.nav-end {
            border-left-color: var(--fallback-b3, oklch(var(--b3))) !important;
        }
        [x-cloak] { display: none !important; }
        /* Same constraints as helpers/blockly_minimal_test.html.
           Do NOT force .blocklySvg width/height — Blockly owns those pixels.
           Do NOT put Blockly on Alpine reactive state (Proxy breaks drag/snap). */
        #blocklyWorkspace {
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 520px;
        }
        #blocklyWorkspace.blockly-fs {
            height: calc(100vh - 5.5rem);
        }
        #blocklyWorkspace .injectionDiv {
            position: absolute;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
        }
        #blocklyWorkspace svg,
        .blocklySvg,
        .blocklyWidgetDiv svg,
        .blocklyDropDownDiv svg {
            max-width: none !important;
            max-height: none !important;
        }
        .blocklyScrollbarVertical,
        .blocklyScrollbarHorizontal {
            opacity: 0.55;
        }
        .blocklyWidgetDiv, .blocklyDropDownDiv, .blocklyTooltipDiv { z-index: 100000 !important; }
        .blocklyToolboxDiv { z-index: 20; }
        #blocklyPanel.is-parked {
            position: fixed !important;
            left: -10000px !important;
            top: 0 !important;
            width: 900px !important;
            opacity: 0 !important;
            pointer-events: none !important;
            z-index: -1 !important;
        }
    </style>
</head>
<body class="bg-base-300 min-h-screen text-base-content" x-data="blockyApp()" x-init="init()">

<div x-show="!connected" x-cloak
     class="fixed inset-0 z-[9999] bg-base-300/95 backdrop-blur-md flex flex-col items-center justify-center text-center px-6 transition-opacity duration-300">
    <span class="loading loading-infinity w-16 text-warning mb-4"></span>
    <h2 class="text-2xl font-black tracking-widest text-base-content">NOT CONNECTED</h2>
    <p class="text-warning mt-2 font-mono text-sm">Loading automation editor...</p>
</div>

<header class="navbar bg-base-100 shadow-md px-3 md:px-6 mb-6 flex-nowrap gap-2 items-center min-h-[3rem] relative z-[60]">
    <div class="flex-1 flex items-center gap-2 min-w-0">
        <div class="flex flex-col min-w-0 justify-center">
            <span class="text-xs sm:text-sm md:text-xl font-black tracking-wider text-warning truncate">⚡ WanOS // Automation</span>
        </div>
    </div>

    <div id="pc-nav-menu" class="justify-center flex-1 min-w-0">
        <div class="join bg-base-200 border border-base-300">
            <a href="/deviceexplorer.html" class="btn btn-sm join-item font-mono tracking-widest text-base-content/70 hover:text-primary" @click="navAway($event, '/deviceexplorer.html')">Explorer</a>
            <a href="/commander.html" class="btn btn-sm join-item font-mono tracking-widest text-base-content/70 hover:text-secondary" @click="navAway($event, '/commander.html')">WISC</a>
            <a href="/sensorhistory.html" class="btn btn-sm join-item font-mono tracking-widest text-base-content/70 hover:text-accent" @click="navAway($event, '/sensorhistory.html')">History</a>
            <a href="/blocky.html" class="btn btn-sm join-item font-mono font-bold tracking-widest text-warning border-warning bg-warning/10 nav-end">Automation</a>
        </div>
    </div>

    <div class="flex-none flex items-center gap-2">
        <button class="btn btn-ghost btn-xs text-base-content/50 hover:text-warning" @click="refreshAll()" :disabled="busy" title="Refresh">
            <span x-show="!busy" class="font-mono text-[10px] tracking-wider">Refresh</span>
            <span x-show="busy" class="loading loading-spinner loading-xs"></span>
        </button>
        <div id="mobile-nav-menu" class="dropdown dropdown-end">
            <div tabindex="0" role="button" class="btn btn-ghost btn-xs text-base-content/70">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
            </div>
            <ul tabindex="0" class="dropdown-content z-50 menu p-2 shadow bg-base-200 rounded-box w-52 border border-base-300 mt-4">
                <li><a href="/deviceexplorer.html" @click="navAway($event, '/deviceexplorer.html')">Device Explorer</a></li>
                <li><a href="/commander.html" @click="navAway($event, '/commander.html')">WISC</a></li>
            </ul>
        </div>
        <a href="/admin.html" class="btn btn-ghost btn-xs text-base-content/30 hover:text-primary mr-1" title="Return to Admin" @click="navAway($event, '/admin.html')">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
        </a>
        <button @click="editorDirty ? requestLeave({ type: 'logout' }) : logout()" class="btn btn-ghost btn-xs text-base-content/30 hover:text-error" title="Logout">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
        </button>
    </div>
</header>

<main class="max-w-7xl mx-auto px-3 md:px-6 grid grid-cols-1 xl:grid-cols-3 gap-6 pb-10">
    <section class="xl:col-span-1 card bg-base-100 border border-base-200 shadow-xl">
        <div class="card-body p-4">
            <div class="flex justify-between items-center mb-3">
                <h2 class="card-title text-sm uppercase tracking-wider">Automations</h2>
                <button class="btn btn-xs btn-warning" @click="newRule()">New</button>
            </div>
            <input type="text" class="input input-bordered input-sm mb-3 font-mono" placeholder="Filter by name" x-model="filterText">
            <div class="max-h-[70vh] overflow-y-auto pr-1 flex flex-col gap-1 items-stretch w-full">
                <template x-for="rule in filteredRules" :key="rule.id || rule.name">
                    <button class="w-full btn btn-sm justify-start text-left normal-case gap-2 px-2"
                            :class="(selectedRule && !selectedRule.isDraft && selectedRule.id === rule.id) ? 'btn-warning' : (selectedRule && selectedRule.isDraft ? '' : 'btn-ghost')"
                            @click="selectRule(rule)">
                        <span x-show="ruleListKind(rule)" class="badge badge-xs shrink-0" :class="ruleListBadgeClass(rule)" x-text="ruleListKind(rule)"></span>
                        <span class="truncate flex-1 text-left" x-text="rule.name || '(unnamed)'"></span>
                    </button>
                </template>
            </div>
        </div>
    </section>

    <section class="xl:col-span-2 card bg-base-100 border border-base-200 shadow-xl">
        <div class="card-body p-4">
            <div x-show="errorMessage" class="alert alert-error text-sm mb-3">
                <span x-text="errorMessage"></span>
            </div>
            <div x-show="infoMessage" class="alert alert-success text-sm mb-3">
                <span x-text="infoMessage"></span>
            </div>
            <div x-show="registryCheckMessage" class="alert text-sm mb-3"
                 :class="registryCheckOk === false ? 'alert-error' : (registryCheckOk === true ? 'alert-success' : 'alert-info')">
                <span x-text="registryCheckMessage"></span>
            </div>

            <template x-if="!selectedRule">
                <div class="text-base-content/60 text-sm">Select a rule from the list, or click <b>New</b> to create one.</div>
            </template>

            <template x-if="selectedRule">
                <div class="space-y-4">
                    <div x-show="selectedRule.isDraft" class="text-xs text-warning font-semibold">New rule — pick trigger + cases in Blockly, name it, then Save.</div>
                    <div x-show="editorDirty" class="text-xs text-warning font-mono">Unsaved changes</div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <label class="form-control">
                            <span class="label-text text-xs">Name</span>
                            <input class="input input-bordered input-sm" x-model="editor.name">
                        </label>
                        <label class="form-control">
                            <span class="label-text text-xs">Editor</span>
                            <select class="select select-bordered select-sm" x-model="editorMode" @change="onEditorModeChanged()">
                                <option value="blockly">Blockly (primary)</option>
                                <option value="json">JSON (power-user)</option>
                            </select>
                        </label>
                    </div>

                    <div class="flex flex-col gap-1">
                        <div class="flex flex-wrap gap-4 items-center">
                            <template x-if="canShowOnDashboard">
                                <div class="flex flex-wrap gap-4 items-center">
                                    <label class="label cursor-pointer gap-2">
                                        <span class="label-text text-xs">Show on dashboard</span>
                                        <input type="checkbox" class="checkbox checkbox-sm" x-model="editor.scene">
                                    </label>
                                    <label class="label cursor-pointer gap-2">
                                        <span class="label-text text-xs">Require confirmation</span>
                                        <input type="checkbox" class="checkbox checkbox-sm" x-model="editor.require_confirmation">
                                    </label>
                                </div>
                            </template>
                            <label class="label cursor-pointer gap-2">
                                <span class="label-text text-xs">Show Explorer-hidden devices</span>
                                <input type="checkbox" class="checkbox checkbox-sm" x-model="showHiddenEntities">
                            </label>
                        </div>
                        <p class="text-[11px] text-base-content/50 max-w-xl" x-show="canShowOnDashboard">
                            Dashboard = kiosk scene button (event-triggered rules only). Confirmation = mis-click modal for that button.
                        </p>
                        <p class="text-[11px] text-base-content/50 max-w-xl">
                            Trigger wakes the rule; cases are ordered if / else-if / else.
                            Match options follow the trigger (device ON/OFF or blinds OPEN/CLOSED; start or end; event/OR = conditions gate).
                            Action/condition states follow device type. Speakers show as Sonos/Onkyo. OR edges only when root is “When any of”.
                            Rich fields (preset, volume, …) round-trip; authoring UX is Phase 6C.
                        </p>
                    </div>

                    <div class="flex flex-wrap items-center gap-3 p-2 rounded border border-base-300 bg-base-200" x-show="editorMode === 'blockly'">
                        <button class="btn btn-xs btn-outline" @click="requestLeave({ type: 'reload' })">Reload canvas</button>
                        <button class="btn btn-xs btn-outline" @click="toggleBlocklyFullscreen()" x-text="blocklyFullscreen ? 'Exit full screen' : 'Full screen'"></button>
                    </div>

                    <div id="blocklyPanel"
                         class="space-y-2"
                         x-effect="showBlocklyWorkspace; blocklyFullscreen; queueMicrotask(() => resizeBlockly())"
                         :class="{
                             'is-parked': !showBlocklyWorkspace,
                             'fixed inset-0 z-[200] bg-base-300 p-4 flex flex-col': blocklyFullscreen && showBlocklyWorkspace
                         }">
                        <div x-show="blocklyFullscreen && showBlocklyWorkspace" class="flex flex-wrap items-center justify-between gap-2 mb-2">
                            <div>
                                <div class="font-bold text-warning uppercase tracking-wider text-sm">Blocky · full screen</div>
                                <div class="text-sm font-semibold mt-1" x-text="editor.name || '(unnamed rule)'"></div>
                            </div>
                            <div class="flex gap-2">
                                <button class="btn btn-sm btn-outline" @click="toggleBlocklyFullscreen()">Exit full screen</button>
                                <button class="btn btn-sm btn-warning" @click="saveRule()" :disabled="busy">Save</button>
                            </div>
                        </div>
                        <div id="blocklyWorkspace"
                             class="w-full rounded border border-base-300 bg-base-100"
                             :class="blocklyFullscreen && showBlocklyWorkspace ? 'blockly-fs' : ''"></div>
                        <div class="text-[11px] text-base-content/60" x-show="showBlocklyWorkspace && !blocklyFullscreen">
                            Trigger → chain of <b>if</b> cases → actions.
                            To change trigger type, drag another from <b>Trigger</b> (cases stay attached).
                            When start or end: paired edges (clock for blinds/twilight; session on/off for sauna/IR/cinema).
                            Snap blocks fully into notches · unsnapped leaves block Save · trash deletes.
                        </div>
                    </div>

                    <div x-show="editorMode === 'json'">
                        <label class="form-control">
                            <span class="label-text text-xs">Rule JSON (schema v2)</span>
                            <textarea class="textarea textarea-bordered textarea-sm font-mono h-80" x-model="editor.ruleJson"></textarea>
                        </label>
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button class="btn btn-warning btn-sm" @click="saveRule()" :disabled="busy">
                            <span x-show="!busy">Save</span>
                            <span x-show="busy" class="loading loading-spinner loading-xs"></span>
                        </button>
                        <button class="btn btn-outline btn-error btn-sm" @click="deleteRule()" :disabled="busy || !editor.id">Delete</button>
                    </div>
                </div>
            </template>
        </div>
    </section>
</main>

<dialog id="unsaved_rule_modal" class="modal modal-bottom sm:modal-middle backdrop-blur-sm z-[9999]">
    <div class="modal-box border border-warning/40 bg-base-300 shadow-2xl">
        <h3 class="font-bold text-lg text-warning tracking-wide">Unsaved changes</h3>
        <p class="py-3 text-sm text-base-content/80">
            This rule has edits that are not saved. Leave and discard them, or save first?
        </p>
        <div class="modal-action flex-wrap gap-2">
            <button type="button" class="btn btn-ghost btn-sm" @click="cancelUnsavedLeave()">Cancel</button>
            <button type="button" class="btn btn-outline btn-error btn-sm" @click="discardUnsavedLeave()">Discard</button>
            <button type="button" class="btn btn-warning btn-sm" @click="saveUnsavedLeave()" :disabled="busy">
                <span x-show="!busy">Save</span>
                <span x-show="busy" class="loading loading-spinner loading-xs"></span>
            </button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button type="button" @click="cancelUnsavedLeave()">close</button></form>
</dialog>

<script src="blocky.js?v=4.14"></script>
</body>
</html>
