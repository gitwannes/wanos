<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="WanOS" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="manifest" href="/favicon/site.webmanifest" />

    <title>WanOS // Admin - Z-Wave</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="/wanos.css?v=1" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="bg-base-300 min-h-screen text-base-content" x-data="zwaveApp()" x-init="init()">

    <div data-wanos-offline data-tone="error"></div>
    <div data-wanos-nav="zwave"></div>

    <main class="flex flex-col gap-6 max-w-7xl mx-auto px-3 md:px-6 pb-10">

        <div x-show="errorMessage" x-transition class="alert alert-error font-bold font-mono text-sm shadow-md border-red-500 py-3" x-cloak>
            <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            <span x-text="errorMessage"></span>
        </div>
        <div x-show="infoMessage" class="alert alert-success text-sm" x-cloak>
            <span x-text="infoMessage"></span>
        </div>

        <div class="bg-base-100 shadow-xl border border-base-200 rounded-box p-3">
            <div class="flex flex-col gap-3 w-full">
                <div class="flex flex-col md:flex-row gap-3 items-center w-full">
                    <div class="form-control flex-1 w-full">
                        <label class="input input-sm input-bordered flex items-center gap-2 bg-base-200 focus-within:outline-none focus-within:border-primary w-full">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="w-4 h-4 opacity-70"><path fill-rule="evenodd" d="M9.965 11.026a5 5 0 1 1 1.06-1.06l2.755 2.754a.75.75 0 1 1-1.06 1.06l-2.755-2.754ZM10.5 7a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Z" clip-rule="evenodd" /></svg>
                            <input type="text" class="grow font-mono text-xs w-full" placeholder="Search nodes, paths or IDXs..." x-model="searchQuery" />
                        </label>
                    </div>
                    <select class="select select-bordered select-sm w-full md:w-auto font-mono text-xs bg-base-200" x-model="typeFilter">
                        <option value="ALL">All Types</option>
                        <option value="switch">Switch</option>
                        <option value="shutter">Shutter</option>
                        <option value="power">Power</option>
                        <option value="motion">Motion</option>
                        <option value="temp&hum">Temp & Hum</option>
                    </select>

                    <select class="select select-bordered select-sm w-full md:w-auto font-mono text-xs bg-base-200" x-model="sortMode">
                        <option value="NODE">Sort by Node/Path</option>
                        <option value="IDX">Sort by IDX</option>
                        <option value="NAME">Sort by Name</option>
                    </select>
                </div>

                <div class="flex flex-wrap gap-2 items-center">
                    <button type="button" class="btn btn-primary btn-sm ml-auto font-bold tracking-wider"
                            @click="saveAndReloadConfig()" :disabled="configReloading || !dirty">
                        <span x-show="!configReloading">Save &amp; reload config</span>
                        <span x-show="configReloading" class="loading loading-spinner loading-xs"></span>
                    </button>
                </div>
            </div>
        </div>

        <section class="card bg-base-100 shadow-xl border border-base-200">
            <div class="card-body p-4">
                <div class="overflow-x-auto">
                    <table class="table table-sm">
                        <thead>
                            <tr class="text-base-400 font-mono text-[10px] uppercase tracking-wider">
                                <th>Add</th>
                                <th>Node</th>
                                <th class="cursor-pointer select-none hover:text-base-content"
                                    @click="toggleSort('TYPE')">
                                    <span x-text="'Type' + sortIndicator('TYPE')"></span>
                                </th>
                                <th class="cursor-pointer select-none hover:text-base-content"
                                    @click="toggleSort('PATH')">
                                    <span x-text="'MQTT Path' + sortIndicator('PATH')"></span>
                                </th>
                                <th>Latest Value</th>
                                <th>IDX</th>
                                <th class="cursor-pointer select-none hover:text-base-content"
                                    @click="toggleSort('NAME')">
                                    <span x-text="'Name' + sortIndicator('NAME')"></span>
                                </th>
                                <th>Comment</th>
                            </tr>
                        </thead>
                        <tbody class="font-mono text-xs">
                            <template x-for="item in visibleDeviceList" :key="item.path">
                                <tr class="hover:bg-base-200/50 transition-colors"
                                    :class="isRowDirty(item)
                                        ? 'bg-warning/10'
                                        : (item.selected ? (item.is_mapped ? 'bg-base-200/30' : 'bg-primary/10') : 'opacity-50')"
                                    :title="isRowDirty(item) ? 'Unsaved change' : ''">
                                    <td>
                                        <input type="checkbox" class="checkbox checkbox-sm"
                                               :class="isAddDirty(item) ? 'checkbox-warning' : 'checkbox-primary'"
                                               x-model="item.selected" @change="recalculateIDXs()">
                                    </td>
                                    <td class="font-bold text-base-content/70" x-text="item.node"></td>

                                    <td>
                                        <template x-if="item.is_mapped">
                                            <span class="uppercase text-[10px] font-bold tracking-wider"
                                                  :class="isBinaryIdx(item.idx) ? 'text-accent' : (item.type === 'power' ? 'text-warning' : (item.type === 'shutter' ? 'text-info' : (item.type === 'motion' ? 'text-error' : (item.type === 'temp&hum' ? 'text-success' : 'text-accent opacity-70'))))"
                                                  x-text="mappedTypeLabel(item)"></span>
                                        </template>
                                        <template x-if="!item.is_mapped">
                                            <select class="select select-bordered select-xs font-mono uppercase text-[9px]"
                                                    :class="isTypeDirty(item)
                                                        ? 'bg-warning/20 border-warning text-warning font-bold'
                                                        : 'bg-base-200'"
                                                    x-model="item.type" @change="recalculateIDXs()" :disabled="!item.selected">
                                                <option value="switch">Binary (71–72x)</option>
                                                <option value="shutter">Shutter (73x)</option>
                                                <option value="power">Power (74x)</option>
                                                <option value="motion">Motion (75x)</option>
                                                <option value="temp&hum">Temp&Hum (76x)</option>
                                            </select>
                                        </template>
                                    </td>

                                    <td x-text="item.path" :class="item.selected ? 'text-primary font-bold' : ''"></td>

                                    <td class="text-warning font-bold" x-text="item.value"></td>

                                    <td class="font-bold text-accent">
                                        <span x-show="item.selected" x-text="item.idx"></span>
                                        <span x-show="!item.selected" class="text-base-content/30">--</span>
                                    </td>

                                    <td>
                                        <input type="text" class="input input-bordered input-xs w-48 font-mono"
                                               placeholder="Required..." x-model="item.name" :disabled="!item.selected"
                                               :class="(item.selected && item.name.trim() === '')
                                                   ? 'border-error'
                                                   : (isNameDirty(item)
                                                       ? 'bg-warning/20 border-warning text-warning'
                                                       : 'bg-base-200')">
                                    </td>

                                    <td>
                                        <input type="text" class="input input-bordered input-xs w-20 font-mono"
                                               placeholder="..." x-model="item.comment_str" :disabled="!item.selected"
                                               :class="isCommentDirty(item)
                                                   ? 'bg-warning/20 border-warning'
                                                   : 'bg-base-200'">
                                    </td>
                                </tr>
                            </template>
                            <tr x-show="visibleDeviceList.length === 0">
                                <td colspan="8" class="text-center text-base-content/50 py-8 italic">
                                    <span class="loading loading-dots loading-sm block mx-auto mb-2 text-primary"></span>
                                    Synchronizing configuration matrices and listening for network telemetry updates...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <dialog id="unsaved_changes_modal" class="modal modal-bottom sm:modal-middle backdrop-blur-sm z-[9999]">
        <div class="modal-box border border-warning/40 bg-base-300 shadow-2xl">
            <h3 class="font-bold text-lg text-warning tracking-wide">Unsaved changes</h3>
            <p class="py-3 text-sm text-base-content/80">
                Z-Wave map edits are not saved. Leave and discard them, or save first?
            </p>
            <div class="modal-action flex-wrap gap-2">
                <button type="button" class="btn btn-ghost btn-sm" @click="cancelUnsavedLeave()">Cancel</button>
                <button type="button" class="btn btn-outline btn-error btn-sm" @click="discardUnsavedLeave()">Discard</button>
                <button type="button" class="btn btn-warning btn-sm" @click="saveUnsavedLeave()" :disabled="configReloading">
                    <span x-show="!configReloading">Save</span>
                    <span x-show="configReloading" class="loading loading-spinner loading-xs"></span>
                </button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button type="button" @click="cancelUnsavedLeave()">close</button></form>
    </dialog>

    <script src="/wanos-shell.js?v=13"></script>
    <script src="/zwave.js?v=9"></script>

</body>
</html>
