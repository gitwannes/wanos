<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="WanOS" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="manifest" href="/favicon/site.webmanifest" />

    <title>WanOS Device Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="/wanos.css?v=1" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <!--
    https://iro.js.org/
    CDN: <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
    Get js from web: https://raw.githubusercontent.com/jaames/iro.js/master/dist/iro.min.js
    -->
    <script src="iro.min.js"></script>
    <style>
        .hist-chart { width: 100%; height: 280px; }
        @media (min-width: 768px) {
            .hist-chart { height: 320px; }
        }
        /* C5: landscape phone + chart open → collapse sticky filter detail so chart owns the screen */
        /* C7: also hide Control|History picker and the collapsed-filters hint */
        /* C7: landscape phone — filters must scroll away (not sticky); not enough vertical room */
        @media (orientation: landscape) and (max-height: 500px) {
            [data-explorer-sticky-filters] {
                position: static !important;
                top: auto !important;
                z-index: auto !important;
            }
            [data-explorer-sticky-filters].explorer-chart-open .explorer-filter-detail {
                display: none !important;
            }
            [data-explorer-sticky-filters].explorer-chart-open .explorer-mode-join,
            [data-explorer-sticky-filters].explorer-chart-open .explorer-filter-compact-hint {
                display: none !important;
            }
            [data-explorer-sticky-filters].explorer-chart-open {
                padding-top: 0.35rem;
                padding-bottom: 0.35rem;
                gap: 0.25rem;
            }
        }
        /* C7: presets pane — two rows + compact labels only on smartphone portrait.
           PC / landscape keep a single row (chips left, controls + pencil right). */
        .explorer-presets-pencil-portrait { display: none; }
        .explorer-presets-pencil-wide { display: inline-flex; }
        @media (max-width: 640px) and (orientation: portrait) {
            .explorer-presets-pane {
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 0.35rem !important;
            }
            .explorer-presets-pane > .explorer-presets-chips-block {
                width: 100%;
            }
            .explorer-presets-chip-row {
                width: 100%;
            }
            .explorer-presets-pencil-portrait { display: inline-flex !important; }
            .explorer-presets-pencil-wide { display: none !important; }
            .explorer-presets-controls {
                flex-wrap: nowrap !important;
                gap: 0.25rem !important;
                width: 100%;
            }
            .explorer-presets-controls .label-text,
            .explorer-presets-controls .btn {
                font-size: 8px !important;
                letter-spacing: 0.02em !important;
                line-height: 1.1 !important;
            }
            .explorer-presets-controls .label {
                gap: 0.2rem !important;
                padding-left: 0 !important;
                padding-right: 0 !important;
            }
            .explorer-presets-controls .toggle {
                transform: scale(0.85);
                transform-origin: center left;
            }
            .explorer-presets-controls .btn {
                min-height: 1.5rem !important;
                height: 1.5rem !important;
                padding-left: 0.2rem !important;
                padding-right: 0.2rem !important;
            }
        }
        .explorer-filter-compact-hint { display: none; }
    </style>
</head>
<body class="bg-base-300 min-h-screen text-base-content" x-data="wanosApp()" x-init="initDeviceExplorerPage()">

    <div data-wanos-offline data-tone="error"></div>
    <div data-wanos-nav="explorer"></div>

    <main class="container mx-auto px-2 md:px-4 max-w-[70rem] pb-10 flex flex-col gap-4 md:gap-6">

        <div x-show="disabledIntegrationsText !== ''" x-cloak class="bg-warning/20 border border-warning/50 text-warning shadow-md py-2 px-3 md:px-4 rounded-box text-[10px] md:text-xs font-mono font-bold flex justify-center w-full text-center">
            <span x-text="disabledIntegrationsText"></span>
        </div>

        <!-- C7: PC/landscape = one row. Smartphone portrait = two rows (chips+pencil / controls), compact labels -->
        <div class="explorer-presets-pane flex flex-row items-start justify-between gap-2 bg-base-100 shadow-md border border-base-200 rounded-box py-1.5 px-3">
            <div class="explorer-presets-chips-block flex items-center gap-2 sm:gap-3 min-w-0">
                <button class="btn btn-xs btn-circle btn-ghost text-error/70 hover:text-error hover:bg-error/20 border border-error/10 shrink-0"
                        title="Clear all filters"
                        @click="clearAllFilters()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>

                <div class="flex flex-col gap-0.5 min-w-0 flex-1">
                    <div class="explorer-presets-chip-row flex items-center gap-1.5 sm:gap-2">
                        <template x-for="(preset, index) in presets" :key="index">
                            <button class="w-7 h-7 md:w-8 md:h-8 rounded-full flex items-center justify-center font-bold font-mono text-[11px] md:text-sm transition-colors duration-200 border border-base-content/20 shrink-0"
                                    :class="preset !== null ? 'bg-primary text-primary-content border-primary shadow-md' : 'bg-transparent text-base-content/40 hover:border-primary/50'"
                                    :title="preset !== null ? getPresetSummary(index, true) : ''"
                                    @click="handlePresetClick(index)">
                                <span x-text="index + 1"></span>
                            </button>
                        </template>
                        <!-- Portrait only: pencil on same line as chips -->
                        <button type="button"
                                class="explorer-presets-pencil-portrait btn btn-sm btn-ghost text-lg hover:bg-base-200 shrink-0 px-1 ml-auto"
                                title="Manage Presets"
                                @click="document.getElementById('preset_edit_modal').showModal()">
                            ✏️
                        </button>
                    </div>
                    <div class="text-[9px] md:text-[10px] font-mono text-base-content/55 truncate leading-tight pl-0.5"
                         x-show="appliedPresetIndex !== null && presets[appliedPresetIndex]"
                         x-cloak
                         x-text="getPresetSummary(appliedPresetIndex, true)"></div>
                </div>
            </div>

            <div class="explorer-presets-controls flex items-center gap-2 md:gap-3 shrink-0 pt-0.5">
                <label class="label cursor-pointer gap-1.5 py-0 flex-row items-center shrink-0"
                       x-show="actuatorFavorites.length > 0" x-cloak>
                    <span class="label-text font-mono text-[10px] tracking-wide whitespace-nowrap">Show Favorites</span>
                    <input type="checkbox" class="toggle toggle-sm toggle-accent shrink-0"
                           :checked="actuatorFavoritesOnly"
                           @change="actuatorFavoritesOnly = $event.target.checked" />
                </label>
                <button type="button" class="btn btn-xs btn-ghost font-mono text-[10px] tracking-wide px-1.5 shrink-0"
                        :class="favoritesEditMode ? 'text-accent' : 'text-base-content/50'"
                        :title="favoritesEditMode ? 'Done editing favorites' : 'Edit favorites'"
                        @click="toggleFavoritesEditMode()">
                    <span x-text="favoritesEditMode ? 'Done' : 'Edit'"></span>
                </button>
                <label class="label cursor-pointer gap-1.5 py-0 flex-row items-center shrink-0" x-show="isAdmin" x-cloak>
                    <span class="label-text font-mono text-[10px] tracking-wide whitespace-nowrap">Hidden devices</span>
                    <input type="checkbox" class="toggle toggle-sm toggle-error shadow shrink-0" x-model="showHiddenNodes" />
                </label>
                <!-- PC / landscape: pencil with controls (original single-row placement) -->
                <button type="button"
                        class="explorer-presets-pencil-wide btn btn-sm btn-ghost text-lg hover:bg-base-200 shrink-0"
                        title="Manage Presets"
                        @click="document.getElementById('preset_edit_modal').showModal()">
                    ✏️
                </button>
            </div>
        </div>

        <div class="bg-base-100 shadow-xl border border-base-200 rounded-box sticky top-2 z-50 p-2 md:p-3 flex flex-col gap-2 md:gap-3"
             data-explorer-sticky-filters
             :class="historyChartOpen ? 'explorer-chart-open' : ''">
            <div class="join self-start border border-base-300 explorer-mode-join">
                <button type="button" class="btn btn-sm join-item font-mono tracking-widest"
                        :class="explorerMode === 'control' ? 'btn-primary' : 'btn-ghost'"
                        @click="setExplorerMode('control')">Control</button>
                <button type="button" class="btn btn-sm join-item font-mono tracking-widest"
                        :class="explorerMode === 'history' ? 'btn-accent' : 'btn-ghost'"
                        @click="setExplorerMode('history')">History</button>
            </div>
            <div class="explorer-filter-compact-hint text-[9px] font-mono text-base-content/50 pl-0.5">
                Filters collapsed · rotate or close chart to edit
            </div>

            <div class="explorer-filter-detail grid grid-cols-2 md:flex md:flex-row gap-2 md:gap-3 items-center w-full">

                <div class="form-control col-span-2 md:col-auto md:flex-1 w-full">
                    <label class="input input-sm input-bordered flex items-center gap-2 bg-base-200 focus-within:outline-none focus-within:border-primary w-full">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="w-3 h-3 md:w-4 md:h-4 opacity-70"><path fill-rule="evenodd" d="M9.965 11.026a5 5 0 1 1 1.06-1.06l2.755 2.754a.75.75 0 1 1-1.06 1.06l-2.755-2.754ZM10.5 7a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Z" clip-rule="evenodd" /></svg>
                        <input type="text" class="grow font-mono text-[10px] md:text-xs w-full"
                               placeholder='Search… e.g. "hue slpk -wannes"'
                               x-model="searchQuery" />
                    </label>
                </div>

                <select class="select select-bordered select-sm col-span-1 md:w-auto min-w-[110px] font-mono text-[10px] md:text-xs w-full px-2 transition-colors duration-200"
                        :class="typeFilter !== 'ALL' ? 'bg-primary/20 border-primary text-primary font-bold' : 'bg-base-200'"
                        x-model="typeFilter">
                    <option value="ALL" class="text-base-content bg-base-200 font-normal">Alles</option>
                    <option value="SWITCH" class="text-base-content bg-base-200 font-normal">Switches</option>
                    <option value="LIGHT" class="text-base-content bg-base-200 font-normal">Lights</option>
                    <option value="HUE" class="text-base-content bg-base-200 font-normal">Hue</option>
                    <option value="SHUTTER" class="text-base-content bg-base-200 font-normal">Rolluiken</option>
                    <option value="SPEAKER" class="text-base-content bg-base-200 font-normal">Audio</option>
                    <option value="SENSOR" class="text-base-content bg-base-200 font-normal">Sensors</option>
                    <option value="SCENE" class="text-base-content bg-base-200 font-normal">Scenes</option>
                </select>

                <select class="select select-bordered select-sm col-span-1 md:w-auto min-w-[110px] font-mono text-[10px] md:text-xs w-full px-2 transition-colors duration-200"
                        :class="statusFilter !== 'ALL' ? 'bg-primary/20 border-primary text-primary font-bold' : 'bg-base-200'"
                        x-model="statusFilter">
                    <option value="ALL" class="text-base-content bg-base-200 font-normal">All States</option>
                    <option value="ON" class="text-base-content bg-base-200 font-normal">ON / Closed</option>
                    <option value="OFF" class="text-base-content bg-base-200 font-normal">OFF / Open</option>
                </select>

                <select class="select select-bordered select-sm col-span-2 md:col-auto md:w-auto min-w-[120px] font-mono text-[10px] md:text-xs bg-base-200 w-full px-2" x-model="sortMode">
                    <option value="TYPE">Sort by Type</option>
                    <option value="NAME">Sort by Name</option>
                    <option value="STATUS">Sort by Status</option>
                </select>
            </div>
            <div class="explorer-filter-detail text-[9px] md:text-[10px] font-mono text-base-content/50 leading-none pl-0.5"
                 x-text="'listing ' + explorerActiveList.length + ' device' + (explorerActiveList.length === 1 ? '' : 's')"></div>
        </div>

        <!-- SHARED CONTROL / HISTORY LIST -->
        <div class="card bg-base-100 shadow-xl border border-base-200 overflow-hidden"
             x-show="explorerMode === 'control' || explorerMode === 'history'" x-cloak>
            <ul class="flex flex-col w-full divide-y divide-base-200/50">
                <template x-for="item in explorerActiveList" :key="explorerMode + '-' + item.id">
                    <li class="flex flex-col w-full"
                        :id="'explorer-row-' + item.id"
                        :class="(explorerMode === 'history' && isExplorerHistoryRowSelected(item)) ? 'bg-accent/5' : ''">
                        <div class="grid items-center py-4 px-3 md:py-5 md:px-4 hover:bg-base-200/50 transition-colors gap-x-1 md:gap-x-6 w-full"
                             :class="[
                                 favoritesEditMode ? 'grid-cols-[auto_minmax(0,1fr)_auto]' : 'grid-cols-[minmax(0,1fr)_auto]',
                                 item.is_dead ? 'opacity-50 grayscale' : '',
                                 (explorerMode === 'history' && deviceHasHistory(item.id)) ? 'cursor-pointer' : ''
                             ]"
                             @click="explorerMode === 'history' && selectExplorerHistoryItem(item)">

                            <!-- C1: selection UI only while Edit favorites is active -->
                            <div class="pr-1" @click.stop x-show="favoritesEditMode" x-cloak>
                                <input type="checkbox" class="checkbox checkbox-xs checkbox-accent"
                                       :checked="isActuatorFavorite(item.id)"
                                       @change="toggleActuatorFavorite(item.id)"
                                       title="Favorite" />
                            </div>

                            <div class="min-w-0 flex flex-col justify-center pr-1 md:pr-2">
                                <template x-if="item.is_hue">
                                    <div class="flex items-center gap-1.5 min-w-0 flex-1"
                                         :class="explorerMode === 'control' ? 'cursor-pointer hover:text-primary transition-colors' : ''"
                                         @click="if (explorerMode === 'control') { $event.stopPropagation(); openLightModal(item); }">
                                        <div class="w-5 h-5 shrink-0 flex items-center justify-center">
                                            <div class="w-4 h-4 rounded-full border border-base-content/20"
                                                 :style="explorerHueSwatchStyle(item)"></div>
                                        </div>
                                        <div class="font-bold text-[12px] md:text-sm tracking-wide text-base-content truncate"
                                             :class="explorerMode === 'control' ? 'underline decoration-dashed underline-offset-4 decoration-base-content/30' : ''"
                                             x-text="item.name"></div>
                                        <span class="shrink-0 text-error text-[10px] font-mono font-bold"
                                              x-show="explorerMode === 'history' && !deviceHasHistory(item.id)">(no history)</span>
                                    </div>
                                </template>
                                <template x-if="!item.is_hue">
                                    <div class="flex items-center gap-1.5 min-w-0 flex-1"
                                         :class="(explorerMode === 'control' && (item.type === 'blinds' || item.type === 'speaker') && !item.is_dead && item.raw_value !== null) ? 'cursor-pointer hover:text-primary transition-colors' : ''"
                                         @click="if (explorerMode === 'control') { $event.stopPropagation(); if (item.type === 'blinds') handleShutterNameClick(item); if (item.type === 'speaker') handleSpeakerNameClick(item); }">
                                        <div class="w-5 h-5 shrink-0 flex items-center justify-center">
                                            <span class="text-sm leading-none" x-show="explorerItemIcon(item)" x-text="explorerItemIcon(item)"></span>
                                        </div>
                                        <div class="font-bold text-[12px] md:text-sm tracking-wide text-base-content truncate"
                                             x-text="item.name"></div>
                                        <span class="shrink-0 text-error text-[10px] font-mono font-bold"
                                              x-show="explorerMode === 'history' && !deviceHasHistory(item.id)">(no history)</span>
                                    </div>
                                </template>

                                <template x-if="explorerMode === 'control' && isAdmin && item.auto_off_countdown">
                                    <span class="inline-flex text-[10px] font-mono font-bold text-error/80 mt-0.5 select-none tracking-wider uppercase"
                                          x-text="'auto off in ' + item.auto_off_countdown"></span>
                                </template>
                            </div>

                            <div class="justify-self-end flex items-center justify-end min-w-max">

                                <template x-if="explorerMode === 'control'">
                                    <div class="flex items-center justify-end">

                                        <template x-if="item.type === 'switch' || item.type === 'light'">
                                            <div class="flex items-center justify-end gap-2 md:gap-3 shrink-0">
                                                <span class="font-mono text-[9px] md:text-xs"
                                                      :class="item.is_dead ? 'text-error font-bold' : (item.raw_value === null ? 'text-gray-500 italic' : (item.is_on ? 'text-warning font-bold animate-pulse' : 'text-base-500'))"
                                                      x-text="item.is_dead ? 'DEAD' : (item.raw_value === null ? 'SYNC...' : (item.is_on ? 'ON' : 'OFF'))"></span>
                                                <input type="checkbox" class="toggle toggle-sm md:toggle-md toggle-warning shadow shrink-0"
                                                       :disabled="item.raw_value === null || item.is_dead"
                                                       :checked="item.is_on"
                                                       @change="injectLabHubStateChange(item.id, $event.target.checked)" />
                                            </div>
                                        </template>

                                        <template x-if="item.type === 'door'">
                                            <div class="flex justify-end shrink-0">
                                                <span class="font-mono font-bold text-xs md:text-sm whitespace-nowrap"
                                                      :class="item.is_dead ? 'text-error' : (item.raw_value === null ? 'text-gray-500 italic' : (item.is_on ? 'text-error animate-pulse' : 'text-base-500'))"
                                                      x-text="item.is_dead ? 'DEAD' : (item.raw_value === null ? 'SYNC...' : (item.raw_value === 'OPEN' || item.raw_value === 'CLOSED' ? item.raw_value : (item.display_text || '—')))"></span>
                                            </div>
                                        </template>

                                        <template x-if="item.type === 'blinds'">
                                            <div class="flex items-center justify-end gap-1.5 md:gap-3 shrink-0">
                                                <span class="badge badge-neutral font-mono text-[8px] md:text-[11px] px-1 py-0 h-3.5 md:h-4 shrink-0 min-w-[1.75rem] justify-center"
                                                      :class="item.is_dead ? 'text-error font-bold' : ''"
                                                      x-text="item.is_dead ? 'DEAD' : (item.raw_value !== null ? item.raw_value + '%' : '--')"></span>
                                                <span class="hidden md:inline font-mono text-[10px] uppercase font-bold text-info cursor-pointer hover:text-primary transition-colors"
                                                      @click="setShutterState(item.id, 0)">OPEN</span>

                                                <input type="range" min="0" max="100" step="1" class="range range-info range-xs w-16 sm:w-20 md:w-32 shadow-inner shrink-0 touch-pan-y"
                                                       :disabled="item.raw_value === null || item.is_dead"
                                                       :value="item.raw_value !== null ? item.raw_value : 0"
                                                       @pointerdown="let t = $event.touches ? $event.touches[0] : $event; $el._startX = t.clientX; $el._startY = t.clientY; $el._verified = false; $el._orig = $el.value;"
                                                       @pointermove="if (!$el._verified && $el._startX) { let t = $event.touches ? $event.touches[0] : $event; let dx = Math.abs(t.clientX - $el._startX); let dy = Math.abs(t.clientY - $el._startY); if (dx > 10 && dx > dy) { $el._verified = true; } }"
                                                       @input="
                                                           if (!$el._verified) {
                                                               $event.target.value = $el._orig;
                                                               return;
                                                           }
                                                           updateShutterOptimistic(item.id, $event.target.value);
                                                       "
                                                       @change="
                                                           if (!$el._verified) {
                                                               $event.target.value = $el._orig;
                                                               return;
                                                           }
                                                           commitShutterDrag(item.id, $event.target.value, true);
                                                       "
                                                       @pointerup="commitShutterDrag(item.id, $el.value, $el._verified)"
                                                       @pointercancel="commitShutterDrag(item.id, $el.value, $el._verified)" />

                                                <span class="hidden md:inline font-mono text-[10px] uppercase font-bold text-error cursor-pointer hover:text-primary transition-colors"
                                                      @click="setShutterState(item.id, 100)">CLOSED</span>
                                            </div>
                                        </template>

                                        <template x-if="item.type === 'speaker'">
                                            <div class="flex items-center justify-end gap-1.5 md:gap-3 shrink-0">
                                                <span class="badge font-mono text-[8px] md:text-[11px] px-1 py-0 h-3.5 md:h-4 shrink-0 min-w-[1.75rem] justify-center transition-colors"
                                                      :class="item.is_dead ? 'badge-neutral text-error font-bold' : (item.is_on ? 'badge-success text-neutral-900 shadow-sm' : 'badge-neutral text-base-content/50')"
                                                      x-text="item.is_dead ? 'DEAD' : (item.display_text !== null ? item.display_text : '--')"></span>
                                                <span class="hidden md:inline font-mono text-[10px] uppercase font-bold text-success cursor-pointer hover:text-primary transition-colors"
                                                      @click="toggleSpeakerPower(item.id, true)">PLAY</span>

                                                <input type="range" min="0" :max="item.max_volume" step="1"
                                                       class="range range-success range-xs w-16 sm:w-20 md:w-32 shadow-inner shrink-0 cursor-pointer touch-pan-y"
                                                       :disabled="item.is_syncing || item.is_dead || !item.is_on"
                                                       :key="'spkvol-' + item.id + '-' + (item.ui_volume ?? 'x') + '-' + item.is_on + '-' + item.is_syncing"
                                                       :value="(!item.is_syncing && item.is_on && item.ui_volume !== undefined && item.ui_volume !== null) ? item.ui_volume : 0"
                                                       x-effect="if (!item.is_syncing && item.is_on && item.ui_volume !== undefined && item.ui_volume !== null) { $el.value = item.ui_volume }"
                                                       @pointerdown="let t = $event.touches ? $event.touches[0] : $event; $el._startX = t.clientX; $el._startY = t.clientY; $el._verified = false; $el._orig = $el.value;"
                                                       @pointermove="if (!$el._verified && $el._startX) { let t = $event.touches ? $event.touches[0] : $event; let dx = Math.abs(t.clientX - $el._startX); let dy = Math.abs(t.clientY - $el._startY); if (dx > 10 && dx > dy) { $el._verified = true; } }"
                                                       @input="
                                                           if (!$el._verified) {
                                                               $event.target.value = $el._orig;
                                                               return;
                                                           }
                                                           updateSpeakerOptimistic(item.id, $event.target.value);
                                                       "
                                                       @change="
                                                           if (!$el._verified) {
                                                               $event.target.value = $el._orig;
                                                               return;
                                                           }
                                                           setSpeakerVolume(item.id, parseInt($event.target.value, 10));
                                                       " />
                                                <span class="hidden md:inline font-mono text-[10px] uppercase font-bold text-warning cursor-pointer hover:text-primary transition-colors"
                                                      @click="toggleSpeakerPower(item.id, false)">PAUSE</span>
                                            </div>
                                        </template>

                                        <template x-if="item.type === 'temp'">
                                            <div class="flex justify-end shrink-0">
                                                <span class="font-mono font-bold text-xs md:text-sm whitespace-nowrap"
                                                      :class="item.is_dead ? 'text-error' : 'text-orange-400'"
                                                      x-text="item.is_dead ? 'DEAD' : (item.raw_value && item.raw_value.temp !== undefined ? parseFloat(item.raw_value.temp).toFixed(1) + ' °C' : '--.- °C')"></span>
                                            </div>
                                        </template>

                                        <template x-if="item.type === 'hum'">
                                            <div class="flex justify-end shrink-0">
                                                <span class="font-mono font-bold text-xs md:text-sm whitespace-nowrap"
                                                      :class="item.is_dead ? 'text-error' : 'text-info'"
                                                      x-text="item.is_dead ? 'DEAD' : (item.raw_value && item.raw_value.hum !== undefined ? item.raw_value.hum + ' %' : '-- %')"></span>
                                            </div>
                                        </template>

                                        <template x-if="item.type === 'temp_hum'">
                                            <div class="flex justify-end font-mono text-[10px] md:text-sm whitespace-nowrap shrink-0">
                                                <template x-if="item.is_dead">
                                                    <span class="font-bold text-error">DEAD</span>
                                                </template>
                                                <template x-if="!item.is_dead">
                                                    <div>
                                                        <span class="font-bold text-orange-400" x-text="item.raw_value && item.raw_value.temp !== undefined ? parseFloat(item.raw_value.temp).toFixed(1) + ' °C' : '--.- °C'"></span>
                                                        <span class="mx-1 text-base-content/50">/</span>
                                                        <span class="font-bold text-info" x-text="item.raw_value && item.raw_value.hum !== undefined ? item.raw_value.hum + ' %' : '-- %'"></span>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>

                                        <template x-if="item.type === 'power' || item.type === 'energy'">
                                            <div class="flex justify-end shrink-0">
                                                <span class="font-mono font-bold text-xs md:text-sm whitespace-nowrap"
                                                      :class="item.is_dead ? 'text-error' : (item.type === 'energy' ? 'text-success' : 'text-warning')"
                                                      x-text="item.display_text"></span>
                                            </div>
                                        </template>

                                        <template x-if="item.type === 'fluid'">
                                            <div class="flex justify-end shrink-0">
                                                <span class="font-mono font-bold text-xs md:text-sm whitespace-nowrap"
                                                      :class="item.is_dead ? 'text-error' : (isHotWaterItem(item) ? 'text-error' : 'text-info')"
                                                      x-text="item.display_text"></span>
                                            </div>
                                        </template>

                                        <template x-if="item.type === 'sensor'">
                                            <div class="flex items-center justify-end shrink-0">
                                                <span class="font-mono font-bold text-xs md:text-sm whitespace-nowrap"
                                                      :class="item.is_dead ? 'text-error' : (item.is_on === true ? 'text-error animate-pulse' : (item.is_on === false ? 'text-base-500' : 'text-success'))"
                                                      x-text="item.display_text"></span>
                                            </div>
                                        </template>

                                        <template x-if="item.type === 'scene'">
                                            <div class="flex justify-end shrink-0">
                                                <button class="btn btn-outline btn-accent btn-xs md:btn-sm font-mono tracking-widest text-[9px] md:text-xs px-3 md:px-6 shadow-sm"
                                                        @click="item.require_confirmation ? openSceneModal(item) : dispatchEvent(item.id)">
                                                    GO
                                                </button>
                                            </div>
                                        </template>

                                    </div>
                                </template>

                                <template x-if="explorerMode === 'history'">
                                    <div class="font-mono text-xs md:text-sm font-bold text-right whitespace-nowrap min-w-max">
                                        <template x-if="isWaterHistoryItem(item)">
                                            <div class="whitespace-nowrap">
                                                <span class="text-info"
                                                      x-text="'C ' + _waterLitersText(historyCapabilityByIdx[Number(item.id)]?.coldIdx)"></span>
                                                <span class="text-base-content/40"> · </span>
                                                <span class="text-error"
                                                      x-text="'H ' + _waterLitersText(historyCapabilityByIdx[Number(item.id)]?.hotIdx)"></span>
                                            </div>
                                        </template>
                                        <template x-if="!isWaterHistoryItem(item)">
                                            <div class="whitespace-nowrap"
                                                 :class="explorerHistoryValueClass(item)"
                                                 x-text="explorerHistoryValueText(item)"></div>
                                        </template>
                                    </div>
                                </template>

                            </div>
                        </div>

                        <template x-if="explorerMode === 'history' && isExplorerHistoryRowSelected(item)">
                            <div class="px-3 md:px-4 pb-4 pt-1 bg-base-200/40 border-t border-base-300" @click.stop>
                                <div class="flex flex-col gap-4">
                                    <div class="flex items-center justify-between gap-2">
                                        <h3 class="font-mono text-sm font-bold tracking-wider text-accent"
                                            x-text="'Detail: ' + (selectedSensorName || selectedSensorIdx)"></h3>
                                        <button type="button" class="btn btn-xs btn-ghost font-mono"
                                                @click="closeHistoryDetail()">Close</button>
                                    </div>

                                    <template x-if="selectedSensorKind === 'utility'">
                                        <div class="flex flex-col gap-4">
                                            <!-- Water: Cold / Hot / Total × periods -->
                                            <div class="grid grid-cols-1 md:grid-cols-3 gap-2 md:gap-3"
                                                 x-show="historySummary && historySummary.kind === 'water'">
                                                <div class="bg-base-100 border border-base-300 rounded-box p-3">
                                                    <div class="text-[10px] font-mono uppercase tracking-widest text-info mb-2">Cold</div>
                                                    <div class="flex flex-col gap-1 font-mono text-xs">
                                                        <div class="flex justify-between gap-2"><span class="text-base-content/40">Today</span><span class="font-bold" x-text="formatHistoryValue(historySummary?.cold?.today, 'L')"></span></div>
                                                        <div class="flex justify-between gap-2"><span class="text-base-content/40">Month</span><span class="font-bold" x-text="formatHistoryValue(historySummary?.cold?.month, 'L')"></span></div>
                                                        <div class="flex justify-between gap-2"><span class="text-base-content/40">Year</span><span class="font-bold" x-text="formatHistoryValue(historySummary?.cold?.year, 'L')"></span></div>
                                                        <div class="flex justify-between gap-2 border-t border-base-300 pt-1 mt-1"><span class="text-base-content/40">Total</span><span class="font-bold" x-text="historySummary?.cold?.total == null ? '—' : formatHistoryValue(historySummary?.cold?.total, 'L')"></span></div>
                                                    </div>
                                                </div>
                                                <div class="bg-base-100 border border-base-300 rounded-box p-3">
                                                    <div class="text-[10px] font-mono uppercase tracking-widest text-error mb-2">Hot</div>
                                                    <div class="flex flex-col gap-1 font-mono text-xs">
                                                        <div class="flex justify-between gap-2"><span class="text-base-content/40">Today</span><span class="font-bold" x-text="formatHistoryValue(historySummary?.hot?.today, 'L')"></span></div>
                                                        <div class="flex justify-between gap-2"><span class="text-base-content/40">Month</span><span class="font-bold" x-text="formatHistoryValue(historySummary?.hot?.month, 'L')"></span></div>
                                                        <div class="flex justify-between gap-2"><span class="text-base-content/40">Year</span><span class="font-bold" x-text="formatHistoryValue(historySummary?.hot?.year, 'L')"></span></div>
                                                        <div class="flex justify-between gap-2 border-t border-base-300 pt-1 mt-1"><span class="text-base-content/40">Total</span><span class="font-bold" x-text="historySummary?.hot?.total == null ? '—' : formatHistoryValue(historySummary?.hot?.total, 'L')"></span></div>
                                                    </div>
                                                </div>
                                                <div class="bg-base-100 border border-base-300 rounded-box p-3">
                                                    <div class="text-[10px] font-mono uppercase tracking-widest text-accent mb-2">Total</div>
                                                    <div class="flex flex-col gap-1 font-mono text-xs">
                                                        <div class="flex justify-between gap-2"><span class="text-base-content/40">Today</span><span class="font-bold text-accent" x-text="formatHistoryValue(historySummary?.today, 'L')"></span></div>
                                                        <div class="flex justify-between gap-2"><span class="text-base-content/40">Month</span><span class="font-bold" x-text="formatHistoryValue(historySummary?.month, 'L')"></span></div>
                                                        <div class="flex justify-between gap-2"><span class="text-base-content/40">Year</span><span class="font-bold" x-text="formatHistoryValue(historySummary?.year, 'L')"></span></div>
                                                        <div class="flex justify-between gap-2 border-t border-base-300 pt-1 mt-1"><span class="text-base-content/40">Total</span><span class="font-bold" x-text="historySummary?.total == null ? '—' : formatHistoryValue(historySummary?.total, 'L')"></span></div>
                                                    </div>
                                                </div>
                                            </div>
                                            <!-- Non-water utilities: single-series summary -->
                                            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 md:gap-3"
                                                 x-show="historySummary && historySummary.kind !== 'water'">
                                                <div class="bg-base-100 border border-base-300 rounded-box p-3">
                                                    <div class="text-[10px] font-mono uppercase tracking-widest text-base-content/40">Today</div>
                                                    <div class="text-lg font-black text-accent font-mono"
                                                         x-text="formatHistoryValue(historySummary?.today, historySummary?.display_unit)"></div>
                                                </div>
                                                <div class="bg-base-100 border border-base-300 rounded-box p-3">
                                                    <div class="text-[10px] font-mono uppercase tracking-widest text-base-content/40">This month</div>
                                                    <div class="text-lg font-black font-mono"
                                                         x-text="formatHistoryValue(historySummary?.month, historySummary?.display_unit)"></div>
                                                </div>
                                                <div class="bg-base-100 border border-base-300 rounded-box p-3">
                                                    <div class="text-[10px] font-mono uppercase tracking-widest text-base-content/40">This year</div>
                                                    <div class="text-lg font-black font-mono"
                                                         x-text="formatHistoryValue(historySummary?.year, historySummary?.display_unit)"></div>
                                                </div>
                                                <div class="bg-base-100 border border-base-300 rounded-box p-3">
                                                    <div class="text-[10px] font-mono uppercase tracking-widest text-base-content/40">Total</div>
                                                    <div class="text-lg font-black font-mono"
                                                         x-text="historySummary?.total == null ? '—' : formatHistoryValue(historySummary?.total, historySummary?.display_unit)"></div>
                                                </div>
                                            </div>
                                            <template x-if="historyHasDay">
                                                <section>
                                                    <h2 class="font-mono text-xs uppercase tracking-widest text-base-content/50 mb-2" x-text="historyDayTitle"></h2>
                                                    <div id="chart-day" class="hist-chart bg-base-100 rounded-box border border-base-300"></div>
                                                </section>
                                            </template>
                                            <template x-if="historyHasMonth">
                                                <section>
                                                    <h2 class="font-mono text-xs uppercase tracking-widest text-base-content/50 mb-2" x-text="historyMonthTitle"></h2>
                                                    <div id="chart-month" class="hist-chart bg-base-100 rounded-box border border-base-300"></div>
                                                </section>
                                            </template>
                                            <template x-if="historyHasYear">
                                                <section>
                                                    <h2 class="font-mono text-xs uppercase tracking-widest text-base-content/50 mb-2" x-text="historyYearTitle"></h2>
                                                    <div id="chart-year" class="hist-chart bg-base-100 rounded-box border border-base-300"></div>
                                                </section>
                                            </template>
                                        </div>
                                    </template>

                                    <template x-if="selectedSensorKind === 'climate' || selectedSensorKind === 'host'">
                                        <div class="flex flex-col gap-4">
                                            <template x-if="historyHasDay">
                                                <section>
                                                    <h2 class="font-mono text-xs uppercase tracking-widest text-base-content/50 mb-2" x-text="historyDayTitle"></h2>
                                                    <div id="chart-day" class="hist-chart bg-base-100 rounded-box border border-base-300"></div>
                                                </section>
                                            </template>
                                            <template x-if="historyHasMonth">
                                                <section>
                                                    <h2 class="font-mono text-xs uppercase tracking-widest text-base-content/50 mb-2" x-text="historyMonthTitle"></h2>
                                                    <div id="chart-month" class="hist-chart bg-base-100 rounded-box border border-base-300"></div>
                                                </section>
                                            </template>
                                            <template x-if="historyHasYear">
                                                <section>
                                                    <h2 class="font-mono text-xs uppercase tracking-widest text-base-content/50 mb-2" x-text="historyYearTitle"></h2>
                                                    <div id="chart-year" class="hist-chart bg-base-100 rounded-box border border-base-300"></div>
                                                </section>
                                            </template>
                                        </div>
                                    </template>

                                    <template x-if="selectedSensorKind === 'actuator'">
                                        <div class="flex flex-col gap-4">
                                            <template x-if="actuatorHasDay">
                                                <section>
                                                    <h2 class="font-mono text-xs uppercase tracking-widest text-base-content/50 mb-2" x-text="actuatorDayTitle">Level / hits last 24 hours</h2>
                                                    <div id="chart-act-day" class="hist-chart bg-base-100 rounded-box border border-base-300"></div>
                                                </section>
                                            </template>
                                            <template x-if="actuatorHasMonth">
                                                <section>
                                                    <h2 class="font-mono text-xs uppercase tracking-widest text-base-content/50 mb-2" x-text="actuatorMonthTitle">Last month (counts + level)</h2>
                                                    <div id="chart-act-month" class="hist-chart bg-base-100 rounded-box border border-base-300"></div>
                                                </section>
                                            </template>
                                            <template x-if="actuatorHasYear">
                                                <section>
                                                    <h2 class="font-mono text-xs uppercase tracking-widest text-base-content/50 mb-2" x-text="actuatorYearTitle">Last year (counts + level)</h2>
                                                    <div id="chart-act-year" class="hist-chart bg-base-100 rounded-box border border-base-300"></div>
                                                </section>
                                            </template>
                                            <p class="font-mono text-xs text-base-content/40 italic"
                                               x-show="!actuatorHasDay && !actuatorHasMonth && !actuatorHasYear">
                                                No history data for this period.
                                            </p>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </li>
                </template>

                <li x-show="explorerActiveList.length === 0" class="p-6 text-center text-base-400 font-mono text-xs md:text-sm italic w-full"
                    x-text="'No hardware nodes match the current filter criteria.'"></li>
            </ul>
        </div>

        <div data-wanos-light-modal></div>

        <dialog id="scene_confirm_modal" class="modal modal-bottom sm:modal-middle backdrop-blur-sm z-[9999]">
            <div class="modal-box border border-accent/20 bg-base-300 shadow-2xl text-center flex flex-col gap-4">
                <h3 class="font-black text-xl text-base-content tracking-wider">Execute Scene?</h3>
                <p class="text-accent font-mono font-bold text-lg p-4 bg-base-200 rounded-box shadow-inner uppercase tracking-widest truncate" x-text="activeSceneName"></p>

                <div class="modal-action border-t border-base-200 pt-4 mt-2">
                    <form method="dialog" class="w-full flex justify-between gap-4">
                        <button class="btn btn-outline flex-1 font-mono text-base-content/70">Cancel</button>
                        <button type="button" class="btn btn-accent flex-1 font-mono shadow-md text-neutral-900 font-bold tracking-wider" @click="confirmSceneExecution()">CONFIRM & EXECUTE</button>
                    </form>
                </div>
            </div>
            <form method="dialog" class="modal-backdrop">
                <button>close</button>
            </form>
        </dialog>

        <dialog id="preset_save_modal" class="modal modal-bottom sm:modal-middle backdrop-blur-sm z-[9999]">
            <div class="modal-box border border-primary/20 bg-base-300 shadow-2xl text-center">
                <h3 class="font-black text-lg text-base-content tracking-wider mb-2">Save Preset</h3>
                <p class="text-sm text-base-content/70 mb-6">Wil je de huidige filters bewaren in <span class="font-bold text-primary">preset <span x-text="(activePresetSlot !== null ? activePresetSlot + 1 : '')"></span></span>?</p>
                <div class="modal-action">
                    <form method="dialog" class="w-full flex justify-between gap-4">
                        <button class="btn btn-outline flex-1 font-mono text-base-content/70" @click="activePresetSlot = null">Cancel</button>
                        <button type="button" class="btn btn-primary flex-1 font-mono shadow-md text-primary-content font-bold" @click="confirmSavePreset()">SAVE PRESET</button>
                    </form>
                </div>
            </div>
            <form method="dialog" class="modal-backdrop">
                <button @click="activePresetSlot = null">close</button>
            </form>
        </dialog>

        <dialog id="preset_edit_modal" class="modal modal-bottom sm:modal-middle backdrop-blur-sm z-[9999]">
            <div class="modal-box border border-base-content/10 bg-base-300 shadow-2xl">
                <h3 class="font-bold text-lg border-b border-base-200 pb-2 mb-4">Manage Presets</h3>

                <div class="flex flex-col gap-3">
                    <template x-for="(preset, index) in presets" :key="index">
                        <div class="flex items-center justify-between p-3 bg-base-200 rounded-box border border-base-300">
                            <div class="flex items-center gap-3 overflow-hidden">
                                <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0"
                                      :class="preset !== null ? 'bg-primary text-primary-content' : 'bg-base-300 text-base-content/30'"
                                      x-text="index + 1"></span>
                                <span class="font-mono text-xs truncate"
                                      :class="preset === null ? 'text-base-content/40 italic' : 'text-base-content/90'"
                                      x-text="getPresetSummary(index)"></span>
                            </div>
                            <button class="btn btn-xs btn-circle btn-error btn-outline shrink-0 ml-2"
                                    x-show="preset !== null"
                                    title="Remove Preset"
                                    @click="removePreset(index)">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                            </button>
                        </div>
                    </template>
                </div>

                <div class="modal-action border-t border-base-200 pt-4 mt-6">
                    <form method="dialog" class="w-full">
                        <button class="btn btn-outline btn-block btn-sm font-mono text-base-content/70">Close</button>
                    </form>
                </div>
            </div>
            <form method="dialog" class="modal-backdrop">
                <button>close</button>
            </form>
        </dialog>

        <div class="toast toast-bottom toast-center z-[99999]" x-show="toastMessage !== ''" x-transition x-cloak>
            <div class="alert alert-error shadow-lg">
                <span class="font-mono text-xs font-bold text-error-content" x-text="toastMessage"></span>
            </div>
        </div>

    </main>
    <script src="wanos-shell.js?v=14"></script>
    <script src="app.js?v=3.41"></script>
</body>
</html>
