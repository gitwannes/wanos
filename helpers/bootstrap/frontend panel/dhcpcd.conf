# /etc/dhcpcd.conf
# Minimal, practical dhcpcd configuration for Wannes' Raspberry Pi / Debian systems.

# -> Keep this dhcpd manager for all interface.
# ps aux | egrep 'dhcpcd|dhclient' | grep -v grep
# -> Do not also let NetworkManager or systemd‑networkd manage the interfaces.
# systemctl is-active NetworkManager
# systemctl is-active systemd-networkd || networkctl list

# Basic behaviour
hostname                # advertise system hostname via DHCP
clientid                # use hardware address for DHCPv4 client id
persistent              # keep interface configuration when dhcpcd exits
option rapid_commit     # speed up DHCP where server supports it
option domain_name_servers, domain_name, domain_search, host_name
option classless_static_routes
option ntp_servers
option interface_mtu
require dhcp_server_identifier
slaac private

# -------------------------
# Sstatic IP for eth0
# -------------------------
#interface eth0
#static ip_address=10.32.251.30/24
#static routers=10.32.251.161
#static domain_name_servers=1.1.1.1 8.8.8.8
# Optional: set a metric so eth0 is preferred over wlan0 when both up
# metric 200

# -------------------------
# Static IP for wlan0
# -------------------------
#interface wlan0
#static ip_address=10.32.251.28/24
#static routers=10.32.251.161
#static domain_name_servers=1.1.1.1 8.8.8.8
#metric 300

# Apply fallback to eth0 if DHCP fails
#interface eth0
#fallback static_fallback

# -------------------------
# Useful operational options
# -------------------------
# A hook script is provided to lookup the hostname if not set by the DHCP
# server, but it should not be run by default.
nohook lookup-hostname
# denyinterfaces <if>   # prevent dhcpcd from managing an interface (e.g. when NetworkManager manages it)
# nohook wpa_supplicant  # prevent dhcpcd from running wpa_supplicant hooks for wlan0
# profile <name>        # select a profile programmatically if needed
