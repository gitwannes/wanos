# --- file: helpers/bootstrap/backend/wanos.nginx.conf ---
# Template installed by wanos_bootstrap_phase1/2 -> /etc/nginx/sites-available/wanos
# Placeholders:
#   __SSL_CERTIFICATE__      e.g. /etc/letsencrypt/live/app.wanos.be/fullchain.pem
#   __SSL_CERTIFICATE_KEY__  e.g. /etc/letsencrypt/live/app.wanos.be/privkey.pem
# Uvicorn listens on 127.0.0.1:8080 (wanos.service).

# Legacy port 8000 -> HTTPS
server {
    listen 8000;
    server_name app.wanos.be;
    return 301 https://$host$request_uri;
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name app.wanos.be;
    return 301 https://$host$request_uri;
}

# Main HTTPS reverse proxy (SSE-friendly)
server {
    listen 443 ssl http2;
    server_name app.wanos.be;

    ssl_certificate     __SSL_CERTIFICATE__;
    ssl_certificate_key __SSL_CERTIFICATE_KEY__;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
