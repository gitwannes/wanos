<!DOCTYPE html>
<!--
  Minimal standalone Blockly snap + uniqueness test for Blocky.
  Open this file directly in the browser (double-click). Dummy data only.
-->
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Blockly snap test (minimal)</title>
    <script src="https://unpkg.com/blockly@13.2.1/blockly.min.js"></script>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; font-size: 13px; }
        #bar { padding: 6px 10px; background: #222; color: #eee; }
        #bar b { color: #ffd34d; }
        #canvas { width: 100vw; height: 70vh; position: relative; overflow: hidden; }
        #canvas .injectionDiv { width: 100%; height: 100%; }
        #canvas svg, .blocklySvg { max-width: none !important; max-height: none !important; }
        #log { height: calc(30vh - 40px); overflow: auto; padding: 6px 10px; background: #f4f4f4;
               font-family: monospace; font-size: 12px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div id="bar">
    Blockly <b id="ver">?</b> &nbsp;|&nbsp; canvas <b id="dims">?</b>
    &nbsp;|&nbsp;
    <button onclick="seed()">Rebuild</button>
    <button onclick="clearAll()">Clear</button>
    <br />
    Grab by the <b>coloured body</b> · drag into the green notches · drag away to un-snap ·
    drop on the <b>trash</b> (bottom-right) to delete.
    Toolbox hides trigger/branch once used; duplicate conditions/actions vanish silently.
</div>
<div id="canvas"></div>
<div id="log"></div>

<script>
const DEVICES = [["Buro light", "light.buro"], ["PC monitors", "switch.pc_monitors"], ["Bathroom hue", "hue.group.badk_1e_hue"]];
const EVENTS = [["Cinema ON", "SCENE_CINEMA_ON"], ["Cinema OFF", "SCENE_CINEMA_OFF"]];

Blockly.Blocks.t_trigger = {
    init() {
        this.appendDummyInput()
            .appendField("When device")
            .appendField(new Blockly.FieldDropdown(DEVICES), "ENTITY");
        this.setColour(230);
    }
};
const container = (title, colour) => ({
    init() {
        this.appendDummyInput().appendField(title);
        this.appendDummyInput().appendField("conditions");
        this.appendStatementInput("CONDS").setCheck("Condition");
        this.appendDummyInput().appendField("actions");
        this.appendStatementInput("ACTIONS").setCheck("Action");
        this.setColour(colour);
        this.setInputsInline(false);
    }
});
Blockly.Blocks.t_branch_on = container("ON branch", 120);
Blockly.Blocks.t_branch_off = container("OFF branch", 20);
Blockly.Blocks.t_cond_device = {
    init() {
        this.appendDummyInput()
            .appendField("if device")
            .appendField(new Blockly.FieldDropdown(DEVICES), "ENTITY")
            .appendField("is")
            .appendField(new Blockly.FieldDropdown([["ON", "ON"], ["OFF", "OFF"]]), "STATE");
        this.setPreviousStatement(true, "Condition");
        this.setNextStatement(true, "Condition");
        this.setColour(60);
    }
};
Blockly.Blocks.t_cond_time = {
    init() {
        this.appendDummyInput()
            .appendField("if time is")
            .appendField(new Blockly.FieldDropdown([["dark", "dark"], ["light", "light"]]), "TOD");
        this.setPreviousStatement(true, "Condition");
        this.setNextStatement(true, "Condition");
        this.setColour(60);
    }
};
Blockly.Blocks.t_act_device = {
    init() {
        this.appendDummyInput()
            .appendField("set device")
            .appendField(new Blockly.FieldDropdown(DEVICES), "ENTITY")
            .appendField("to")
            .appendField(new Blockly.FieldDropdown([["ON", "ON"], ["OFF", "OFF"], ["SYNC", "SYNC"]]), "STATE");
        this.setPreviousStatement(true, "Action");
        this.setNextStatement(true, "Action");
        this.setColour(290);
    }
};
Blockly.Blocks.t_act_event = {
    init() {
        this.appendDummyInput()
            .appendField("fire event")
            .appendField(new Blockly.FieldDropdown(EVENTS), "EVENT");
        this.setPreviousStatement(true, "Action");
        this.setNextStatement(true, "Action");
        this.setColour(290);
    }
};

function toolboxFor(present) {
    const p = present || new Set();
    const contents = [];
    if (!p.has("t_trigger")) {
        contents.push({ kind: "category", name: "Trigger", colour: "#5C81A6",
            contents: [{ kind: "block", type: "t_trigger" }] });
    }
    const branches = [];
    if (!p.has("t_branch_on")) branches.push({ kind: "block", type: "t_branch_on" });
    if (!p.has("t_branch_off")) branches.push({ kind: "block", type: "t_branch_off" });
    if (branches.length) contents.push({ kind: "category", name: "Branches", colour: "#5CA65C", contents: branches });
    contents.push({ kind: "category", name: "Conditions", colour: "#A6745C", contents: [
        { kind: "block", type: "t_cond_device" }, { kind: "block", type: "t_cond_time" }] });
    contents.push({ kind: "category", name: "Actions", colour: "#A65C81", contents: [
        { kind: "block", type: "t_act_device" }, { kind: "block", type: "t_act_event" }] });
    return { kind: "categoryToolbox", contents };
}

const host = document.getElementById("canvas");
const ws = Blockly.inject(host, {
    toolbox: toolboxFor(new Set()),
    trashcan: true,
    scrollbars: true,
    move: { scrollbars: true, drag: true, wheel: true },
    zoom: { controls: true, wheel: false, startScale: 1.0 }
});
window.ws = ws;

new ResizeObserver(() => Blockly.svgResize(ws)).observe(host);
window.addEventListener("resize", () => Blockly.svgResize(ws));
Blockly.svgResize(ws);

const logEl = document.getElementById("log");
function log(msg) {
    logEl.textContent = new Date().toLocaleTimeString() + "  " + msg + "\n" + logEl.textContent;
}

function fingerprint(b) {
    if (!b) return "";
    if (b.type === "t_trigger") return "trigger";
    if (b.type === "t_branch_on") return "branch:on";
    if (b.type === "t_branch_off") return "branch:off";
    try {
        if (b.type === "t_cond_device") return "cond:device:" + b.getFieldValue("ENTITY") + ":" + b.getFieldValue("STATE");
        if (b.type === "t_cond_time") return "cond:time:" + b.getFieldValue("TOD");
        if (b.type === "t_act_device") return "act:device:" + b.getFieldValue("ENTITY") + ":" + b.getFieldValue("STATE");
        if (b.type === "t_act_event") return "act:event:" + b.getFieldValue("EVENT");
    } catch (e) { return ""; }
    return "";
}

function refreshToolbox() {
    const present = new Set(ws.getAllBlocks(false).map((b) => b.type));
    ws.updateToolbox(toolboxFor(present));
}

let enforcing = false;
let seeding = false;
let uniquenessScheduled = false;
let pendingFieldEv = null;

function enforceUniqueness(forceToolbox) {
    if (seeding || enforcing) return;
    enforcing = true;
    const Events = Blockly.Events;
    const wasEnabled = Events.isEnabled();
    const fieldEv = pendingFieldEv;
    pendingFieldEv = null;
    let changed = !!forceToolbox;
    try {
        Events.disable();
        if (fieldEv && fieldEv.element === "field" && fieldEv.blockId) {
            const changedBlk = ws.getBlockById(fieldEv.blockId);
            if (changedBlk) {
                const fp = fingerprint(changedBlk);
                const other = fp && ws.getAllBlocks(false).find((b) => b.id !== changedBlk.id && fingerprint(b) === fp);
                if (other) {
                    try { changedBlk.setFieldValue(fieldEv.oldValue, fieldEv.name); } catch (e) {}
                    changed = true;
                }
            }
        }
        const seen = new Map();
        const toDispose = [];
        ws.getAllBlocks(false).forEach((b) => {
            const fp = fingerprint(b);
            if (!fp) return;
            if (seen.has(fp)) toDispose.push(b);
            else seen.set(fp, b.id);
        });
        toDispose.forEach((b) => { try { b.dispose(false); changed = true; } catch (e) {} });
        if (toDispose.length) log("removed " + toDispose.length + " duplicate(s) (silent)");
    } finally {
        if (wasEnabled) Events.enable();
        if (!Events.isEnabled()) Events.enable();
        enforcing = false;
        if (changed) refreshToolbox();
    }
}

ws.addChangeListener((e) => {
    if (e.type === Blockly.Events.BLOCK_MOVE) {
        const b = ws.getBlockById(e.blockId);
        if (b) {
            if (e.newParentId && !e.oldParentId) log("SNAPPED  " + b.type);
            else if (!e.newParentId && e.oldParentId) log("UN-SNAPPED  " + b.type);
        }
    }
    if (seeding || (e && e.isUiEvent)) return;
    const t = e.type;
    const isCreate = t === Blockly.Events.BLOCK_CREATE;
    const isChange = t === Blockly.Events.BLOCK_CHANGE && e.element === "field";
    const isMoveConnect = t === Blockly.Events.BLOCK_MOVE && e.newParentId;
    const isDelete = t === Blockly.Events.BLOCK_DELETE;
    if (isChange) pendingFieldEv = e;
    if (!isCreate && !isChange && !isMoveConnect && !isDelete) return;
    if (uniquenessScheduled) return;
    uniquenessScheduled = true;
    setTimeout(() => {
        uniquenessScheduled = false;
        enforceUniqueness(isCreate || isDelete);
    }, 0);
});

function mk(type, fields, x, y) {
    const b = ws.newBlock(type);
    if (fields) Object.keys(fields).forEach((n) => { try { b.setFieldValue(fields[n], n); } catch (e) {} });
    b.initSvg();
    if (b.queueRender) b.queueRender(); else b.render();
    b.moveBy(x, y);
    return b;
}

function seed() {
    seeding = true;
    const Events = Blockly.Events;
    const was = Events.isEnabled();
    Events.disable();
    try {
        ws.clear();
        mk("t_trigger", null, 30, 20);
        const branch = mk("t_branch_on", null, 30, 90);
        const cond = mk("t_cond_device", null, 420, 120);
        const act = mk("t_act_device", null, 420, 190);
        // leave cond/act loose so you can drag them in by hand
        void branch; void cond; void act;
        if (ws.render) ws.render();
        Blockly.svgResize(ws);
        refreshToolbox();
        log("Rebuilt (app-style create + connect path).");
    } finally {
        if (was) Events.enable();
        if (!Events.isEnabled()) Events.enable();
        seeding = false;
    }
}

function clearAll() {
    seeding = true;
    ws.clear();
    refreshToolbox();
    seeding = false;
    log("Cleared.");
}

seed();

document.getElementById("ver").textContent = Blockly.VERSION || "unknown";
const r = host.getBoundingClientRect();
const m = ws.getMetrics();
document.getElementById("dims").textContent =
    Math.round(r.width) + "x" + Math.round(r.height) + " (view " + Math.round(m.viewWidth) + "x" + Math.round(m.viewHeight) + ")";
log("Ready. Try adding a second ON branch from the toolbox — it should disappear from the toolbox after the first is placed.");
</script>
</body>
</html>
